name: HAK full document and workflow validation
on:
  push:
    branches: [main, codex/hak-integration-20261017]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  full-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real document and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc poppler-utils zip unzip fonts-liberation fonts-dejavu fonts-crosextra-carlito
          python -m pip install python-docx openpyxl lxml
          npm ci
          npx playwright install --with-deps chromium
      - name: Record tool versions
        run: |
          node --version
          python --version
          soffice --version
          pdftotext -v
      - run: npm run check
      - name: Full suite including independent document and real PDF checks
        run: node tools/full-test.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        # Artifact chỉ là bằng chứng kèm theo: hết dung lượng lưu trữ (repo riêng tư có hạn mức) không được làm đỏ CI khi test đã đạt.
        continue-on-error: true
        with:
          name: hak-full-validation-evidence
          retention-days: 3
          path: |
            kiem_thu/ket_qua_full/
            reports/quality-report.json
            reports/dashboard.html
