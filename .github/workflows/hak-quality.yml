name: HAK quality and Apps Script regression
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hak-quality-node-${{ matrix.node }}
          path: |
            reports/quality-report.json
            reports/dashboard.html
            kiem_thu/ket_qua_hak/*.log
            kiem_thu/ket_qua_hak/summary.json
