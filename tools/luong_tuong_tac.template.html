<style>
#ldd-live{--flow-accent:#168baf;--flow-warn:#bb7100;margin:16px 0 28px;color:var(--text-primary);background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:20px}#ldd-live .flow-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#ldd-live button,#ldd-live select{font:inherit;color:var(--text-primary);background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:9px 14px;cursor:pointer}#ldd-live button:focus-visible,#ldd-live select:focus-visible{outline:3px solid var(--flow-accent)}#ldd-live .flow-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:18px;margin-top:20px}#ldd-live .flow-tools label{max-width:100%}#ldd-live select{max-width:100%}#ldd-live .flow-layout>*{min-width:0}#ldd-live .flow-canvas{overflow:auto;max-height:650px;border-radius:12px;background:var(--content-bg)}#ldd-live #flow-svg{width:100%;min-width:460px;display:block}#ldd-live .flow-link{stroke:var(--card-border);stroke-width:3;fill:none}#ldd-live .flow-link.active{stroke:var(--flow-accent);stroke-dasharray:8 8;animation:flow-dash 1s linear infinite}#ldd-live .flow-dot{fill:var(--flow-accent)}#ldd-live .flow-node rect{fill:var(--card-bg);stroke:var(--card-border);stroke-width:2}#ldd-live .flow-node text{fill:var(--text-primary);font:14px sans-serif;pointer-events:none}#ldd-live .flow-node{cursor:pointer;outline:none}#ldd-live .flow-node.active rect,#ldd-live .flow-node:focus rect{stroke:var(--flow-accent);stroke-width:4}#ldd-live .flow-node.blocked rect{stroke:var(--flow-warn)}#ldd-live .flow-inspect{overflow-wrap:anywhere;border-left:3px solid var(--flow-accent);padding:0 16px}#ldd-live .flow-inspect h3{margin-top:0}#ldd-live[data-paused="true"] .flow-link{animation-play-state:paused}#ldd-live .flow-status{min-height:26px;font-weight:600;margin-top:12px}@keyframes flow-dash{to{stroke-dashoffset:-32}}@media(max-width:760px){#ldd-live .flow-layout{grid-template-columns:1fr}#ldd-live{padding:12px}}@media(prefers-reduced-motion:reduce){#ldd-live .flow-link.active{animation:none}}
</style>
<section id="ldd-live" aria-label="Sơ đồ luồng dữ liệu tương tác" data-paused="true">
<h2>Luồng dữ liệu tương tác</h2><p>Tín hiệu mô phỏng • Bấm một điểm để xem đầu vào, đầu ra và kiểm soát. Không phải trạng thái giao dịch trực tiếp.</p>
<div class="flow-tools"><label>Nhánh <select id="flow-branch"><option value="loan">Hồ sơ → Giải ngân → Trả nợ</option><option value="insurance">Tài sản → Bảo hiểm</option></select></label><label>Tình huống <select id="flow-case"><option value="ok">Hợp lệ</option><option value="conflict">Xung đột phiên bản</option></select></label><button type="button" id="flow-play">▶ Chạy mô phỏng</button><button type="button" id="flow-next">Bước tiếp →</button><button type="button" id="flow-reset">Về đầu</button></div>
<div id="flow-status" class="flow-status" role="status" aria-live="polite"></div><div class="flow-layout"><div class="flow-canvas"><svg id="flow-svg" viewBox="0 0 640 620" role="group" aria-label="Các điểm xử lý dữ liệu"></svg></div><aside id="flow-inspect" class="flow-inspect" aria-label="Chi tiết điểm được chọn"></aside></div>
</section>
<script>
(function(){
var schema=__FLOW_SCHEMA__,root=document.getElementById('ldd-live'),svg=document.getElementById('flow-svg'),inspect=document.getElementById('flow-inspect'),status=document.getElementById('flow-status'),play=document.getElementById('flow-play'),branch=document.getElementById('flow-branch'),scenario=document.getElementById('flow-case');
var paths={loan:[['Nhập hồ sơ','Hợp đồng hiệu lực, USD/VND và người thụ hưởng','Yêu cầu lưu hồ sơ cùng chi tiết',['HoSoGiaiNgan','ChiTietThuHuong']],['Kiểm soát trước ghi','Vai trò, số tiền, phiên bản đang sửa','Cho phép ghi hoặc trả lỗi để người dùng sửa',['HoSoGiaiNgan']],['Lưu cha và con','Dữ liệu đã kiểm tra','Hồ sơ + chi tiết; nhật ký ghi dở hỗ trợ phục hồi',['HoSoGiaiNgan','ChiTietThuHuong']],['Chứng từ / kiểm duyệt','Hồ sơ đã lưu, mẫu và cấu hình duyệt','Chứng từ và kết quả duyệt; chưa phải giải ngân',['LichSuPhatHanhTaiLieu','PheDuyetGiaiNgan']],['Xác nhận → Trả nợ','Giao dịch ngân hàng và ngày thực tế','Xác nhận giải ngân, sổ trả nợ và trạng thái',['XacNhanGiaiNgan','TraNoHoSo']],['Đối soát / Báo cáo','Giải ngân, trả nợ, ngày báo cáo, tỷ giá','Dư nợ nguyên tệ và báo cáo quy đổi',['ChotBaoCaoLai','ChotBaoCaoLaiCT']]],insurance:[['Chọn hợp đồng / Tài sản','Hợp đồng và tài sản bảo đảm','Đúng mã tài sản để gắn bảo hiểm',['TaiSanBaoDam']],['Kiểm soát trước ghi','Ngày, số tiền, quyền, revision đang xem','Dữ liệu hợp lệ hoặc lỗi xung đột',['BaoHiemTaiSan']],['Ghi chi tiết thế hệ mới','Hợp đồng bảo hiểm và các kỳ chi tiết','Các dòng thế hệ mới, chưa chuyển bản cha',['BaoHiemTaiSanChiTiet']],['Đọc lại xác minh','Số dòng và nội dung vừa ghi','Xác nhận khớp trước khi chuyển thế hệ',['BaoHiemTaiSanChiTiet','GiaoDichBaoHiem']],['Chốt bản cha','Chi tiết đã xác minh','Bản cha trỏ thế hệ mới; giữ dấu vết',['BaoHiemTaiSan','GiaoDichBaoHiem']],['Theo dõi bảo hiểm','Bản cha và thế hệ chi tiết đang hiệu lực','Theo dõi thời hạn, khoảng trống; hủy giữ lịch sử',['BaoHiemTaiSan','TaiSanBaoDam']]]};
var index=0,timer=null;var coords=[[30,25],[350,25],[350,220],[30,220],[30,415],[350,415]];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function stop(){clearInterval(timer);timer=null;root.dataset.paused='true';play.textContent='▶ Chạy mô phỏng';}
function draw(){var nodes=paths[branch.value],h='';for(var i=0;i<5;i++){var a=coords[i],b=coords[i+1];h+='<path class="flow-link'+(i===index-1?' active':'')+'" d="M '+(a[0]+125)+' '+(a[1]+70)+' L '+(b[0]+125)+' '+(b[1]+70)+'"/>';}
nodes.forEach(function(n,i){var p=coords[i];h+='<g class="flow-node'+(i===index?' active':'')+(i===1&&scenario.value==='conflict'&&index===1?' blocked':'')+'" tabindex="0" role="button" aria-pressed="'+(i===index)+'" aria-label="'+esc('Bước '+(i+1)+': '+n[0])+'" data-point="'+i+'"><rect x="'+p[0]+'" y="'+p[1]+'" width="250" height="140" rx="14"/><text x="'+(p[0]+18)+'" y="'+(p[1]+35)+'">'+(i+1)+' · '+esc(n[0])+'</text><text x="'+(p[0]+18)+'" y="'+(p[1]+70)+'">'+(i===index?'● Đang xem điểm này':'Bấm để xem chi tiết')+'</text><text x="'+(p[0]+18)+'" y="'+(p[1]+108)+'">'+(i===1&&scenario.value==='conflict'&&index===1?'⚠ Dừng: phiên bản đã thay đổi':'Dữ liệu → Kiểm soát → Kết quả')+'</text></g>';});svg.innerHTML=h;
var n=nodes[index];inspect.innerHTML='<h3>'+esc(n[0])+'</h3><strong>Đầu vào</strong><p>'+esc(n[1])+'</p><strong>Đầu ra</strong><p>'+esc(n[2])+'</p><strong>Bảng và quy tắc trong code</strong>'+n[3].map(function(name){var b=schema.filter(function(x){return x.sheet===name})[0];return b?'<h4>'+esc(name)+'</h4><p>Khóa: '+esc(b.pk.join(' + '))+'</p><p>Phiên bản: '+esc(b.phienBan)+'</p><p>Ghi: '+esc(b.ghi.join('; '))+'</p><p>Xóa: '+esc(b.xoa)+'</p>':''}).join('');status.textContent=scenario.value==='conflict'&&index===1?'⚠ Mô phỏng: phát hiện phiên bản cũ — dừng trước khi ghi, tải lại dữ liệu.':'Mô phỏng • Bước '+(index+1)+' / 6 · '+n[0];}
function next(){if(scenario.value==='conflict'&&index===1){stop();return;}if(index===5){stop();return;}index++;draw();if(index===5||(scenario.value==='conflict'&&index===1))stop();}
svg.addEventListener('click',function(e){var n=e.target.closest('[data-point]');if(n){stop();index=Number(n.dataset.point);draw();}});svg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();var n=e.target.closest('[data-point]');if(n){stop();index=Number(n.dataset.point);draw();svg.querySelector('[data-point="'+index+'"]').focus();}}});
play.onclick=function(){if(timer){stop();return;}if(index===5||(scenario.value==='conflict'&&index===1)){index=0;draw();}root.dataset.paused='false';play.textContent='Ⅱ Tạm dừng';timer=setInterval(function(){if(document.hidden||document.getElementById('tab-luongdulieu')&&document.getElementById('tab-luongdulieu').style.display==='none'){stop();return;}next();},1400);};document.getElementById('flow-next').onclick=function(){stop();next();};function reset(){stop();index=0;draw();}document.getElementById('flow-reset').onclick=reset;branch.onchange=reset;scenario.onchange=reset;document.addEventListener('visibilitychange',function(){if(document.hidden)stop();});draw();
})();
</script>
