    } else {
      if (!TAI_LIEU_DANH_SACH.length) {
        body.innerHTML = '<div class="msg msg-err">Không tìm thấy dòng lương nào trong Bảng lương (có thể tất cả đã được dùng ở hồ sơ khác, ' +
          'hoặc chưa cấu hình đúng file Bảng lương — xem hằng số SS_BANG_LUONG_ID ở Code.gs).</div>';
        return;
      }
      var html2 = '<div style="max-height:340px; overflow:auto;"><table class="detail"><thead><tr>' +
        '<th style="width:26px;"></th><th>Họ và tên</th><th>Tháng</th><th style="text-align:right;">Số tiền (VND)</th>' +
        '</tr></thead><tbody>';
      TAI_LIEU_DANH_SACH.forEach(function (it, i) {
        html2 += '<tr>' +
          '<td style="text-align:center;"><input type="checkbox" class="chk-taillieu" data-idx="' + i + '"></td>' +
          '<td>' + esc(it.hoTen) + '</td>' +
          '<td>' + esc(it.thang) + '</td>' +
          '<td style="text-align:right;">' + fmtTien((Number(it.soTien) || 0)) + '</td>' +
          '</tr>';
      });
      html2 += '</tbody></table></div>';
      body.innerHTML = html2;
    }
  }

  function apDungChonTaiLieu() {
    var checked = Array.prototype.slice.call(document.querySelectorAll('.chk-taillieu:checked'));
    if (!checked.length) {
      baoLoi('Vui lòng chọn ít nhất 1 dòng.');
      return;
    }
    checked.sort(function (a, b) { return Number(a.dataset.idx) - Number(b.dataset.idx); });
    var tr = document.getElementById(TAI_LIEU_ROW_ID);
    if (!tr) { dongModalTaiLieu(); return; }

    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') {
      var soHDs = [], ngays = [], tongGiaTri = 0;
      checked.forEach(function (chk) {
        var it = TAI_LIEU_DANH_SACH[Number(chk.dataset.idx)];
        if (!it) return;
        soHDs.push(it.sohd);
        ngays.push(it.ngay);
        tongGiaTri += Number(it.giaTri) || 0;
      });
      tr.querySelector('.ct-tlso').value = soHDs.join(', ');
      tr.querySelector('.ct-ngaytl').value = ngays.join(', ');
      // Gợi ý "Số tiền" = tổng Giá trị (cột O) của các hoá đơn đã chọn — vẫn có thể tự gõ số khác sau đó.
      tr.querySelector('.ct-sotien').value = fmtTien(tongGiaTri);
    } else {
      var hoTens = [], thangs = [], tongLuong = 0;
      checked.forEach(function (chk) {
        var it = TAI_LIEU_DANH_SACH[Number(chk.dataset.idx)];
        if (!it) return;
        hoTens.push(it.hoTen + ' (' + it.thang + ')');
        thangs.push(it.thang);
        tongLuong += Number(it.soTien) || 0;
      });
      tr.querySelector('.ct-tlso').value = hoTens.join(', ');
      // Cột "Ngày tài liệu" dùng lại để ghi Tháng lương cho các dòng chọn từ Bảng lương.
      tr.querySelector('.ct-ngaytl').value = thangs.filter(function (v, i) { return thangs.indexOf(v) === i; }).join(', ');
      tr.querySelector('.ct-sotien').value = fmtTien(tongLuong);
    }
    capNhatTongTien();
    dongModalTaiLieu();
  }

  function dongModalTaiLieu() {
    document.getElementById('modalTaiLieu').style.display = 'none';
    TAI_LIEU_ROW_ID = '';
    TAI_LIEU_DANH_SACH = [];
  }

  function xoaDong(id) {
    var el = document.getElementById(id);
    if (el) el.parentNode.removeChild(el);
    capNhatTongTien();
  }

  /** Lớp CSS badge đúng theo trạng thái hồ sơ — dùng chung cho mọi bảng hiển thị hồ sơ trong app. */
  function lopBadgeTrangThai_(trangThai) {
    if (trangThai === 'Đã giải ngân') return 'trangthai-daigiaingan';
    if (trangThai === 'Đã hủy') return 'trangthai-huy';
    return 'trangthai-daotaohoso'; // Nháp / Đã tạo hồ sơ
  }

  /** Chỉ được xoá hồ sơ khi còn ở Nháp hoặc Đã tạo hồ sơ — Đã giải ngân/Đã hủy là chốt cuối, không xoá. */
  function coTheXoaHoSo_(trangThai) {
    return trangThai !== 'Đã giải ngân' && trangThai !== 'Đã hủy';
  }

  /** Thoát HTML đầy đủ (& < > " ') — an toàn cho cả nội dung văn bản lẫn thuộc tính đặt trong dấu nháy kép/đơn. Dữ liệu từ Sheet KHÔNG được đưa vào innerHTML nếu chưa qua hàm này. */
  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function capNhatTongTien() {
    if (HO_SO_TIEN_LE_.length) return; // giữ NGUYÊN số liệu lịch sử, không tính lại/không làm tròn
    var laUSD = document.getElementById('loaiTienHoSo') && document.getElementById('loaiTienHoSo').value === 'USD';
    var tyGia = 0;
    if (laUSD) {
      try { tyGia = layTyGia_(document.getElementById('tyGiaBan').value); } catch (e) { tyGia = 0; }
    }
    var rows = document.querySelectorAll('#tbodyChiTiet tr');
    var tong = 0, tongCent = 0, tongQuyDoi = 0;
    rows.forEach(function (r) {
      var v = layGiaTriSoMem_(r.querySelector('.ct-sotien'), 'Số tiền').n;
      if (laUSD) tongCent += Math.round(v * 100); else tong += v;
      if (laUSD) {
        var quyDoi = quyDoiVND_(v, tyGia);
        var oQuyDoi = r.querySelector('.ct-quydoi');
        if (oQuyDoi) oQuyDoi.value = quyDoi ? fmtTien(quyDoi) : '';
        tongQuyDoi += quyDoi;
      }
    });
    if (laUSD) tong = tongCent / 100;
    document.getElementById('tongTien').textContent = fmtTien(tong);
    // "Số tiền nhận nợ lần này" luôn tự động bằng tổng "Số tiền" các dòng thụ hưởng ở mục 4.
    document.getElementById('soTienNhanNoLanNay').value = fmtTien(tong);
    if (laUSD) {
      document.getElementById('tongTienQuyDoi').textContent = fmtTien(tongQuyDoi);
      document.getElementById('soTienQuyDoiTong').value = fmtTien(tongQuyDoi);
    }
    // Cập nhật hiện/ẩn cột "Số tiền quy đổi" ở từng dòng (VD: vừa đổi Loại tiền vay sau khi đã có dòng).
    document.querySelectorAll('.ct-quydoi-cell').forEach(function (td) { td.style.display = laUSD ? '' : 'none'; });
  }

  /** ROUND(USD x Tỷ giá, 0) bằng số học nguyên (BigInt) — không làm tròn tỷ giá trước, không sai số dấu phẩy động. */
  function quyDoiVND_(usd, tyGia) {
    if (!usd || !tyGia) return 0;
    var s = (Math.abs(tyGia) < 1e21 && Math.abs(tyGia) >= 1e-6) ? String(tyGia) : tyGia.toFixed(10);
    var p = s.split('.'), le = p[1] || '';
    var u = String(usd).split('.');
    var cent = BigInt(u[0]) * 100n + BigInt(((u[1] || '') + '00').slice(0, 2));
    var tich = cent * BigInt(p[0] + le);
    var mau = 100n * (BigInt(10) ** BigInt(le.length));
    return Number((tich * 2n + mau) / (mau * 2n));
  }

  function thuThapDuLieuForm(chiPhiTienTe) {
    var boTien = !!chiPhiTienTe; // true: chỉ lấy thông tin KHÔNG phải tiền (hồ sơ cũ có số lẻ)
    if (!boTien) capNhatTongTien(); // tính lại tổng từ các dòng ngay trước khi gửi (không phụ thuộc sự kiện gõ phím)
    var maHD = document.getElementById('selHopDong').value;
    if (!maHD) { baoLoi('Vui lòng chọn công ty và hợp đồng vay.'); return null; }
    var soTienLanNay = 0;
    if (!boTien) {
      try { soTienLanNay = layGiaTriSo_(document.getElementById('soTienNhanNoLanNay').value, 'Số tiền nhận nợ lần này', document.getElementById('loaiTienHoSo').value === 'USD'); }
      catch (eT) { baoLoi(eT); return null; }
    }
    if (!boTien && !soTienLanNay) { baoLoi('Vui lòng nhập Số tiền ở các dòng thụ hưởng (mục 4).'); return null; }

    var loaiTien = document.getElementById('loaiTienHoSo').value === 'USD' ? 'USD' : 'VND';
    var tyGiaBan = 0, duNoHienTai = 0;
    if (!boTien) {
      try {
        tyGiaBan = layTyGia_(document.getElementById('tyGiaBan').value);
        duNoHienTai = layGiaTriSo_(document.getElementById('duNoHienTai').value, 'Dư nợ hiện tại', loaiTien === 'USD');
      } catch (eT2) { baoLoi(eT2); return null; }
    }
    if (!boTien && loaiTien === 'USD' && !tyGiaBan) {
      baoLoi('Vui lòng nhập Tỷ giá bán (USD → VND) ở mục 3 vì hồ sơ này vay bằng USD.');
      return null;
    }

    var chiTiet = [];
    var loiDong = '';
    document.querySelectorAll('#tbodyChiTiet tr').forEach(function (r, i) {
      var ten = r.querySelector('.ct-ten').value.trim();
      var soTien = 0;
      if (!boTien) {
        try { soTien = layGiaTriSo_(r.querySelector('.ct-sotien').value, 'Số tiền dòng thụ hưởng ' + (i + 1), loaiTien === 'USD'); }
        catch (eD) { if (!loiDong) loiDong = eD.message; r.querySelector('.ct-sotien').classList.add('tien-loi'); return; }
      }
      if (!ten && !soTien && !boTien) return; // bỏ dòng trống
      chiTiet.push({
        tenNguoiHuong: ten,
        soTaiKhoan: r.querySelector('.ct-stk').value.trim(),
        taiNganHang: r.querySelector('.ct-nh').value.trim(),
        loaiTien: loaiTien,
        loaiChungTu: r.querySelector('.ct-khoanmuc').value.trim(),
        noiDungThanhToan: r.querySelector('.ct-noidung').value.trim(),
        soTien: soTien,
        chuyenTienNhanh: r.querySelector('.ct-nhanh').checked ? 'Y' : 'N',
        taiLieuSo: r.querySelector('.ct-tlso').value.trim(),
        ngayTaiLieu: r.querySelector('.ct-ngaytl').value.trim(),
        donViLapTaiLieu: ten
      });
    });

    if (loiDong) { baoLoi(loiDong); return null; }

    var taiLieuCM = docTaiLieuKemTuForm_() || 'Hóa đơn mua hàng và hợp đồng kinh tế đính kèm';

    return {
      maHoSo: MA_HO_SO_DANG_SUA || '',
      maHD: maHD,
      loaiTien: loaiTien,
      tyGiaBan: tyGiaBan,
      soGiayNhanNo: document.getElementById('soGiayNhanNo').value.trim(),
      ngayGiayNhanNo: document.getElementById('ngayGiayNhanNo').value,
      duNoHienTai: duNoHienTai,
      soTienNhanNoLanNay: soTienLanNay,
      phuongThucThanhToan: document.getElementById('phuongThucThanhToan').value,
      mucDichSuDungVon: document.getElementById('mucDichSuDungVon').value.trim() || 'Bổ sung vốn lưu động',
      thoiHanChoVayNgay: document.getElementById('thoiHanChoVayNgay').value,
      ngayGiaiNgan: document.getElementById('ngayGiaiNgan').value,
      ngayDenHan: document.getElementById('ngayDenHan').value,
      taiLieuChungMinhMucDich: taiLieuCM,
      loaiHoSoGiaiNgan: document.getElementById('loaiHoSoGiaiNgan').value,
      nguoiLapBieu: document.getElementById('nguoiLapBieu').value.trim(),
      soThamChieu: document.getElementById('soThamChieu').value.trim(),
      khoaYeuCau: MA_HO_SO_DANG_SUA ? undefined : (KHOA_YEU_CAU_MOI_ || (KHOA_YEU_CAU_MOI_ = 'K' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10))),
      expectedRevision: (MA_HO_SO_DANG_SUA && REVISION_HIEN_TAI !== null) ? REVISION_HIEN_TAI : undefined, // KHÔNG gửi trangThai: chỉ máy chủ được đổi trạng thái
      chiTiet: chiTiet
    };
  }

  function luuHoSo(callback) {
    // Hồ sơ cũ còn số tiền lẻ: chỉ cập nhật thông tin KHÁC, giữ nguyên toàn bộ số tiền cũ (không ghi lại, không làm tròn).
    if (HO_SO_TIEN_LE_.length && MA_HO_SO_DANG_SUA) {
      var pl = thuThapDuLieuForm(true);
      if (!pl) return;
      hienLoading(true);
      hakRun_().withSuccessHandler(function (res) {
        if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
        FORM_HO_SO_BAN_ = false;
        baoThanhCong('Đã lưu thông tin hồ sơ ' + res.maHoSo + ' — GIỮ NGUYÊN số tiền cũ (có phần thập phân). Muốn phát hành chứng từ: bấm "Sửa số tiền" và sửa số tiền không hợp lệ.');
        locDanhSachHoSoClick();
        hienLoading(false);
        if (callback) callback(res.maHoSo);
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).capNhatThongTinPhiTienTe(pl);
      return;
    }
    var payload = thuThapDuLieuForm();
    if (!payload) return;
    hienLoading(true);
    hakRun_().withSuccessHandler(function (res) {
      MA_HO_SO_DANG_SUA = res.maHoSo;
      FORM_HO_SO_BAN_ = false;
      if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
      TRANG_THAI_HIEN_TAI = res.trangThai || TRANG_THAI_HIEN_TAI || 'Nháp';
      capNhatTrangThaiHienThi_();
      apDungKhoaFormTheoTrangThai();
      baoThanhCong('Đã lưu hồ sơ: ' + res.maHoSo);
      taiDanhSachChungTuHoSo_();
      locDanhSachHoSoClick();
      capNhatHoSoGocVaTongQuan_();
      hienLoading(false);
      if (callback) callback(res.maHoSo);
    }).withFailureHandler(function (err) {
      var msg = String((err && err.message) || err);
      // Mọi lỗi (trừ xung đột phiên bản đã rõ) → hỏi máy chủ xem lệnh đã được GHI chưa trước khi cho gửi lại: mất kết nối có thể xảy ra SAU khi máy chủ đã ghi.
      if (/XUNG_DOT_PHIEN_BAN/.test(msg)) { hienLoading(false); baoLoi(err); return; }
      document.getElementById('msgBox').innerHTML = '<div class="msg msg-err">Lưu không thành công (' + esc(msg) + '). Đang kiểm tra xem máy chủ đã ghi hồ sơ chưa…</div>';
      hakRun_().withSuccessHandler(function (kq) {
        hienLoading(false);
        if (kq && kq.daGhi) {
          baoThanhCong('Lệnh lưu ĐÃ được máy chủ ghi (hồ sơ ' + kq.maHoSo + ', phiên bản ' + kq.revision + '). Đang tải lại dữ liệu chuẩn từ máy chủ.');
          suaHoSoTuBang(kq.maHoSo);
        } else baoLoi(msg + ' — Hồ sơ CHƯA được ghi; có thể bấm Lưu lại (hệ thống chống tạo trùng bằng mã yêu cầu).');
      }).withFailureHandler(function (e2) { hienLoading(false); baoLoi(msg + ' — Không kiểm tra được kết quả (' + ((e2 && e2.message) || e2) + '). ĐỪNG bấm Lưu lại ngay; hãy tải lại danh sách hồ sơ để xem hồ sơ đã có chưa.'); })
        .kiemTraKetQuaLuu(MA_HO_SO_DANG_SUA || '', payload.khoaYeuCau || '', payload.expectedRevision);
    }).luuHoSoGiaiNgan(payload);
  }

  function trinhTaoChong_(doan, s, e, boQua) {
    return TT_.anhXa.some(function (a, i) { return i !== boQua && a.doan === doan && (s === e ? (s > a.s && s < a.e) : (s < a.e && a.s < e)); });

  function trinhTaoVe_() {
    if (!TT_) return;
    var hangDaVe = {}, h = '';
    TT_.doan.forEach(function (d) {
      var phan = d.id.split('#')[0], kh = d.hangId >= 0 ? phan + '|' + d.hangId : '', xoa = kh && TT_.xoa[kh];
      var cacVung = [];
      TT_.anhXa.forEach(function (a, i) { if (a.doan === d.id) cacVung.push({ s: a.s, e: a.e, loai: 'a', i: i, khoa: a.khoa }); });
      TT_.goiY.forEach(function (g, i) {
        if (g.doan === d.id && !TT_.bo[i] && !TT_.anhXa.some(function (a) { return a.doan === g.doan && a.s === g.s && a.e === g.e && a.khoa === g.khoa; }) && !trinhTaoChong_(g.doan, g.s, g.e, -1)) cacVung.push({ s: g.s, e: g.e, loai: 'g', i: i, khoa: g.khoa, ly: g.ly });
      });
      cacVung.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
      var vt = 0, html = '';
      cacVung.forEach(function (v) {
        if (v.s < vt) return;

        if (v.s === v.e) html += '<mark class="tt-' + v.loai + '" title="' + escH_(v.khoa) + '">⟦' + escH_(v.khoa) + '⟧</mark>';
        else html += '<mark class="tt-' + v.loai + '" title="' + escH_(v.khoa) + '">' + escH_(d.text.substring(v.s, v.e)) + '</mark>';
        vt = v.e;
      });
      html += escH_(d.text.substring(vt));
      // NB: ⟦…⟧ của vùng "chèn" chỉ để hiển thị; không nằm trong văn bản gốc → bù khi tính vị trí (xem trinhTaoViTri_)
      var chip = cacVung.map(function (v) {
        if (v.loai === 'a') return '<span class="tt-chip tt-chip-a">' + (v.s === v.e ? '(chèn)' : escH_(d.text.substring(v.s, v.e)).slice(0, 40)) + ' → <b>' + escH_(v.khoa) + '</b> <a href="javascript:void(0)" onclick="trinhTaoBo(' + v.i + ')" title="Bỏ gán">✕</a></span>';
        return '<span class="tt-chip tt-chip-g">✨ ' + escH_(d.text.substring(v.s, v.e)).slice(0, 40) + ' → <b>' + escH_(v.khoa) + '</b> <a href="javascript:void(0)" onclick="trinhTaoNhanGoiY(' + v.i + ')" title="' + escH_(v.ly || '') + '">✓</a> <a href="javascript:void(0)" onclick="trinhTaoBoGoiY(' + v.i + ')">✕</a></span>';
      }).join(' ');
      var ctrlHang = '';
      if (kh && !hangDaVe[kh]) { hangDaVe[kh] = true; ctrlHang = '<label class="hint" style="margin-left:8px;"><input type="checkbox" style="width:auto;" ' + (xoa ? 'checked' : '') + ' onchange="trinhTaoDatXoa(\'' + escAttr_(phan) + '\',' + d.hangId + ',this.checked)"> xoá cả hàng bảng này (hàng ví dụ thừa)</label>'; }
      h += '<div class="tt-dong" style="padding:5px 4px;border-bottom:1px solid #eee;' + (xoa ? 'opacity:.4;text-decoration:line-through;' : '') + '">' +
        '<div class="hint" style="font-size:11px;">' + escH_(d.viTri) + ctrlHang + '</div>' +
        '<div class="tt-text" data-id="' + escH_(d.id) + '" style="white-space:pre-wrap;user-select:text;cursor:text;">' + html + '</div>' + (chip ? '<div style="margin-top:2px;">' + chip + '</div>' : '') + '</div>';
    });
    document.getElementById('tt_ds').innerHTML = h;
    document.getElementById('tt_tomTat').textContent = TT_.anhXa.length + ' vùng đã gán · ' + Object.keys(TT_.xoa).filter(function (k) { return TT_.xoa[k]; }).length + ' hàng sẽ xoá';
    trinhTaoGanSuKien_();
  }

  /** Vị trí ký tự trong VĂN BẢN GỐC của đoạn (bỏ phần hiển thị ⟦…⟧ của vùng chèn). */
  function trinhTaoViTri_(el, node, offset) {
    var r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, offset);
    var frag = r.cloneContents(), tong = frag.textContent.length;
    frag.querySelectorAll('mark').forEach(function (m) { if (/^⟦/.test(m.textContent) && /⟧$/.test(m.textContent)) tong -= m.textContent.length; });
    return tong;
  }

  /** Ghi nhận vùng đang bôi chọn trong khung đoạn văn (nếu vùng chọn nằm trong ĐÚNG MỘT đoạn). Vùng chọn cuối cùng hợp lệ được GIỮ khi bạn bấm sang ô chọn trường. */
  function trinhTaoGhiNhanChon_() {
    if (!TT_) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var rg = sel.getRangeAt(0);
    var a = rg.startContainer.nodeType === 3 ? rg.startContainer.parentNode : rg.startContainer;
    var b = rg.endContainer.nodeType === 3 ? rg.endContainer.parentNode : rg.endContainer;
    var ea = a && a.closest && a.closest('.tt-text'), eb = b && b.closest && b.closest('.tt-text');
    if (!ea && !eb) return; // bôi chọn ở nơi khác (vd ô chọn trường) → giữ vùng chọn cũ
    if (!ea || !eb || ea !== eb) { TT_.chon = null; document.getElementById('tt_tomTat').textContent = 'Chỉ bôi chọn trong MỘT đoạn.'; return; }
    var s = trinhTaoViTri_(ea, rg.startContainer, rg.startOffset), e = trinhTaoViTri_(ea, rg.endContainer, rg.endOffset);
    var d = TT_.doan.filter(function (x) { return x.id === ea.getAttribute('data-id'); })[0];
    if (!d) return;
    TT_.chon = { doan: d.id, s: s, e: e, chuoi: d.text.substring(s, e) };
    document.getElementById('tt_tomTat').textContent = s === e ? 'Con trỏ tại vị trí ' + s + ' (sẽ CHÈN trường).' : 'Đã chọn: "' + TT_.chon.chuoi.slice(0, 50) + '" → chọn trường ở ô bên cạnh';
  }
  var TT_SU_KIEN_ = false;
  function trinhTaoGanSuKien_() {
    var box = document.getElementById('tt_ds');
    box.onmouseup = box.onkeyup = box.ontouchend = function () { setTimeout(trinhTaoGhiNhanChon_, 0); };
    if (!TT_SU_KIEN_) { TT_SU_KIEN_ = true; document.addEventListener('selectionchange', trinhTaoGhiNhanChon_); } // chạm/kéo trên điện thoại, bàn phím
  }

  function trinhTaoGan() {
    if (!TT_) return;
    var khoa = document.getElementById('tt_loc').value.trim();
    if (!trinhTaoKhoaHopLe_(khoa)) { baoLoi('Hãy chọn một trường dữ liệu trong ô "Trường dữ liệu" (danh sách thả xuống).'); return; }
    var c = TT_.chon;
    if (!c) { baoLoi('Bôi chọn chữ cần thay (hoặc bấm đặt con trỏ để chèn) trong khung bên dưới trước.'); return; }
    if (trinhTaoChong_(c.doan, c.s, c.e, -1)) { baoLoi('Vùng chọn chồng lên vùng đã gán — bỏ gán vùng cũ trước.'); return; }
    TT_.anhXa.push({ doan: c.doan, s: c.s, e: c.e, chuoi: c.chuoi, khoa: khoa });
    TT_.chon = null; window.getSelection().removeAllRanges(); document.getElementById('tt_loc').value = ''; trinhTaoVe_();
  }
  function trinhTaoBo(i) { TT_.anhXa.splice(i, 1); trinhTaoVe_(); }
  function trinhTaoNhanGoiY(i) {

    if (!trinhTaoChong_(g.doan, g.s, g.e, -1)) TT_.anhXa.push({ doan: g.doan, s: g.s, e: g.e, chuoi: g.chuoi, khoa: g.khoa });
    trinhTaoVe_();
  }
  function trinhTaoBoGoiY(i) { TT_.bo[i] = true; trinhTaoVe_(); }
  function trinhTaoApDungGoiY() {
    if (!TT_) return;
    TT_.goiY.forEach(function (g, i) { if (!TT_.bo[i] && !trinhTaoChong_(g.doan, g.s, g.e, -1)) TT_.anhXa.push({ doan: g.doan, s: g.s, e: g.e, chuoi: g.chuoi, khoa: g.khoa }); });
    trinhTaoVe_();
  }
  function trinhTaoDatXoa(phan, hangId, bat) { TT_.xoa[phan + '|' + hangId] = !!bat; trinhTaoVe_(); }

  function trinhTaoTaoMau() {
    if (!TT_) return;
    if (!TT_.anhXa.length) { baoLoi('Chưa gán vùng nào (dùng "Áp dụng tất cả gợi ý" hoặc bôi chọn rồi "Gán vùng đang chọn").'); return; }
    var xoaHang = Object.keys(TT_.xoa).filter(function (k) { return TT_.xoa[k]; }).map(function (k) { var i = k.lastIndexOf('|'); return { phan: k.substring(0, i), hangId: Number(k.substring(i + 1)) }; });
    document.getElementById('tt_ketQuaTao').innerHTML = '<span class="hint">Đang tạo mẫu...</span>';
    hakRun_().withSuccessHandler(function (r) {

        : '<div class="msg msg-err">❌ Mẫu tạo ra chưa đạt:<br>• ' + r.loi.map(escH_).join('<br>• ') + '</div>';
      if (r.canhBao.length) h += '<div class="msg msg-err">⚠ ' + r.canhBao.map(escH_).join('<br>⚠ ') + '</div>';
      if (r.hopLe) h += trinhTaoFormThem_(r);

    }).withFailureHandler(function (err) {
      document.getElementById('tt_ketQuaTao').innerHTML = '<div class="msg msg-err">' + escH_((err && err.message) || err).replace(/\n/g, '<br>') + '</div>';
    }).taoMauTuAnhXa(TT_.b64, TT_.ten, TT_.anhXa, xoaHang);
  }


  /** Form "Thêm mẫu" ngay dưới kết quả tạo mẫu: điền thông tin → 1 nút Thêm (không phải sang khung khác). */
  function trinhTaoFormThem_(r) {
    var ma = String(TT_.ten || 'MAU_MOI').replace(/\.docx$/i, '').toUpperCase().replace(/[^A-Z0-9_]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30);
    var optLoai = DM_LOAI_TL_.map(function (l) { return '<option value="' + escH_(l.ma) + '">' + escH_(l.ten) + '</option>'; }).join('');
    return '<div class="card" style="margin-top:8px; background:#f8fafc;"><b>Thêm mẫu này vào hệ thống</b>' +
      '<div class="grid2" style="margin-top:6px;">' +
      '<div><label>Mã mẫu *</label><input id="tt_ma" value="' + escH_(ma) + '"></div>' +
      '<div><label>Tên mẫu *</label><input id="tt_ten" placeholder="VD: Đề nghị giải ngân BIDV - VND - 1 khoản"></div>' +
      '<div><label>Ngân hàng <span class="hint">(trống = mọi NH)</span></label><input id="tt_nh" placeholder="VD: BIDV"></div>' +

      '<div><label>Loại chứng từ *</label><select id="tt_lct">' + optLoai + '</select></div>' +
      '<div><label>Điều kiện số người thụ hưởng <span class="hint">(trống = tự nhận)</span></label><input id="tt_dk" placeholder="1, 2+, 2-999"></div>' +
      '</div><label style="display:flex;gap:6px;align-items:center;margin-top:6px;"><input id="tt_md" type="checkbox" style="width:auto;"> Đặt làm mẫu MẶC ĐỊNH</label>' +

  function trinhTaoThemMau() {

    var meta = { maMau: document.getElementById('tt_ma').value, tenMau: document.getElementById('tt_ten').value, nganHang: document.getElementById('tt_nh').value,
      loaiTien: document.getElementById('tt_lt').value, loaiTaiLieu: document.getElementById('tt_lct').value, dieuKienSoDong: document.getElementById('tt_dk').value,
      macDinh: document.getElementById('tt_md').checked, tenFile: r.tenFile, ghiChu: 'Tạo bằng Trình tạo mẫu từ ' + (TT_ ? TT_.ten : '') };
    if (!meta.maMau.trim() || !meta.tenMau.trim()) { baoLoi('Nhập Mã mẫu và Tên mẫu.'); return; }
    var kq = document.getElementById('tt_ketQuaThem'); kq.innerHTML = '<span class="hint">Đang thêm mẫu...</span>';

      if (res.canhBao && res.canhBao.length) h += '<div class="msg msg-err">⚠ ' + res.canhBao.map(escH_).join('<br>⚠ ') + '</div>';
      kq.innerHTML = h; taiDanhSachMau_();
    }).withFailureHandler(function (err) {
      kq.innerHTML = '<div class="msg msg-err">' + escH_((err && err.message) || err).replace(/\n/g, '<br>') + '</div>';
    }).taiMauVanBan(meta, r.base64);
  }

  function trinhTaoTai() {
    var r = window.__mauTraVe; if (!r) return;
    var bin = atob(r.base64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
    a.download = r.tenFile; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  function trinhTaoDung() {
    var r = window.__mauTraVe; if (!r) return;

    document.getElementById('mau_ma').scrollIntoView({ behavior: 'smooth', block: 'center' });

  // ===================== TÀI LIỆU KÈM THEO (tick theo từng hồ sơ) =====================
  var TL_KEM_DM_ = [];

  function taiDanhMucTaiLieuKem_(sauKhi) {
    hakRun_().withSuccessHandler(function (ds) {

      var cu = docTaiLieuKemTuForm_();
      veTaiLieuKem_(); datTaiLieuKemVaoForm_(cu);
      if (sauKhi) sauKhi();
    }).withFailureHandler(function () { /* không chặn giao diện; vẫn nhập tay được */ }).layDanhMucTaiLieuKem();
  }

  function veTaiLieuKem_() {
    var box = document.getElementById('tlKemBox'); if (!box) return;
    box.innerHTML = TL_KEM_DM_.map(function (t, i) {
      return '<label style="display:flex; gap:5px; align-items:center; font-weight:500;"><input type="checkbox" class="tlkem-chk" value="' + esc(t) + '" style="width:auto;"> ' + esc(t) + '</label>';
    }).join('');
  }

  /** Chuỗi tài liệu kèm theo từ form: các ô đã tick + phần gõ thêm (bỏ trùng). */
  function docTaiLieuKemTuForm_() {

    String(document.getElementById('taiLieuChungMinhMucDich').value || '').split(/[,;]/).forEach(function (x) {
      x = x.trim(); if (x && ds.indexOf(x) < 0) ds.push(x);

  }

  /** Đưa chuỗi đã lưu về form: mục khớp danh mục → tick; phần còn lại → ô gõ thêm. */
  function datTaiLieuKemVaoForm_(chuoi) {
    veTaiLieuKem_();
    var con = [];
    String(chuoi || '').split(/[,;]/).forEach(function (x) {
      x = x.trim(); if (!x) return;
      var o = Array.prototype.filter.call(document.querySelectorAll('#tlKemBox .tlkem-chk'), function (c) { return c.value.toLowerCase() === x.toLowerCase(); })[0];
      if (o) o.checked = true; else if (con.indexOf(x) < 0) con.push(x);

  // ===================== LOẠI TÀI LIỆU + LOẠI HỒ SƠ GIẢI NGÂN =====================
  var LOAI_HO_SO_ = [];

  /** Danh sách mã tài liệu (tl) của 1 loại hồ sơ; tương thích dạng cũ {deNghi, chungTu, hdmb}. */
  function tlCuaLoaiHoSo_(l) {
    if (Array.isArray(l.tl)) return l.tl;

  }

      if (ds && ds.length) DM_LOAI_TL_ = ds;
      var sel = document.getElementById('mau_loaiTaiLieu');
      if (sel) { var cu = sel.value; sel.innerHTML = DM_LOAI_TL_.map(function (l) { return '<option value="' + esc(l.ma) + '">' + esc(l.ten) + '</option>'; }).join(''); if (cu) sel.value = cu; }
      veBangLoaiTaiLieu_(); veBangLoaiHoSo_(LOAI_HO_SO_); capNhatGoiYLoaiHoSo_();
      if (sauKhi) sauKhi();
    }).withFailureHandler(function () { /* giữ danh mục mặc định */ }).layDanhMucLoaiTaiLieu();

  function taiLoaiHoSo_() {
    hakRun_().withSuccessHandler(function (ds) {

    var khop = LOAI_HO_SO_.filter(function (l) { return String(l.ten).toLowerCase() === String(ten || '').toLowerCase(); })[0];
    sel.value = khop ? khop.ten : (LOAI_HO_SO_[0] ? LOAI_HO_SO_[0].ten : '');

  }

  /** Loại tài liệu (theo mã) có áp dụng cho loại tiền hiện tại của hồ sơ không. */
  function ctApDungLoaiTien_(ma, laUSD) {
    var l = DM_LOAI_TL_.filter(function (x) { return x.ma === ma; })[0];
    if (!l) return true;
    if (l.loaiTien === 'USD') return laUSD; if (l.loaiTien === 'VND') return !laUSD; return true;
  }

    var sel = document.getElementById('loaiHoSoGiaiNgan'), g = document.getElementById('loaiHoSoGoiY'); if (!sel || !g) return;

    var tl = tlCuaLoaiHoSo_(l), ds = [];
    DM_LOAI_TL_.forEach(function (x) {
      if (tl.indexOf(x.ma) < 0 || !ctApDungLoaiTien_(x.ma, laUSD)) return;
      ds.push(x.ma === 'DE_NGHI_GIAI_NGAN' ? 'Văn bản đề nghị (HĐTD)' : (x.ma === 'CHUNG_TU_THANH_TOAN' ? 'UNC / Bảng kê' : x.ten));
    });

  // ----- Cài đặt: bảng "Loại hồ sơ" (cột = mọi loại tài liệu) -----
  function veBangLoaiHoSo_(ds) {

    var tl = tlCuaLoaiHoSo_(l), tb = document.querySelector('#cfg_bangLoaiHoSo tbody'), tr = document.createElement('tr');
    tr.innerHTML = '<td><input class="lhs-ten" value="' + esc(l.ten) + '" placeholder="VD: Không dùng HĐTD"></td>' +
      DM_LOAI_TL_.map(function (x) { return '<td style="text-align:center;"><input type="checkbox" class="lhs-chk" data-ma="' + esc(x.ma) + '" style="width:auto;"' + (tl.indexOf(x.ma) >= 0 ? ' checked' : '') + '></td>'; }).join('') +
      '<td><button class="btn btn-secondary" style="padding:2px 8px;" onclick="this.closest(\'tr\').remove()">✕</button></td>';

  function luuLoaiHoSoClick() {

  // ----- Cài đặt: bảng "Loại tài liệu" (hệ thống: chỉ đọc; tự thêm: sửa được) -----
  function veBangLoaiTaiLieu_() {

  /** Một dòng cấu hình loại tài liệu. Loại hệ thống: chỉ chỉnh bắt buộc / ngân hàng / thứ tự / trạng thái. Loại tự thêm: chỉnh đủ + xoá dòng. */
  function themDongLoaiTaiLieu_(x) {
    x = (x && x.ma !== undefined) ? x : { ma: '', ten: '', loaiTien: 'TAT_CA', heThong: false, batBuoc: false, nganHang: '', thuTu: '', trangThai: 'DUNG', mauHieuLuc: 0, apDungLoaiHoSo: [] };
    var tb = document.querySelector('#cfg_bangLoaiTL tbody'), tr = document.createElement('tr'), ht = !!x.heThong;
    tr.className = 'ltl-dong'; tr.setAttribute('data-he-thong', ht ? '1' : '');
    tr.innerHTML = '<td>' + (ht ? '<code class="ltl-ma-ht">' + esc(x.ma) + '</code>' : '<input class="ltl-ma" value="' + esc(x.ma) + '" placeholder="VD: GIAY_NHAN_NO">') + '</td>' +
      '<td>' + (ht ? esc(x.ten) + ' <span class="hint">(hệ thống)</span>' : '<input class="ltl-ten" value="' + esc(x.ten) + '" placeholder="VD: Giấy nhận nợ">') + '</td>' +
      '<td>' + (ht ? esc(x.loaiTien === 'USD' ? 'Chỉ hồ sơ USD' : 'Tất cả') : '<select class="ltl-lt"><option value="TAT_CA"' + (x.loaiTien === 'TAT_CA' ? ' selected' : '') + '>Tất cả</option><option value="USD"' + (x.loaiTien === 'USD' ? ' selected' : '') + '>Chỉ hồ sơ USD</option><option value="VND"' + (x.loaiTien === 'VND' ? ' selected' : '') + '>Chỉ hồ sơ VND</option></select>') + '</td>' +
      '<td style="text-align:center;"><input type="checkbox" class="ltl-bb" style="width:auto;"' + (x.batBuoc ? ' checked' : '') + ' title="Bắt buộc phải phát hành hợp lệ mới hoàn tất bộ / giải ngân"></td>' +
      '<td><input class="ltl-nh" value="' + esc(x.nganHang || '') + '" placeholder="(mọi ngân hàng)" style="width:110px;"></td>' +
      '<td><input class="ltl-tt" value="' + esc(x.thuTu === undefined ? '' : x.thuTu) + '" style="width:60px;" inputmode="numeric"></td>' +
      '<td><select class="ltl-st"><option value="DUNG"' + (x.trangThai !== 'NGUNG' ? ' selected' : '') + '>Đang dùng</option><option value="NGUNG"' + (x.trangThai === 'NGUNG' ? ' selected' : '') + '>Ngừng</option></select></td>' +
      '<td class="hint">' + (x.mauHieuLuc === undefined ? '' : x.mauHieuLuc + ' mẫu hiệu lực') + (x.apDungLoaiHoSo && x.apDungLoaiHoSo.length ? '<br>Loại hồ sơ: ' + esc(x.apDungLoaiHoSo.join(', ')) : '') + '</td>' +
      '<td>' + (ht ? '' : '<button class="btn btn-secondary" style="padding:2px 8px;" onclick="this.closest(\'tr\').remove()">✕</button>') + '</td>';
    tb.appendChild(tr);
  }

  function luuLoaiTaiLieuClick() {
    var ds = Array.prototype.map.call(document.querySelectorAll('#cfg_bangLoaiTL tbody tr.ltl-dong'), function (tr) {
      var ht = !!tr.getAttribute('data-he-thong');
      return { ma: ht ? tr.querySelector('.ltl-ma-ht').textContent : tr.querySelector('.ltl-ma').value, ten: ht ? '' : tr.querySelector('.ltl-ten').value, loaiTien: ht ? '' : tr.querySelector('.ltl-lt').value,
        batBuoc: tr.querySelector('.ltl-bb').checked, nganHang: tr.querySelector('.ltl-nh').value, thuTu: tr.querySelector('.ltl-tt').value, trangThai: tr.querySelector('.ltl-st').value };
    });
    var kq = document.getElementById('cfg_loaiTLKq'); kq.textContent = 'Đang lưu...';
    hakRun_().withSuccessHandler(function (r) {
      DM_LOAI_TL_ = r; kq.textContent = '✅ Đã lưu — ' + r.filter(function (x) { return !x.heThong; }).length + ' loại tự thêm.';
      taiDanhMucLoaiTaiLieu_(); taiLoaiHoSo_();
    }).withFailureHandler(function (err) { kq.textContent = ''; baoLoi(err); }).luuLoaiTaiLieuTuyChinh(ds);
  }

  function datTrangThaiMauClick(maMau, phienBan, trangThai) {
    hoiXacNhan((trangThai === 'Hiệu lực' ? 'Khôi phục/đặt hiệu lực mẫu ' : 'Ngưng mẫu ') + maMau + ' v' + phienBan + '? ' +
      (trangThai === 'Hiệu lực' ? 'Các phiên bản khác của mã này sẽ hết hiệu lực; hồ sơ phát hành sau đó dùng phiên bản này.' : 'Hồ sơ phát hành sau đó sẽ không dùng mẫu này nữa. Chứng từ đã phát hành không thay đổi.'), function () {
      hakRun_().withSuccessHandler(function () { baoThanhCong('Đã cập nhật trạng thái mẫu.'); taiDanhSachMau_(); })
        .withFailureHandler(function (err) { baoLoi(err); }).datTrangThaiMau(maMau, phienBan, trangThai);
    });
  }

  function xoaMauClick(maMau, phienBan) {
    hoiXacNhan('Xoá mẫu ' + maMau + ' v' + phienBan + '? Chỉ xoá được khi mẫu CHƯA từng dùng để phát hành tài liệu. File mẫu được chuyển vào thùng rác Google Drive (khôi phục được trong khoảng 30 ngày). Bạn chắc chắn xoá?', function () {
      hakRun_().withSuccessHandler(function () { baoThanhCong('Đã xoá mẫu ' + maMau + ' v' + phienBan + '.'); taiDanhSachMau_(); })
        .withFailureHandler(function (err) { baoLoi(err); }).xoaMauVanBan(maMau, phienBan);
    });
  }

  function datMacDinhClick(maMau, phienBan, bat) {
    hakRun_().withSuccessHandler(function () { baoThanhCong(bat ? 'Đã đặt làm mẫu mặc định.' : 'Đã bỏ mặc định.'); taiDanhSachMau_(); })
      .withFailureHandler(function (err) { baoLoi(err); }).datMauMacDinh(maMau, phienBan, bat);
  }

  function hienKetQuaThu_(h) { document.getElementById('mau_ketQuaThu').innerHTML = h; }

  function kiemTraLaiMauClick(maMau, phienBan) {
    hienKetQuaThu_('<span class="hint">Đang kiểm tra...</span>');
    hakRun_().withSuccessHandler(function (r) {
      var h = r.hopLe ? '<div class="msg msg-ok">✅ ' + escH_(maMau) + ' v' + phienBan + ' hợp lệ, file mẫu nguyên vẹn. Placeholder: ' + escH_(r.placeholder.join(', ')) + '</div>'
        : '<div class="msg msg-err">❌ Mẫu chưa đạt:<br>• ' + r.loi.map(escH_).join('<br>• ') + '</div>';
      if (r.canhBao.length) h += '<div class="msg msg-err">⚠ ' + r.canhBao.map(escH_).join('<br>⚠ ') + '</div>';
      hienKetQuaThu_(h);
    }).withFailureHandler(function (err) { hienKetQuaThu_('<div class="msg msg-err">' + escH_((err && err.message) || err) + '</div>'); }).kiemTraLaiMau(maMau, phienBan);
  }

  function xemTruocMauClick(maMau, phienBan) {
    var ma = document.getElementById('mau_maHoSoThu').value.trim();
    hienKetQuaThu_('<span class="hint">Đang điền ' + (ma ? 'hồ sơ ' + escH_(ma) : 'dữ liệu thử') + ' vào mẫu...</span>');
    hakRun_().withSuccessHandler(function (r) {
      var h = r.dat ? '<div class="msg msg-ok">✅ Xem trước (' + escH_(r.duLieu) + '): ' + r.soDong + ' dòng thụ hưởng, ' + r.soHangMau + ' hàng mẫu → ' + r.soHangTao + ' hàng. ' +
          '<a href="' + escH_(r.linkFile) + '" target="_blank">Mở file</a>' + (r.linkPdf ? ' · <a href="' + escH_(r.linkPdf) + '" target="_blank">Mở PDF</a>' : (r.loiPdf ? ' · không xuất được PDF: ' + escH_(r.loiPdf) : '')) + '</div>'
        : '<div class="msg msg-err">❌ Mẫu chưa đạt:<br>• ' + r.loi.map(escH_).join('<br>• ') + '</div>';
      if (r.canhBao.length) h += '<div class="msg msg-err">⚠ ' + r.canhBao.map(escH_).join('<br>⚠ ') + '</div>';
      hienKetQuaThu_(h);
    }).withFailureHandler(function (err) { hienKetQuaThu_('<div class="msg msg-err">' + escH_((err && err.message) || err).replace(/\n/g, '<br>') + '</div>'); }).xemTruocMau(maMau, phienBan, ma);
  }

  function lichSuMauClick(maMau) {
    hakRun_().withSuccessHandler(function (ds) {
      hienKetQuaThu_('<div class="card" style="margin:0;"><b>Lịch sử chỉnh sửa mẫu ' + escH_(maMau) + '</b><table class="detail"><tbody>' +
        (ds.map(function (x) { return '<tr><td>' + escH_(x.thoiGian) + '</td><td>' + escH_(x.nguoi) + '</td><td>' + escH_(x.hanhDong) + '</td><td>' + escH_(x.chiTiet) + '</td></tr>'; }).join('') || '<tr><td class="hint">Chưa có.</td></tr>') + '</tbody></table></div>');
    }).withFailureHandler(function (err) { baoLoi(err); }).layLichSuChinhSuaMau(maMau);
  }

  function taiLichSuPhatHanhClick() {
    var ma = document.getElementById('mau_maHoSoLichSu').value.trim();
    hakRun_().withSuccessHandler(function (ds) {
      var tb = document.getElementById('mau_lichSu');
      if (!ds.length) { tb.innerHTML = '<tr><td colspan="13" class="hint">Chưa có tài liệu nào được phát hành.</td></tr>'; return; }
      function lk(u, t) { return u ? '<a href="' + escH_(u) + '" target="_blank">' + t + '</a>' : ''; }
      tb.innerHTML = ds.map(function (r) {
        return '<tr' + (r.trangThai === 'Hiệu lực' ? '' : ' style="opacity:.7"') + '><td>' + escH_(r.maHoSo) + '</td><td>' + escH_(r.loai) + '</td>' +
          '<td style="text-align:center;">' + (r.trangThai === 'Lỗi' ? '—' : 'L' + escH_(r.soLan)) + '</td><td>' + escH_(r.mau) + '</td><td>' + escH_(r.nguon) + '</td><td>' + escH_(r.trangThai) + '</td>' +
          '<td>' + lk(r.linkXlsx || r.linkDocx || r.linkGoc, escH_(r.loaiFile || 'gốc').toUpperCase()) + '</td><td>' + lk(r.linkPdf, 'PDF') + '</td>' +
          '<td style="text-align:center;">' + escH_(r.soDong) + '</td><td style="text-align:right;">' + (r.tongTien === '' ? '' : fmtTien(r.tongTien)) + '</td>' +
          '<td>' + escH_(r.nguoi) + '</td><td style="text-align:center;">' + escH_(r.ngay) + '</td><td class="hint">' + escH_(r.thongBaoLoi || r.canhBao) + '</td></tr>';
      }).join('');
    }).withFailureHandler(function (err) { baoLoi(err); }).layLichSuPhatHanh(ma);
  }

  // ---------- Cấu hình hệ thống ----------
  function taiCauHinh_() {
    taiLoaiHoSo_();
    hakRun_().withSuccessHandler(function (ds) { document.getElementById('cfg_dmTaiLieuKem').value = (ds || []).join('\n'); }).layDanhMucTaiLieuKem();
    hakRun_().withSuccessHandler(function (c) {
      document.getElementById('cfg_ssMuaHangId').value = c.ssMuaHangId || '';
      document.getElementById('cfg_sheetMuaHang').value = c.sheetMuaHang || '';
      document.getElementById('cfg_thuMucGocId').value = c.thuMucGocId || '';
      document.getElementById('cfg_cheDoRender').value = c.cheDoRender || 'XML';
      document.getElementById('cfg_renderUrl').value = c.renderUrl || '';
      document.getElementById('cfg_renderToken').placeholder = c.daCoRenderToken ? '(đã đặt — để trống để giữ nguyên)' : '';
    }).withFailureHandler(function (err) { document.getElementById('cfg_ketQua').innerHTML = '<div class="msg msg-err">' + escH_((err && err.message) || err) + '</div>'; }).layCauHinhHeThong();
  }

  function dauVaoCauHinh_() {
    return { ssMuaHangId: document.getElementById('cfg_ssMuaHangId').value, sheetMuaHang: document.getElementById('cfg_sheetMuaHang').value,
      thuMucGocId: document.getElementById('cfg_thuMucGocId').value, cheDoRender: document.getElementById('cfg_cheDoRender').value,
      renderUrl: document.getElementById('cfg_renderUrl').value, renderToken: document.getElementById('cfg_renderToken').value };
  }

  function kiemTraCauHinhClick() {
    document.getElementById('cfg_ketQua').innerHTML = '<span class="hint">Đang kiểm tra...</span>';
    hakRun_().withSuccessHandler(function (ds) {
      document.getElementById('cfg_ketQua').innerHTML = ds.length ? ds.map(function (x) { return '<div class="msg ' + (x.ok ? 'msg-ok' : 'msg-err') + '">' + (x.ok ? '✅ ' : '❌ ') + escH_(x.ten) + ': ' + escH_(x.thongBao) + '</div>'; }).join('') : '<span class="hint">Không có mục nào để kiểm tra (để trống = dùng mặc định).</span>';
    }).withFailureHandler(function (err) { document.getElementById('cfg_ketQua').innerHTML = '<div class="msg msg-err">' + escH_((err && err.message) || err) + '</div>'; }).kiemTraCauHinh(dauVaoCauHinh_());
  }

  function luuCauHinhClick() {
    hakRun_().withSuccessHandler(function () {
      document.getElementById('cfg_ketQua').innerHTML = '<div class="msg msg-ok">✅ Đã lưu cấu hình.</div>'; document.getElementById('cfg_renderToken').value = ''; taiCauHinh_();
    }).withFailureHandler(function (err) { document.getElementById('cfg_ketQua').innerHTML = '<div class="msg msg-err">' + escH_((err && err.message) || err) + '</div>'; }).luuCauHinhHeThong(dauVaoCauHinh_());
  }
</script>
