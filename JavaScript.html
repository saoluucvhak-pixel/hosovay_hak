<script>

  // =========================================================================
  // ĐỒNG BỘ DỮ LIỆU PHÍA TRÌNH DUYỆT: RequestCoordinator + AppDataStore + DataSyncDiagnostics
  //  • MỘT nơi giữ dữ liệu nghiệp vụ (AppDataStore) — không còn nhiều mảng toàn cục mâu thuẫn nhau.
  //  • Mọi lượt gọi đọc đi qua RequestCoordinator: mỗi "khoá" chỉ nhận response của lượt gọi MỚI NHẤT (response cũ bị bỏ, không ghi đè).
  //  • Mỗi miền dữ liệu có phiên bản (revision) từ máy chủ; response có phiên bản CŨ HƠN dữ liệu đang giữ bị bỏ.
  //  • Danh sách rỗng là kết quả hợp lệ: hiển thị ngay, không đọc lại. Đọc lỗi → báo lỗi thật, giữ nguyên dữ liệu đang có.
  //  • KHÔNG có setTimeout/retry để "chữa" dữ liệu. Phát hiện thay đổi từ phiên khác bằng cách hỏi revision khi quay lại tab.
  // =========================================================================
  var RequestCoordinator = (function () {
    var seq = {}, dem = 0, nhatKy = [];
    function ghi(m) { nhatKy.push(m); if (nhatKy.length > 100) nhatKy.shift(); }
    /** @param {string} khoa nhóm lượt gọi (chỉ lượt mới nhất của khoá được áp dụng)
     *  @param {string} tenHam hàm Apps Script @param {Array} args
     *  @param {function(*, Object)} onOk nhận (data, meta) — với phong bì {ok,data,meta,error} đã bóc sẵn
     *  @param {function(Object)} onLoi nhận {message, ma} */
    function goi(khoa, tenHam, args, onOk, onLoi) {
      var id = 'R' + (++dem), t0 = Date.now();
      seq[khoa] = (seq[khoa] || 0) + 1;
      var mine = seq[khoa];
      function ghiLog(ket, meta, ma) {
        ghi({ id: id, module: khoa, action: tenHam, ms: Date.now() - t0, ket: ket, ma: ma || '',
          cache: meta && meta.cache ? Object.keys(meta.cache).map(function (k) { return k + ':' + meta.cache[k]; }).join(' ') : '',
          phienBan: meta && meta.phienBanDoc ? JSON.stringify(meta.phienBanDoc) : '', soBanGhi: meta && meta.soBanGhi ? JSON.stringify(meta.soBanGhi) : '',
          thoiGianServerMs: meta && meta.tongMs !== undefined ? meta.tongMs : '' , luc: new Date().toLocaleTimeString() });
      }
      var run = google.script.run
        .withSuccessHandler(function (res) {
          var cuHon = mine !== seq[khoa];
          var phongBi = res && typeof res === 'object' && !Array.isArray(res) && typeof res.ok === 'boolean' && ('meta' in res);
          if (phongBi && !res.ok) {
            ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', res.meta, res.error && res.error.ma);
            if (!cuHon && onLoi) onLoi({ message: (res.error && res.error.thongBao) || 'Lỗi máy chủ', ma: res.error && res.error.ma });
            return;
          }
          if (res === null || res === undefined) {
            ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', null, 'PHAN_HOI_TRONG');
            if (!cuHon && onLoi) onLoi({ message: 'Máy chủ không trả dữ liệu (phản hồi trống). Hãy bấm Làm mới; nếu lặp lại, báo quản trị.', ma: 'PHAN_HOI_TRONG' });
            return;
          }
          ghiLog(cuHon ? 'BO_QUA_CU' : 'OK', phongBi ? res.meta : null);
          if (cuHon) return; // response của lượt gọi cũ — KHÔNG ghi đè dữ liệu mới
          if (onOk) onOk(phongBi ? res.data : res, phongBi ? res.meta : null);
        })
        .withFailureHandler(function (err) {
          var cuHon = mine !== seq[khoa];
          ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', null, 'GOI_THAT_BAI');
          if (!cuHon && onLoi) onLoi({ message: (err && err.message) ? err.message : String(err), ma: 'GOI_THAT_BAI' });
        });
      run[tenHam].apply(run, args || []);
      return id;
    }
    return { goi: goi, nhatKy: function () { return nhatKy.slice(); }, dangBay: function (khoa) { return seq[khoa] || 0; } };
  })();

  var AppDataStore = {
    congTy: [], hopDong: [], khachHang: [],
    hoSoGoc: [],  // TOÀN BỘ hồ sơ (không lọc) — cho Tổng quan
    hoSoLoc: [],  // kết quả lọc hiện tại của tab Hồ sơ (do máy chủ lọc)
    phienBan: { CONGTY: -1, HOPDONG: -1, KHACHHANG: -1, HOSO: -1 }, // phiên bản dữ liệu ĐÃ NẠP của từng miền
    daNap: false, ngayServer: '', thoiDiemNap: '', lanCuoiHoiPhienBan: 0,
    _khoaTheoMien: { CONGTY: 'congTy', HOPDONG: 'hopDong', KHACHHANG: 'khachHang', HOSO: 'hoSoGoc' },

    /** Nạp các miền (mặc định tất cả) bằng MỘT lượt gọi. onXong(cacMienDaDoi) / onLoi(err). */
    nap: function (dsMien, tuyChon, onXong, onLoi) {
      var self = this, mien = (dsMien && dsMien.length) ? dsMien.slice().sort() : null;
      var khoa = 'store:' + (mien ? mien.join('+') : 'tatca');
      RequestCoordinator.goi(khoa, 'layDuLieuKhoiTao', [{ mien: mien || undefined, boQuaCache: !!(tuyChon && tuyChon.boQuaCache) }], function (data, meta) {
        var doi = self.ap_(data, meta);
        self.daNap = true; self.thoiDiemNap = new Date().toLocaleTimeString();
        if (data && data.ngay) self.ngayServer = data.ngay;
        if (onXong) onXong(doi);
      }, function (err) { if (onLoi) onLoi(err); });
    },

    /** Áp dữ liệu vào store theo từng miền; BỎ miền có phiên bản CŨ HƠN dữ liệu đang giữ. @return {string[]} các miền đã đổi */
    ap_: function (data, meta) {
      var doi = [], self = this, pb = (meta && meta.phienBanDoc) || {};
      Object.keys(this._khoaTheoMien).forEach(function (m) {
        var k = self._khoaTheoMien[m];
        if (!data || !Array.isArray(data[k])) return;
        var v = (pb[m] === undefined) ? -1 : pb[m];
        if (v !== -1 && self.phienBan[m] !== -1 && v < self.phienBan[m]) return; // dữ liệu cũ hơn cái đang có
        self[k] = data[k]; self.phienBan[m] = v; doi.push(m);
      });
      if (meta && meta.cache) this.cacheCuoi = meta.cache;
      return doi;
    },

    /** Hỏi máy chủ revision (rẻ); trả danh sách miền mà máy chủ MỚI HƠN store. Không dùng bộ đếm giờ — gọi khi quay lại tab/chuyển tab. */
    kiemTraThayDoi: function (onKetQua, onLoi) {
      var self = this;
      RequestCoordinator.goi('revision', 'layRevisionDuLieu', [], function (rev) {
        self.lanCuoiHoiPhienBan = Date.now(); self.revisionMayChu = rev;
        var cu = Object.keys(self.phienBan).filter(function (m) { return rev[m] !== undefined && self.phienBan[m] !== -1 && rev[m] > self.phienBan[m]; });
        if (onKetQua) onKetQua(cu, rev);
      }, onLoi);
    }
  };

  /** Chạy khi quay lại tab trình duyệt / đổi tab giao diện: phát hiện dữ liệu bị PHIÊN KHÁC thay đổi rồi nạp lại đúng các miền đó. */
  function dongBoNeuMayChuDoi_(ep) {
    if (!AppDataStore.daNap) return;
    if (!ep && Date.now() - AppDataStore.lanCuoiHoiPhienBan < 15000) return; // tránh hỏi dồn dập (không phải retry)
    AppDataStore.lanCuoiHoiPhienBan = Date.now();
    AppDataStore.kiemTraThayDoi(function (cu) {
      if (!cu.length) return;
      AppDataStore.nap(cu, null, function () {
        veLaiTheoMien_(cu);
        hienThongBaoDongBo_('Dữ liệu vừa được cập nhật từ phiên khác (' + cu.join(', ') + ') — đã tải lại.');
      }, function (err) { baoLoi(err); });
    }, function () { /* hỏi phiên bản thất bại: không ảnh hưởng dữ liệu đang hiển thị */ });
  }
  function hienThongBaoDongBo_(t) {
    var b = document.getElementById('msgBox');
    if (b) b.innerHTML = '<div class="msg msg-ok">' + esc(t) + '</div>';
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) dongBoNeuMayChuDoi_(false); });

  /** Vẽ lại các phần giao diện phụ thuộc vào các miền vừa đổi (không đụng vào form đang soạn). */
  function veLaiTheoMien_(dsMien) {
    var co = function (m) { return dsMien.indexOf(m) >= 0; };
    if (co('CONGTY') || co('HOPDONG') || co('KHACHHANG')) {
      var giuCty = (document.getElementById('selCongTy') || {}).value, giuLoc = (document.getElementById('loc_hopDong') || {}).value;
      napDanhMucVaoGiaoDien_();
      if (giuCty && document.getElementById('selCongTy')) document.getElementById('selCongTy').value = giuCty;
      if (giuLoc && document.getElementById('loc_hopDong')) document.getElementById('loc_hopDong').value = giuLoc;
    }
    if (co('HOPDONG') || co('CONGTY')) renderBangHopDongCuaCongTy_();
    if (co('KHACHHANG') && typeof renderBangKhachHang_ === 'function') renderBangKhachHang_();
    if (co('HOSO')) { locDanhSachHoSoClick(); }
    renderTongQuan_();
    capNhatBadgeSidebar_();
  }

  /** Sau một thao tác GHI đã được máy chủ xác nhận: nạp lại đúng các miền bị ảnh hưởng (nguồn thẩm quyền) rồi vẽ lại. */
  function sauKhiGhi_(dsMien, tuyChon) {
    AppDataStore.nap(dsMien, { boQuaCache: true }, function () { veLaiTheoMien_(dsMien); if (tuyChon && tuyChon.xong) tuyChon.xong(); },
      function (err) { baoLoi('Đã lưu, nhưng không tải lại được dữ liệu mới: ' + err.message + ' — bấm "Làm mới dữ liệu" ở Cài đặt → Đồng bộ.'); });
  }
  var MA_HO_SO_DANG_SUA = '';
  var MA_CTY_DANG_SUA = '';
  var MA_HD_DANG_SUA = '';
  var MA_KH_DANG_SUA = '';
  var TRANG_THAI_HIEN_TAI = '';
  var KHOA_YEU_CAU_MOI_ = ''; // mã chống tạo trùng cho lần LƯU hồ sơ mới (gửi lại cùng mã → máy chủ trả hồ sơ đã tạo)
  var REVISION_HIEN_TAI = null; // phiên bản hồ sơ đang xem; gửi lại khi lưu/chuyển trạng thái để phát hiện người khác đã sửa
  var NGAY_HOM_NAY_SERVER = ''; // ngày hôm nay lấy từ server (múi giờ VN chuẩn), tránh lệch giờ trình duyệt
  var DEM_DONG = 0;

  // Bắt MỌI lỗi JavaScript chưa được xử lý (ở bất kỳ hàm nào) và hiện rõ trong msgBox,
  // thay vì thất bại âm thầm — giúp chẩn đoán nhanh khi có lỗi client-side.
  window.onerror = function (msg, url, line, col, err) {
    var box = document.getElementById('msgBox');
    if (box) {
      box.innerHTML = '<div class="msg msg-err"><b>⚠️ Lỗi JavaScript:</b> ' + esc(String(msg)) +
        ' (dòng ' + line + ')<br><span class="hint">Chụp lại dòng này gửi cho lập trình viên để sửa.</span></div>';
    }
    return false; // vẫn cho log ra console như bình thường
  };

  // Đợi trang tải THẬT SỰ XONG HẲN (window.load — bao gồm mọi khung ẩn Apps Script tự tạo ra để kết
  // nối với server) trước khi gọi lệnh đầu tiên tới server — KHÔNG gọi ngay lúc DOMContentLoaded như
  // trước (lúc đó HTML vừa dựng xong nhưng cơ chế kết nối ngầm của Apps Script có thể chưa kịp sẵn
  // sàng, khiến lượt gọi ĐẦU TIÊN đôi khi không phản hồi đúng — trong khi các lượt bấm tay sau đó,
  // lúc trang đã load xong hẳn, luôn đúng. Đây khớp chính xác với hiện tượng đã gặp suốt thời gian
  // qua: tải trang tự động có vấn đề, còn bấm nút thủ công luôn đúng).
  window.addEventListener('load', function () {
    taiDuLieuBanDau();
  });

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('ct-ten')) return;
    var dd = document.getElementById('ddKhachHang');
    if (dd && !dd.contains(e.target)) dd.style.display = 'none';
  });

  var DA_KHOI_TAO_BAOCAO = false;

  var TIEU_DE_TAB = {
    tongquan: 'Tổng quan',
    hoso: 'Hồ sơ giải ngân',
    congty: 'Cài đặt › Công ty & Hợp đồng vay',
    khachhang: 'Danh mục khách hàng',
    baocao: 'Báo cáo tiền vay',
    dinhkem: 'Hồ sơ đính kèm',
    caidat: 'Cài đặt',
    huongdan: 'Hướng dẫn sử dụng'
  };
  var BREADCRUMB_TAB = {
    tongquan: 'Tổng quan',
    congty: 'Hệ thống', khachhang: 'Danh mục',
    hoso: 'Vận hành', baocao: 'Vận hành', dinhkem: 'Vận hành', caidat: 'Hệ thống',
    huongdan: 'Trợ giúp'
  };
  var SUB_DE_TAB = {
    tongquan: 'Số liệu tổng hợp hồ sơ giải ngân, danh mục công ty và hợp đồng vay.',
    hoso: 'Tạo Đề nghị giải ngân (đề nghị thanh toán) và in trọn bộ hồ sơ vay ngân hàng theo mẫu.',
    congty: 'Công ty vay vốn (mẹ) → Hợp đồng vay (con) → Hồ sơ giải ngân (cháu). Bấm "Xem chi tiết →" để đào sâu.',
    khachhang: 'Danh sách nhà cung cấp/người thụ hưởng hay dùng, để chọn nhanh khi lập hồ sơ.',
    baocao: 'Tổng hợp, lọc và xuất Excel/PDF các khoản đã vay theo VND, USD hoặc gộp cả hai.',
    dinhkem: 'Tải lên và quản lý Hoá đơn GTGT, Bảng lương cho từng hồ sơ giải ngân.',
    huongdan: 'Tài liệu hướng dẫn sử dụng đầy đủ, đọc ngay trong ứng dụng.'
  };

  function chuyenTab(ten) {
    var roiHoSo = ten !== 'hoso' && document.getElementById('tab-hoso') && document.getElementById('tab-hoso').style.display !== 'none';
    if (roiHoSo) { xacNhanBoThayDoi_(function () { chuyenTabKhongKiem_(ten); }); return; }
    chuyenTabKhongKiem_(ten);
  }

  function chuyenTabKhongKiem_(ten) {
    ['tongquan', 'hoso', 'congty', 'khachhang', 'baocao', 'dinhkem', 'caidat', 'huongdan'].forEach(function (t) {
      document.getElementById('tab-' + t).style.display = (t === ten) ? 'block' : 'none';
      document.getElementById('tabBtn-' + t).classList.toggle('active', t === ten || (t === 'caidat' && ten === 'congty')); // Công ty & Hợp đồng nằm trong Cài đặt
    });
    var elTieuDe = document.getElementById('pageTitle');
    if (elTieuDe) elTieuDe.textContent = TIEU_DE_TAB[ten] || '';
    var elBread = document.getElementById('pageBreadcrumb');
    if (elBread) elBread.textContent = BREADCRUMB_TAB[ten] || '';
    var elSub = document.getElementById('pageSub');
    if (elSub) elSub.textContent = SUB_DE_TAB[ten] || '';
    if (ten === 'tongquan') renderTongQuan_();
    if (ten === 'congty') { chuyenViewCongTy_('root'); chuyenTabCongTy_('xem'); taiVaVeHopDong_(); }
    if (ten === 'hoso') { chuyenViewHoSo_('list'); locDanhSachHoSoClick(); }
    if (ten === 'khachhang') { chuyenViewKhachHang_('list'); renderBangKhachHang_(); }
    if (ten === 'dinhkem') taiDanhSachDinhKem();
    if (ten === 'caidat') taiTabCaiDat_();
    if (ten !== 'caidat') dongBoNeuMayChuDoi_(false);
    if (ten === 'baocao' && !DA_KHOI_TAO_BAOCAO) {
      DA_KHOI_TAO_BAOCAO = true;
      var homNay = NGAY_HOM_NAY_SERVER || toInputDate(new Date());
      document.getElementById('bc_tuNgay').value = ''; // để trống = không giới hạn ngày bắt đầu
      document.getElementById('bc_denNgay').value = homNay;
      locBaoCaoTienVay();
    }
  }

  /** Công cụ chẩn đoán: hiện rõ Web App đang thực sự đọc/ghi dữ liệu vào Spreadsheet nào (tên +
   *  link + số dòng thực tế ở 3 sheet quan trọng) — để so sánh với Sheet đang mở trên trình duyệt,
   *  phát hiện ngay trường hợp Web App bị "trỏ nhầm" sang 1 Spreadsheet khác. */
  function kiemTraKetNoiSheet_() {
    document.getElementById('chanDoan_noiDung').textContent = 'Đang kiểm tra...';
    google.script.run.withSuccessHandler(function (res) {
      var lechCT = res.congTyQuaXuLy.soLuong !== res.congTyThatSuDangChay.soLuong;
      var lechHD = res.hopDongQuaXuLy.soLuong !== res.hopDongThatSuDangChay.soLuong;
      document.getElementById('chanDoanKetNoi').innerHTML =
        '<div><b>🔍 Web App đang đọc/ghi dữ liệu vào:</b> <a href="' + res.url + '" target="_blank" style="font-weight:800;">' + esc(res.ten) + '</a></div>' +
        '<div class="hint" style="margin-top:4px;">DataService.gs có hàm thử-lại-khi-rỗng: ' +
          (res.coHamThuLai ? '<b style="color:#16a34a;">CÓ ✅ (đã cập nhật bản mới)</b>' : '<b style="color:#dc2626;">KHÔNG ❌ (CHƯA dán đè DataService.gs bản mới nhất!)</b>') + '</div>' +
        '<table class="detail" style="margin-top:10px; background:#fff;">' +
          '<thead><tr><th></th><th>sheetToObjects_ gọi thẳng</th><th>Hàm app THẬT SỰ dùng (layDanhSachXXX)</th><th>Mã đọc được (hàm app dùng)</th></tr></thead>' +
          '<tbody>' +
            '<tr' + (lechCT ? ' style="background:#FEE2E2;"' : '') + '><td>Công ty</td><td>' + res.congTyQuaXuLy.soLuong + '</td><td>' + res.congTyThatSuDangChay.soLuong + '</td><td>' + esc(res.congTyThatSuDangChay.cacMa.join(', ')) + '</td></tr>' +
            '<tr' + (lechHD ? ' style="background:#FEE2E2;"' : '') + '><td>Hợp đồng vay</td><td>' + res.hopDongQuaXuLy.soLuong + '</td><td>' + res.hopDongThatSuDangChay.soLuong + '</td><td>' + esc(res.hopDongThatSuDangChay.cacMa.join(', ')) + '</td></tr>' +
          '</tbody>' +
        '</table>' +
        (lechCT || lechHD
          ? '<div class="hint" style="margin-top:8px; color:#dc2626; font-weight:700;">⚠️ 2 cột số liệu KHÁC NHAU dù đọc cùng 1 lúc — chắc chắn DataService.gs đang chạy bản KHÁC với Code.gs. Dán đè lại TOÀN BỘ file .gs rồi Deploy → New version.</div>'
          : '<div class="hint" style="margin-top:8px;">✅ Mọi số liệu khớp nhau hoàn toàn — server đọc đúng và nhất quán ở mọi hàm. Nếu "Công ty & Hợp đồng vay" vẫn không hiện đủ ngay sau khi tải trang, gửi lại đúng ảnh chụp bảng này cho mình.</div>');
    }).withFailureHandler(function (err) {
      document.getElementById('chanDoan_noiDung').innerHTML = '<b style="color:#dc2626;">Lỗi: ' + esc((err && err.message) || err) + '</b>';
    }).layThongTinSpreadsheetDangDung();
  }


  /** Vẽ Tổng quan HOÀN TOÀN TỪ DỮ LIỆU ĐÃ CÓ SẴN (AppDataStore.congTy/AppDataStore.hopDong/AppDataStore.khachHang/AppDataStore.hoSoGoc,
   *  nạp lúc mở trang qua taiDuLieuBanDau() — 5 lượt gọi nhỏ, riêng biệt) — KHÔNG gọi thêm server
   *  nữa, nên không còn phụ thuộc thời điểm/thứ tự của bất kỳ lượt gọi nào khác. */
  function renderTongQuan_() {
    var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };

    var soVND = 0, soUSD = 0, soDaGiaiNgan = 0, soDaHuy = 0;
    AppDataStore.hoSoGoc.forEach(function (h) {
      if (String(h.LoaiTien || 'VND').toUpperCase() === 'USD') soUSD++; else soVND++;
      if (h.TrangThai === 'Đã giải ngân') soDaGiaiNgan++;
      else if (h.TrangThai === 'Đã hủy') soDaHuy++;
    });
    set('tq_tongHoSo', AppDataStore.hoSoGoc.length);
    set('tq_daGiaiNgan', soDaGiaiNgan);
    set('tq_choXuLy', AppDataStore.hoSoGoc.length - soDaGiaiNgan - soDaHuy);

  /** Mở Danh mục khách hàng, tự tạo (nếu chưa có, Mã KH = MST) hoặc mở sửa (nếu đã có) — để người
   *  dùng bổ sung Số tài khoản/Ngân hàng mà OCR không đọc được từ hoá đơn. */
  function moTaoSuaKhachHangTuHoaDon_(mst, tenNhaCungCap) {
    chuyenTab('khachhang');
    var khHienCo = AppDataStore.khachHang.filter(function (k) { return k.MaKH === mst || k.MaSoThue === mst; })[0];
    if (khHienCo) {
      moKhachHangChiTiet(khHienCo.MaKH);
      if (!khHienCo.SoTaiKhoan || !khHienCo.TaiNganHang) {
        baoLoi('Khách hàng này còn thiếu Số tài khoản và/hoặc Ngân hàng — cần điền đủ CẢ HAI thì mới chuyển tiền được, không thể chỉ có Số tài khoản.');
      }
    } else {
      themKhachHangMoiClick();
      document.getElementById('kh_tenKhachHang').value = tenNhaCungCap || '';
      document.getElementById('kh_maSoThue').value = mst || '';
      MA_KH_DANG_SUA = mst; // Mã KH = MST, đúng quy ước đã tạo tự động ở OcrService.gs
      document.getElementById('kh_breadcrumbCurrent').textContent = tenNhaCungCap || mst;
      document.getElementById('kh_tieuDeChiTiet').textContent = tenNhaCungCap || ('Khách hàng MST ' + mst);
      document.getElementById('kh_moTaChiTiet').textContent = 'Tạo từ hoá đơn — MST: ' + mst;
      baoThanhCong('Đã điền sẵn Tên + MST từ hoá đơn — hoá đơn KHÔNG có thông tin ngân hàng nên bạn phải tự nhập Số tài khoản VÀ Ngân hàng (bắt buộc cả hai) rồi bấm "Lưu khách hàng".');
    }
  }

  var TONGHOP_HOADON_HIEN_TAI = [];
  var MA_HOADON_DANG_SUA = '';

  function moModalSuaHoaDon(maHoaDon) {
    google.script.run.withSuccessHandler(function (rows) {
      TONGHOP_HOADON_HIEN_TAI = rows || [];
      var h = TONGHOP_HOADON_HIEN_TAI.filter(function (x) { return x.maHoaDon === maHoaDon; })[0];
      if (!h) { baoLoi('Không tìm thấy hoá đơn.'); return; }
      MA_HOADON_DANG_SUA = maHoaDon;
      document.getElementById('sh_soHoaDon').value = h.soHoaDon || '';
      document.getElementById('sh_ngayHoaDon').value = h.ngayHoaDon || '';
      document.getElementById('sh_tenNhaCungCap').value = h.tenNhaCungCap || '';
      document.getElementById('sh_mst').value = h.mst || '';
      document.getElementById('sh_soTien').value = h.soTien ? fmtTien(Number(h.soTien)) : '';
      document.getElementById('sh_dienGiai').value = h.dienGiai || '';
      document.getElementById('modalSuaHoaDon').style.display = 'flex';
    }).withFailureHandler(function (err) { baoLoi(err); }).layBangTongHopHoaDon();
  }

  function dongModalSuaHoaDon() {
    document.getElementById('modalSuaHoaDon').style.display = 'none';
    MA_HOADON_DANG_SUA = '';
  }

  function luuSuaHoaDon_() {
    var payload = {
      soHoaDon: document.getElementById('sh_soHoaDon').value.trim(),
      ngayHoaDon: document.getElementById('sh_ngayHoaDon').value.trim(),
      tenNhaCungCap: document.getElementById('sh_tenNhaCungCap').value.trim(),
      mst: document.getElementById('sh_mst').value.trim(),
      soTien: 0,
      dienGiai: document.getElementById('sh_dienGiai').value.trim()
    };
    try { payload.soTien = layGiaTriSo_(document.getElementById('sh_soTien').value, 'Số tiền hoá đơn'); }

    hienLoading(true);

      hienLoading(false);
      baoThanhCong('Đã lưu hoá đơn.');
      dongModalSuaHoaDon();
      taiBangTongHopHoaDon();
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).capNhatHoaDonThuCong(MA_HOADON_DANG_SUA, payload);
  }

  function renderDinhKem_(rows) {
    var tbody = document.getElementById('tbody_dinhkem');
    tbody.innerHTML = '';
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#888; font-style:italic;">Chưa có hồ sơ nào.</td></tr>';
      return;
    }
    rows.forEach(function (r) {
      var lopTrangThai = lopBadgeTrangThai_(r.trangThai);

      tr.innerHTML =
        '<td><b>' + esc(r.maHoSo) + '</b></td>' +

          'onclick="moModalDinhKem(\'' + r.maHoSo + '\',\'HoaDonGTGT\',\'' + escAttr_(r.maHoSo + ' — Hoá đơn GTGT') + '\')">📄 Hoá đơn (' + r.soHoaDon + ')</button></td>' +
        '<td><button type="button" class="btn btn-secondary" style="padding:5px 9px; font-size:11.5px; margin:0;" ' +
          'onclick="moModalDinhKem(\'' + r.maHoSo + '\',\'BangLuong\',\'' + escAttr_(r.maHoSo + ' — Bảng lương') + '\')">🧾 Lương (' + r.soBangLuong + ')</button></td>';
      tbody.appendChild(tr);
    });

  function escAttr_(s) { return String(s == null ? '' : s).replace(/'/g, "\\'"); }

  var HUONG_DAN_TAI_LEN = {
    HoaDonGTGT: '💡 <b>Hoá đơn GTGT</b> là hoá đơn điện tử bạn nhận được khi mua hàng/dịch vụ. Tải lên được cả 3 dạng: ' +
      '<b>.xml</b> (đáng tin cậy nhất — đọc thẳng dữ liệu, không phải đoán chữ), <b>.zip</b> (nếu tải hàng loạt từ hệ thống hoá đơn điện tử, ' +
      'trong zip có nhiều hoá đơn .xml thì hệ thống tự đọc HẾT), hoặc <b>PDF/ảnh</b> (dùng OCR, kém chính xác hơn — chỉ dùng khi không có sẵn file .xml gốc). ' +
      'Nếu nhà cung cấp gửi email kèm cả .xml lẫn .pdf, nên tải file <b>.xml</b>.',
    BangLuong: '💡 <b>Bảng lương</b> là file Excel (.xlsx) bảng lương nội bộ của công ty (do kế toán/nhân sự lập) — có các cột Họ và tên, Tháng, Số tiền. Tải file Excel đó lên đây — hệ thống sẽ tự đọc dữ liệu từng dòng.'
  };

  function moModalDinhKem(maHoSo, loaiTaiLieu, tieuDe) {
    MODAL_TAILIEU_MAHOSO = maHoSo;
    MODAL_TAILIEU_LOAI = loaiTaiLieu;
    document.getElementById('modalDinhKemTitle').textContent = tieuDe || 'Tài liệu đính kèm';
    document.getElementById('modalDinhKemHuongDan').innerHTML = HUONG_DAN_TAI_LEN[loaiTaiLieu] || '';
    document.getElementById('modalDinhKemInput').value = '';
    document.getElementById('modalDinhKemFileList').innerHTML = '';
    document.getElementById('modalDinhKem').style.display = 'flex';
    var elLink = document.getElementById('modalDinhKemLinkThuMuc');
    elLink.style.display = 'none';
    google.script.run.withSuccessHandler(function (res) {
      elLink.href = res.url;
      elLink.style.display = 'inline-block';
    }).withFailureHandler(function () { /* im lặng — không chặn việc tải file nếu lấy link lỗi */ }).layLinkThuMucHoSo(maHoSo);
    napLaiDanhSachTrongModal_();
  }

  /** Mở thư mục Drive của hồ sơ đang mở (bước "Thực hiện / Văn bản") — đúng nơi các văn bản vừa tạo được lưu vào. */
  function moThuMucHoSoDangMo_() {
    if (!MA_HO_SO_DANG_SUA) return;
    var cuaSo = window.open('', '_blank');
    if (cuaSo) cuaSo.document.write('Đang mở thư mục Drive của hồ sơ ' + esc(MA_HO_SO_DANG_SUA) + '...');
    google.script.run.withSuccessHandler(function (res) {
      if (cuaSo) cuaSo.location.href = res.url;
      else window.open(res.url, '_blank');
    }).withFailureHandler(function (err) {
      if (cuaSo) cuaSo.close();
      baoLoi('Không mở được thư mục Drive của hồ sơ này: ' + ((err && err.message) || err));
    }).layLinkThuMucHoSo(MA_HO_SO_DANG_SUA);
  }

  /** Mở thư mục Drive gốc (chứa tất cả hồ sơ) — mở sẵn 1 tab trống rồi điều hướng sau khi có link,
   *  để trình duyệt không chặn do gọi window.open không đồng bộ với thao tác bấm chuột. */
  function moThuMucGocDrive() {
    var cuaSo = window.open('', '_blank');
    if (cuaSo) cuaSo.document.write('Đang mở thư mục Drive...');
    google.script.run.withSuccessHandler(function (res) {
      if (cuaSo) cuaSo.location.href = res.url;
      else window.open(res.url, '_blank');
    }).withFailureHandler(function (err) {
      if (cuaSo) cuaSo.close();
      baoLoi('Không mở được thư mục Drive gốc: ' + ((err && err.message) || err) +
        ' — bấm "⚙️ Cấu hình thư mục gốc" để dán lại đúng đường link thư mục Drive.');
    }).layLinkThuMucGoc();
  }

  /** Mở/đóng khung "⚙️ Cấu hình thư mục gốc" — nơi dán link thư mục Drive muốn dùng, không cần sửa code. */
  function moKhungCauHinhThuMucGoc_() {
    var khung = document.getElementById('khungCauHinhThuMucGoc');
    var dangMo = khung.style.display !== 'none';
    khung.style.display = dangMo ? 'none' : 'block';
    if (dangMo) return;
    napCauHinhThuMucGoc_();
  }

  function napCauHinhThuMucGoc_() {
    document.getElementById('chTMG_trangThai').textContent = 'Đang tải cấu hình...';
    google.script.run.withSuccessHandler(function (res) {
      if (res.loi) {
        document.getElementById('chTMG_trangThai').innerHTML =
          '<b style="color:#dc2626;">⚠️ Không mở được thư mục hiện tại (ID: ' + esc(res.id) + '): ' + esc(res.loi) + '</b>';
      } else {
        document.getElementById('chTMG_trangThai').innerHTML =
          (res.daTuCauHinh ? '✅ Đang dùng thư mục đã tự cấu hình: ' : 'ℹ️ Đang dùng thư mục mặc định (chưa tự cấu hình): ') +
          '<b>' + esc(res.ten) + '</b> — <a href="' + res.url + '" target="_blank">mở thử</a>';
      }
      document.getElementById('chTMG_link').value = res.daTuCauHinh ? res.id : '';
      document.getElementById('chTMG_link').placeholder = res.id ? ('ID hiện tại: ' + res.id) : 'VD: https://drive.google.com/drive/folders/1AbCdEfGhIjKlMnOpQrSt...';
    }).withFailureHandler(function (err) {
      document.getElementById('chTMG_trangThai').innerHTML = '<b style="color:#dc2626;">Lỗi tải cấu hình: ' + esc((err && err.message) || err) + '</b>';
    }).layCauHinhThuMucGoc();
  }

  function luuCauHinhThuMucGocClick() {
    var link = document.getElementById('chTMG_link').value.trim();
    if (!link) { baoLoi('Vui lòng dán đường link (hoặc mã ID) thư mục Drive.'); return; }
    hienLoading(true);
    google.script.run.withSuccessHandler(function (res) {
      hienLoading(false);
      baoThanhCong('Đã lưu thư mục gốc: ' + res.ten + ' — từ giờ mọi hồ sơ/tài liệu sẽ lưu vào đây.');
      napCauHinhThuMucGoc_();
    }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).luuCauHinhThuMucGoc(link);
  }

  /** Hiện tên các file vừa chọn (trước khi bấm "Tải lên") để người dùng biết chắc đã chọn đúng file. */
  function hienDanhSachFileDaChon_() {
    var input = document.getElementById('modalDinhKemInput');
    var files = Array.prototype.slice.call(input.files || []);
    var box = document.getElementById('modalDinhKemFileList');
    if (!files.length) { box.innerHTML = ''; return; }
    box.innerHTML = '✅ Đã chọn ' + files.length + ' file: ' +
      files.map(function (f) { return esc(f.name); }).join(', ');
  }

  function dongModalDinhKem() {
    document.getElementById('modalDinhKem').style.display = 'none';
  }

  function napLaiDanhSachTrongModal_() {
    var box = document.getElementById('modalDinhKemList');
    box.innerHTML = '<div class="hint">Đang tải danh sách...</div>';
    google.script.run.withSuccessHandler(function (list) {
      var cuaLoaiNay = (list || []).filter(function (t) { return t.loaiTaiLieu === MODAL_TAILIEU_LOAI; });
      if (!cuaLoaiNay.length) {
        box.innerHTML = '<div class="hint">Chưa có file nào. Chọn file ở dưới rồi bấm "Tải lên".</div>';
        return;
      }
      box.innerHTML = '';
      cuaLoaiNay.forEach(function (t) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid #e5e7eb;';
        row.innerHTML =
          '<a href="' + t.linkFile + '" target="_blank" style="color:var(--green); font-weight:700; text-decoration:none; word-break:break-all;">' + esc(t.tenFile) + '</a>' +
          '<span class="hint" style="white-space:nowrap; margin-right:8px;">' + esc(t.ngayTaiLen) + '</span>' +
          '<button type="button" class="btn btn-danger" style="margin:0;" onclick="xoaTaiLieuClick_(\'' + t.maTaiLieu + '\')">Xoá</button>';
        box.appendChild(row);
      });
    }).withFailureHandler(function (err) { box.innerHTML = '<div class="hint">Lỗi tải danh sách.</div>'; baoLoi(err); })
      .layTaiLieuTheoHoSo(MODAL_TAILIEU_MAHOSO);

  /** Đọc từng file đã chọn (input multiple) thành base64 rồi gọi lần lượt server để lưu — tránh gửi
   *  nhiều request cùng lúc (Apps Script xử lý tuần tự ổn định hơn khi có nhiều file lớn). */
  function taiLenTuModalDinhKem_() {
    var input = document.getElementById('modalDinhKemInput');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) { baoLoi('Vui lòng chọn ít nhất 1 file.'); return; }
    document.getElementById('modalDinhKemLoading').style.display = 'block';
    taiLenLanLuot_(files, 0);
  }

  function taiLenLanLuot_(files, idx, ketQuaDoc) {
    ketQuaDoc = ketQuaDoc || { docDuoc: 0, khongDoc: 0, tongSoDong: 0 };
    if (idx >= files.length) {
      document.getElementById('modalDinhKemLoading').style.display = 'none';
      document.getElementById('modalDinhKemInput').value = '';
      document.getElementById('modalDinhKemFileList').innerHTML = '';
      napLaiDanhSachTrongModal_();
      taiDanhSachDinhKem();
      var ghiChu = (MODAL_TAILIEU_LOAI === 'HoaDonGTGT' || MODAL_TAILIEU_LOAI === 'BangLuong')
        ? (' — đọc tự động được ' + ketQuaDoc.docDuoc + '/' + files.length + ' file' +
           (ketQuaDoc.tongSoDong > files.length ? (' (tổng cộng ' + ketQuaDoc.tongSoDong + ' dòng, có file .zip chứa nhiều hoá đơn)') : '') +
           (ketQuaDoc.khongDoc ? ('. ' + ketQuaDoc.khongDoc + ' file chưa đọc được, kiểm tra ở "Bảng tổng hợp" bên dưới.') : '.'))
        : '.';
      baoThanhCong('Đã tải lên ' + files.length + ' file' + ghiChu);
      return;
    }
    var file = files[idx];
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1]; // bỏ tiền tố "data:...;base64,"
      google.script.run.withSuccessHandler(function (res) {
        if (res && res.docDuoc) ketQuaDoc.docDuoc++; else ketQuaDoc.khongDoc++;
        ketQuaDoc.tongSoDong += (res && res.soDongDoc) || 0;
        taiLenLanLuot_(files, idx + 1, ketQuaDoc);
      }).withFailureHandler(function (err) {
        document.getElementById('modalDinhKemLoading').style.display = 'none';
        baoLoi('Lỗi khi tải "' + file.name + '": ' + ((err && err.message) || err));
      }).taiLenTaiLieuHoSo(MODAL_TAILIEU_MAHOSO, MODAL_TAILIEU_LOAI, file.name, file.type, base64);
    };
    reader.onerror = function () {
      document.getElementById('modalDinhKemLoading').style.display = 'none';
      baoLoi('Không đọc được file "' + file.name + '".');
    };
    reader.readAsDataURL(file);
  }

  // Sắp xếp + phân trang bảng hồ sơ (làm ở trình duyệt trên kết quả lọc của máy chủ)
  var HS_SAP_XEP_ = { cot: '', huong: 1 }, HS_TRANG_ = 0, HS_CO_TRANG_ = 25;
  function sapXepHoSo_(cot) {
    HS_SAP_XEP_ = { cot: cot, huong: HS_SAP_XEP_.cot === cot ? -HS_SAP_XEP_.huong : 1 };
    HS_TRANG_ = 0; renderBangHoSo_();
  }
  function doiTrangHoSo_(d) { HS_TRANG_ += d; renderBangHoSo_(); }
  function hoSoDaSapXep_() {
    var ds = AppDataStore.hoSoLoc.slice(), c = HS_SAP_XEP_.cot, h = HS_SAP_XEP_.huong;
    if (!c) return ds;
    var so = (c === 'soTien');
    ds.sort(function (a, b) {
      var x = a[c], y = b[c];
      if (so) return ((Number(x) || 0) - (Number(y) || 0)) * h;
      return String(x === undefined || x === null ? '' : x).localeCompare(String(y === undefined || y === null ? '' : y), 'vi', { numeric: true }) * h;
    });
    return ds;
  }
  function renderBangHoSo_() {
    var tbody = document.getElementById('tbody_dsHoSo');
    tbody.innerHTML = '';
    var pt = document.getElementById('hs_phanTrang');
    document.querySelectorAll('#tbl_dsHoSo th[data-cot]').forEach(function (th) {
      var dang = th.getAttribute('data-cot') === HS_SAP_XEP_.cot;
      th.textContent = th.getAttribute('data-ten') + (dang ? (HS_SAP_XEP_.huong > 0 ? ' ▲' : ' ▼') : '');
    });
    if (!AppDataStore.hoSoLoc.length) {
      if (pt) pt.innerHTML = '';
      var coLocNgay = document.getElementById('loc_tuNgay').value || document.getElementById('loc_denNgay').value;
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#888; font-style:italic;">Không có hồ sơ nào khớp bộ lọc.' +
        (coLocNgay ? ' <a href="javascript:void(0)" onclick="xoaLocNgayVaTai_()">Bỏ lọc ngày và xem tất cả hồ sơ</a>' : '') + '</td></tr>';
      return;
    }
    var tatCa = hoSoDaSapXep_(), soTrang = Math.max(1, Math.ceil(tatCa.length / HS_CO_TRANG_));
    HS_TRANG_ = Math.min(Math.max(0, HS_TRANG_), soTrang - 1);
    var trang = tatCa.slice(HS_TRANG_ * HS_CO_TRANG_, (HS_TRANG_ + 1) * HS_CO_TRANG_);
    if (pt) pt.innerHTML = soTrang > 1
      ? '<button type="button" class="btn btn-secondary" ' + (HS_TRANG_ === 0 ? 'disabled' : '') + ' onclick="doiTrangHoSo_(-1)">‹ Trước</button> <span class="hint">Trang ' + (HS_TRANG_ + 1) + '/' + soTrang + ' — ' + tatCa.length + ' hồ sơ</span> <button type="button" class="btn btn-secondary" ' + (HS_TRANG_ >= soTrang - 1 ? 'disabled' : '') + ' onclick="doiTrangHoSo_(1)">Sau ›</button>'
      : '';
    trang.forEach(function (h) {
      var dangChon = h.maHoSo === MA_HO_SO_DANG_SUA;
      var tr = document.createElement('tr');
      if (dangChon) tr.style.background = '#dbeafe';
      var coTheXoa = coTheXoaHoSo_(h.trangThai);
      var lopTrangThai = lopBadgeTrangThai_(h.trangThai);
      var laUSD = String(h.loaiTien || 'VND').toUpperCase() === 'USD';
      tr.innerHTML =
        '<td><b>' + esc(h.maHoSo) + '</b></td>' +
        '<td>' + esc(h.tenCty) + '</td>' +
        '<td>' + esc(h.soHopDong) + '</td>' +
        '<td>' + esc(h.soGiayNhanNo) + '</td>' +
        '<td>' + esc(h.ngayGiaiNgan) + '</td>' +
        '<td style="text-align:center;"><b>' + (laUSD ? 'USD' : 'VND') + '</b></td>' +
        '<td style="text-align:right;">' + fmtTien((Number(h.soTien) || 0)) + '</td>' +
        '<td><span class="trangthai-badge ' + lopTrangThai + '">' + esc(h.trangThai) + '</span></td>' +
        '<td style="white-space:nowrap;">' +
          '<button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:11px; margin:0 4px 0 0;" onclick="suaHoSoTuBang(\'' + h.maHoSo + '\')">✏️ Xem/Sửa</button>' +
          (coTheXoa
            ? '<button type="button" class="btn btn-danger" onclick="xoaHoSoTuBang(\'' + h.maHoSo + '\')">🗑️ Xoá</button>'
            : '') +
        '</td>';

  function xoaHoSoGoi_(maHoSo, daXacNhanTaiLieu) {
    var thucHien = function () {
      hienLoading(true);
      var tuyChon = { xacNhanCoTaiLieu: !!daXacNhanTaiLieu };
      if (MA_HO_SO_DANG_SUA === maHoSo && REVISION_HIEN_TAI !== null) tuyChon.expectedRevision = REVISION_HIEN_TAI;
      google.script.run.withSuccessHandler(function () {
        hienLoading(false);
        baoThanhCong('Đã ẩn hồ sơ ' + maHoSo + ' (xoá mềm — dữ liệu và tài liệu đã tạo vẫn được giữ để truy vết).');
        if (MA_HO_SO_DANG_SUA === maHoSo) resetFormMoi();
        locDanhSachHoSoClick();
        capNhatHoSoGocVaTongQuan_();
      }).withFailureHandler(function (err) {
        hienLoading(false);
        var m = String((err && err.message) || err), kq = m.match(/CO_TAI_LIEU\|(\d+)\|([\s\S]*)/);
        if (kq && !daXacNhanTaiLieu) { hoiXacNhan(kq[2], function () { xoaHoSoGoi_(maHoSo, true); }); return; }
        baoLoi(err);
      }).xoaHoSo(maHoSo, tuyChon);
    };
    if (daXacNhanTaiLieu) thucHien(); else hoiXacNhan('Xoá hồ sơ ' + maHoSo + '? Hồ sơ sẽ bị ẩn khỏi danh sách (xoá mềm, quản trị có thể khôi phục).', thucHien);

  // ---------- Dropdown chọn nhanh / gõ tên để lọc "Tên người hưởng" (từ Danh mục khách hàng) ----------
  var KH_DROPDOWN_INPUT = null;

  function moDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function locDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function renderDanhSachKH_(tuKhoa) {
    var dd = document.getElementById('ddKhachHang');
    if (!KH_DROPDOWN_INPUT) return;
    var tk = tuKhoa.trim().toUpperCase();
    var ds = AppDataStore.khachHang.filter(function (k) {
      if (!tk) return true;
      return String(k.TenKhachHang || '').toUpperCase().indexOf(tk) >= 0;
    });

    if (!ds.length) {
      dd.innerHTML = '<div class="kh-empty">Không có khách hàng khớp — vẫn có thể tự gõ tên mới.</div>';
    } else {
      dd.innerHTML = '';
      ds.forEach(function (k) {
        var item = document.createElement('div');
        item.className = 'kh-item';
        item.textContent = k.TenKhachHang + (k.MaSoThue ? ' — MST ' + k.MaSoThue : '');
        item.onmousedown = function (e) {
          e.preventDefault(); // giữ focus, tránh blur trước khi xử lý chọn
          chonKHTuDropdown_(k);
        };
        dd.appendChild(item);
      });
    }

    var rect = KH_DROPDOWN_INPUT.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 2) + 'px';
    dd.style.width = Math.max(rect.width, 220) + 'px';
    dd.style.display = 'block';
  }

  function chonKHTuDropdown_(k) {
    if (!KH_DROPDOWN_INPUT) return;
    KH_DROPDOWN_INPUT.value = k.TenKhachHang;
    var tr = KH_DROPDOWN_INPUT.closest('tr');
    if (tr) {
      tr.querySelector('.ct-stk').value = k.SoTaiKhoan || '';
      tr.querySelector('.ct-nh').value = k.TaiNganHang || '';
    }
    dongDanhSachKH();
  }

  function dongDanhSachKH() {
    document.getElementById('ddKhachHang').style.display = 'none';
    KH_DROPDOWN_INPUT = null;
  }

  // ---------- Hồ sơ lịch sử có số tiền lẻ: xem nguyên trạng, sửa thông tin khác KHÔNG ghi lại số tiền ----------
  var HO_SO_TIEN_LE_ = [];   // danh sách "vị trí = giá trị" lẻ của hồ sơ đang mở (rỗng = bình thường)

  function timTienLeClient_(hoSo, chiTiet) {
    var kq = [];
    function xet(viTri, v) {
      if (v === '' || v === null || v === undefined) return;
      var n = Number(v);
      if (isFinite(n) && Math.floor(n) !== n) kq.push(viTri + ' = ' + fmtTien(n));
    }
    xet('Dư nợ hiện tại', hoSo.DuNoHienTai);
    xet('Số tiền nhận nợ lần này', hoSo.SoTienNhanNoLanNay);
    (chiTiet || []).forEach(function (ct, i) {
      xet('Dòng thụ hưởng ' + (i + 1) + ' – Số tiền', ct.SoTien);
      xet('Dòng thụ hưởng ' + (i + 1) + ' – Số tiền quy đổi', ct.SoTienQuyDoi);
    });
    return kq;
  }

  function datCheDoTienLe_(ds) {
    HO_SO_TIEN_LE_ = ds || [];
    var coLe = HO_SO_TIEN_LE_.length > 0;

    var cacO = [document.getElementById('duNoHienTai')].concat(Array.prototype.slice.call(document.querySelectorAll('.ct-sotien')));

  }

    capNhatTongTien();
    baoThanhCong('Đã mở khoá: hãy nhập lại các ô số tiền bị xoá bằng SỐ NGUYÊN rồi lưu hồ sơ. Giá trị cũ được ghi vết trong tab NhatKyHeThong khi lưu.');

    document.getElementById('soGiayNhanNo').value = hoSo.SoGiayNhanNo || '';

    document.getElementById('mucDichSuDungVon').value = hoSo.MucDichSuDungVon || '';
    document.getElementById('nguoiLapBieu').value = hoSo.NguoiLapBieu || '';
    datTaiLieuKemVaoForm_(hoSo.TaiLieuChungMinhMucDich || '');
    datLoaiHoSoVaoForm_(hoSo.LoaiHoSoGiaiNgan || '');

    TRANG_THAI_HIEN_TAI = hoSo.TrangThai || 'Đã tạo hồ sơ';

    // Bật cờ "giữ nguyên số lẻ lịch sử" TRƯỚC khi dựng các dòng: capNhatTongTien() chạy trong themDong() và không được ghi đè tổng cũ.
    HO_SO_TIEN_LE_ = timTienLeClient_(hoSo, chiTiet);

    if (chiTiet && chiTiet.length) {
      chiTiet.forEach(function (ct) {
        themDong(ct);
      });
    } else {
      themDong(); themDong(); themDong();
    }
    onDoiLoaiTienHoSo();
    datCheDoTienLe_(timTienLeClient_(hoSo, chiTiet));
    apDungKhoaFormTheoTrangThai();
    hienLaiLinkDaTao_(hoSo);
    taiDanhSachChungTuHoSo_();
  }

  /** Hiện lại các link văn bản đã tạo trước đó (nếu có) khi mở xem/sửa 1 hồ sơ đã "Đã tạo hồ sơ"/"Đã giải ngân". */
  function hienLaiLinkDaTao_(hoSo) {
    var box = document.getElementById('linksBox');
    box.innerHTML = '';
    var danhSach = [
      ['Văn bản đề nghị giải ngân', hoSo.Link_VanBanDeNghi, hoSo.Link_VanBanDeNghi_DOCX, hoSo.Link_VanBanDeNghi_PDF, ''],
      [hoSo.LoaiChungTuThanhToan || 'Chứng từ chuyển tiền (UNC/Bảng kê)', hoSo.Link_ChungTuThanhToan, hoSo.Link_ChungTuThanhToan_DOCX, hoSo.Link_ChungTuThanhToan_PDF, hoSo.Link_ChungTuThanhToan_XLSX],
      ['Hợp đồng mua bán ngoại tệ giao ngay', hoSo.Link_HDMBNgoaiTe, hoSo.Link_HDMBNgoaiTe_DOCX, hoSo.Link_HDMBNgoaiTe_PDF, '']
    ];
    var coVanBan = danhSach.some(function (d) { return d[1] || d[2] || d[3] || d[4]; });
    if (!coVanBan) return;
    var tieuDe = document.createElement('div');
    tieuDe.className = 'hint';
    tieuDe.style.marginBottom = '4px';
    tieuDe.textContent = '📁 Văn bản đã tạo trước đó (bản mới nhất; các bản cũ xem ở tab "Mẫu Word" → Lịch sử phát hành):';
    box.appendChild(tieuDe);
    danhSach.forEach(function (d) {
      if (!d[1] && !d[2] && !d[3] && !d[4]) return;
      // d[1] = bản gốc (Google Doc/Sheet hoặc file DOCX), d[2] = DOCX, d[3] = PDF thật, d[4] = XLSX
      hienLinkCap_(d[0], { docUrl: d[1], docxUrl: d[2], pdfUrl: d[3], xlsxUrl: d[4] });
    });
  }

  /**
   * Tự động tính "Ngày đến hạn" = "Ngày giải ngân" + "Thời hạn cho vay (số ngày)".
   * Ô "Ngày đến hạn" ở giao diện để readonly, không cho gõ tay.
   */
  function tinhNgayDenHan() {
    var ngayGN = document.getElementById('ngayGiaiNgan').value; // yyyy-mm-dd
    var soNgay = Number(document.getElementById('thoiHanChoVayNgay').value) || 0;
    var out = document.getElementById('ngayDenHan');
    if (!ngayGN || !soNgay) { out.value = ''; return; }
    var d = new Date(ngayGN + 'T00:00:00');
    d.setDate(d.getDate() + soNgay);
    out.value = toInputDate(d);
  }

  /** Hiển thị "Trạng thái hồ sơ" ở mục 1 (Nháp nếu đang tạo mới). */
  function capNhatTrangThaiHienThi_() {
    document.getElementById('trangThaiHoSoHienThi').value = TRANG_THAI_HIEN_TAI || 'Nháp';
  }

  /**
   * Khoá toàn bộ form (mục 1-3 + nút Lưu/Tạo văn bản) khi hồ sơ đã ở trạng thái "Đã giải ngân"
   * (chỉ cho xem, không cho sửa). Đồng thời hiện/ẩn các nút "Đã hoàn thành giải ngân" / "Xoá hồ sơ".
   */
  /**
   * Khoá form theo đúng quy trình trạng thái: Nháp (sửa tự do) -> Đã tạo hồ sơ (xem/sửa được, nhưng
   * sửa thật thì nên "Chuyển về Nháp" trước) -> Đã giải ngân (CHỈ xem/in, không sửa/xoá — chỉ Huỷ được
   * nếu giải ngân không thành công) -> Đã hủy (chỉ xem, chốt cuối, không còn thao tác nào khác).
   */
  function apDungKhoaFormTheoTrangThai() {
    var trangThai = TRANG_THAI_HIEN_TAI || 'Nháp';
    var khoaHan = (trangThai === 'Đã giải ngân' || trangThai === 'Đã hủy'); // chốt cuối — không sửa được nữa
    var vungKhoa = document.querySelectorAll(
      '#hosoTab-congty input, #hosoTab-congty select,' +
      '#hosoTab-giaynhanno input, #hosoTab-giaynhanno select,' +
      '#tbodyChiTiet input, #tbodyChiTiet select, #tbodyChiTiet button'
    );
    vungKhoa.forEach(function (el) {
      if (el.hasAttribute('readonly') && (el.id === 'ngayDenHan' || el.id === 'soTienNhanNoLanNay')) return;
      el.disabled = khoaHan;
    });

    document.querySelectorAll('#hosoTab-thuhuong .toolbar button,' +
      '#hosoTab-thuchien button.btn-primary, #hosoTab-thuchien button.btn-secondary,' +
      '#hosoTab-thuchien button.btn-success:not(#btnDaGiaiNgan)'
    ).forEach(function (btn) { btn.disabled = khoaHan; });

    var coHoSo = !!MA_HO_SO_DANG_SUA;
    // Nút "Đã hoàn thành giải ngân": hiện khi hồ sơ đã lưu và chưa ở 2 trạng thái chốt cuối.
    document.getElementById('btnDaGiaiNgan').style.display = (coHoSo && !khoaHan) ? 'inline-block' : 'none';
    // Nút "Chuyển về Nháp để sửa": chỉ hiện khi đang "Đã tạo hồ sơ" (đã tạo văn bản nhưng muốn sửa lại).
    document.getElementById('btnVeNhap').style.display = (trangThai === 'Đã tạo hồ sơ') ? 'inline-block' : 'none';
    // Nút "Huỷ giải ngân": CHỈ hiện khi đang "Đã giải ngân" — đây là cách DUY NHẤT xử lý khi không thành công.
    document.getElementById('btnHuyGiaiNgan').style.display = (trangThai === 'Đã giải ngân') ? 'inline-block' : 'none';
    // Nút "Mở thư mục Drive của hồ sơ này": hiện ngay khi hồ sơ đã có Mã hồ sơ (đã lưu ít nhất 1 lần).
    document.getElementById('btnMoThuMucHoSoNay').style.display = coHoSo ? 'inline-block' : 'none';

    var banner = document.getElementById('bannerKhoa');
    if (banner) {
      banner.style.display = khoaHan ? 'flex' : 'none';
      banner.innerHTML = (trangThai === 'Đã hủy')
        ? '🚫 Hồ sơ này đã <b>"Đã hủy"</b> — chỉ xem, không thể sửa/lưu lại.'
        : '🔒 Hồ sơ này đã ở trạng thái <b>"Đã giải ngân"</b> — chỉ xem, không thể sửa/lưu lại. Nếu giải ngân không thành công, dùng nút "🚫 Huỷ giải ngân" ở bước "Thực hiện / Văn bản".';
    }

  // ---------- QUY TẮC TIỀN TỆ: VND và USD đều là SỐ NGUYÊN, không có phần thập phân/cents ----------
  // Dấu chấm là dấu phân cách hàng nghìn (25.000). Nhập 25.000,50 / 25000.50 / 0,5 => báo lỗi, KHÔNG tự
  // làm tròn hay cắt phần lẻ. Riêng Tỷ giá bán được phép có phần thập phân (dấu phẩy: 26.145,5).
  function nhomNghin_(chuoiSo) { return String(chuoiSo).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  /** Hiển thị số tiền: số nguyên => 25.000. (Số lẻ từ dữ liệu lịch sử hiển thị đúng giá trị thật để dễ phát hiện.) */
  function fmtTien(n) {
    n = Number(n) || 0;
    if (Math.floor(n) === n) return (n < 0 ? '-' : '') + nhomNghin_(Math.abs(n));
    var p = String(n).split('.');
    return nhomNghin_(p[0].replace('-', '')) + ',' + p[1];
  }

  function fmtTyGia(n) {
    n = Number(n) || 0;
    var p = String(n).split('.');
    return nhomNghin_(p[0]) + (p[1] ? ',' + p[1] : '');
  }

  /** Đọc số tiền nguyên, NÉM LỖI nếu có phần thập phân/sai định dạng (không làm tròn). */
  function layGiaTriSo_(v, ten) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[\s\u00A0]/g, '');
    if (s === '') return 0;
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) return parseInt(s.replace(/\./g, ''), 10);
    throw new Error((ten || 'Số tiền') + ': "' + v + '" không hợp lệ. Tiền chỉ nhận số nguyên, dấu chấm chỉ là dấu ' +
      'phân cách hàng nghìn (VD: 25.000). Không nhập phần thập phân (như 25.000,50 hoặc 0,5).');
  }

  /** Đọc Tỷ giá bán: cho phép phần thập phân kiểu VN (26.145,5). */
  function layTyGia_(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[\s\u00A0]/g, '');
    if (s === '') return 0;
    if (/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s)) return Number(s.replace(/\./g, '').replace(',', '.'));
    if (/^\d+(,\d+)?$/.test(s)) return Number(s.replace(',', '.'));
    throw new Error('Tỷ giá bán: "' + v + '" không hợp lệ (VD: 26.145 hoặc 26.145,5).');
  }

  /** Đọc không ném lỗi, dùng khi tính tổng lúc đang gõ; ô sai được đánh dấu đỏ + tooltip lỗi. */
  function layGiaTriSoMem_(el, ten) {
    try {
      var n = layGiaTriSo_(el.value, ten);
      el.classList.remove('tien-loi'); el.title = '';
      return { n: n, loi: '' };
    } catch (e) {
      el.classList.add('tien-loi'); el.title = e.message;
      return { n: 0, loi: e.message };
    }
  }

  /** Gõ tiền: tự định dạng hàng nghìn khi chỉ có chữ số; ký tự khác (dấu phẩy, chữ...) => đánh dấu lỗi. */
  function nhapTienInput(el) {
    var v = el.value;
    if (/^[\d.]*$/.test(v)) {
      var digits = v.replace(/\./g, '');
      var moi = digits ? nhomNghin_(digits.replace(/^0+(?=\d)/, '')) : '';
      if (moi !== v) el.value = moi;
      el.classList.remove('tien-loi'); el.title = '';
    } else {
      el.classList.add('tien-loi');
      el.title = 'Tiền chỉ nhận số nguyên, không nhập phần thập phân.';
    }
  }

  function formatSoNguyenInput(el) {
    var r = layGiaTriSoMem_(el, 'Số tiền');
    if (r.loi) { baoLoi(r.loi); return; }
    el.value = fmtTien(r.n);
  }

  function formatTyGiaInput(el) {
    try {
      var n = layTyGia_(el.value);
      el.classList.remove('tien-loi'); el.title = '';
      el.value = n ? fmtTyGia_(n) : '';
    } catch (e) { el.classList.add('tien-loi'); el.title = e.message; baoLoi(e.message); }
  }
  function fmtTyGia_(n) { return fmtTyGia(n); }

          if (res && res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
          capNhatTrangThaiHienThi_();

          baoThanhCong('Đã đánh dấu hồ sơ ' + MA_HO_SO_DANG_SUA + ' là "Đã giải ngân".');
          locDanhSachHoSoClick();

        }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).danhDauDaGiaiNgan(MA_HO_SO_DANG_SUA, 'Xác nhận đã giải ngân', REVISION_HIEN_TAI === null ? undefined : REVISION_HIEN_TAI);
      });

  function toInputDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return '';
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + mm + '-' + dd;

  // "Khoản mục giải ngân" cố định — quyết định có cần chọn chứng từ đính kèm hay không:

  var DS_KHOAN_MUC = ['Thanh toán tiền keo', 'Thanh toán vật tư/chi phí', 'Thanh toán lương', 'Thanh toán khác'];
  var KHOAN_MUC_CAN_HOADON = 'Thanh toán vật tư/chi phí';

    if (daChon && ds.indexOf(daChon) < 0) ds.push(daChon);
    return ds.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === daChon ? ' selected' : '') + '>' + esc(o) + '</option>';

  /** Hiện/ẩn nút 🔎 chọn chứng từ tuỳ Khoản mục giải ngân: chỉ "vật tư/chi phí" và "lương" mới
   *  cần chọn chứng từ đính kèm (hoá đơn / bảng lương); "tiền keo" và "khác" thì không cần. */
  function onDoiKhoanMuc_(selectEl) {
    var tr = selectEl.closest('tr');
    if (!tr) return;
    var khoanMuc = selectEl.value;
    var btn = tr.querySelector('.ct-btn-chontl');
    if (khoanMuc === KHOAN_MUC_CAN_HOADON) {
      btn.style.display = '';

    } else if (khoanMuc === KHOAN_MUC_CAN_LUONG) {
      btn.style.display = '';
      btn.title = 'Chọn dòng lương từ Bảng lương';
    } else {
      btn.style.display = 'none';

  // ---------- Chọn chứng từ đính kèm theo Khoản mục giải ngân: hoá đơn (Sổ chi tiết mua hàng)
  // hoặc bảng lương (Bảng lương) — cùng dùng chung 1 modal, đổi nội dung theo loại. ----------
  var TAI_LIEU_ROW_ID = '';
  var TAI_LIEU_DANH_SACH = [];
  var TAI_LIEU_LOAI_HIEN_TAI = 'hoadon'; // 'hoadon' | 'luong'

  function moChonTaiLieu(rowId) {

    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon' && !ten) {

        : 'Chưa thấy dòng lương cần tìm? Tải file Bảng lương (.xlsx) lên ngay tại đây — không cần lưu hồ sơ trước.';

  /** Gọi lại đúng nguồn dữ liệu (hoá đơn hoặc bảng lương) để làm mới danh sách trong modal — dùng cả
   *  khi mở modal lần đầu VÀ sau khi tải file mới lên ngay trong modal (mục "Chưa thấy... Tải lên"). */
  function lamMoiDanhSachTaiLieuTrongModal_() {
    document.getElementById('modalTaiLieuBody').innerHTML =
      '<div class="loading" style="display:block;">Đang tải dữ liệu...</div>';
    var xuLyKetQua = function (list) {
      TAI_LIEU_DANH_SACH = list || [];
      renderDanhSachTaiLieu_();
    };
    var xuLyLoi = function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      document.getElementById('modalTaiLieuBody').innerHTML = '<div class="msg msg-err">Lỗi: ' + msg + '</div>';
    };
    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') {
      google.script.run.withSuccessHandler(xuLyKetQua).withFailureHandler(xuLyLoi)
        .layDanhSachTaiLieuTheoNhaCungCap(TAI_LIEU_TEN_HIEN_TAI, MA_HO_SO_DANG_SUA || '');
    } else {
      google.script.run.withSuccessHandler(xuLyKetQua).withFailureHandler(xuLyLoi)
        .layDanhSachBangLuongDeChon(MA_HO_SO_DANG_SUA || '');
    }
  }

  /** Tải nhanh 1 hoặc nhiều file hoá đơn/bảng lương NGAY TRONG modal chọn chứng từ — giải quyết đúng
   *  vấn đề "muốn chọn hoá đơn cho hồ sơ nhưng hồ sơ chưa lưu nên chưa có nơi để tải hoá đơn lên":
   *  không cần Mã hồ sơ, file được đọc/OCR ngay và hiện luôn trong danh sách để chọn tiếp. */
  function taiLenNhanhTuPicker_() {
    var input = document.getElementById('modalTaiLieuInputNhanh');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var loaiTaiLieu = (TAI_LIEU_LOAI_HIEN_TAI === 'luong') ? 'BangLuong' : 'HoaDonGTGT';
    document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'block';
    taiLenNhanhLanLuot_(files, 0, loaiTaiLieu);
  }

  function taiLenNhanhLanLuot_(files, idx, loaiTaiLieu) {
    if (idx >= files.length) {
      document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
      document.getElementById('modalTaiLieuInputNhanh').value = '';
      lamMoiDanhSachTaiLieuTrongModal_();
      baoThanhCong('Đã tải lên ' + files.length + ' file — danh sách bên trên đã cập nhật, chọn tiếp bình thường.');
      return;
    }
    var file = files[idx];
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1];
      google.script.run.withSuccessHandler(function () {
        taiLenNhanhLanLuot_(files, idx + 1, loaiTaiLieu);
      }).withFailureHandler(function (err) {
        document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
        baoLoi('Lỗi khi tải "' + file.name + '": ' + ((err && err.message) || err));
      }).taiLenTaiLieuHoSo(MA_HO_SO_DANG_SUA || '', loaiTaiLieu, file.name, file.type, base64);
    };
    reader.onerror = function () {
      document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
      baoLoi('Không đọc được file "' + file.name + '".');
    };
    reader.readAsDataURL(file);
  }

  function renderDanhSachTaiLieu_() {

          '(có thể do tên chưa khớp với tên nhà cung cấp trên hoá đơn đã tải, Sổ chi tiết mua hàng chưa cấu hình, hoặc tất cả hoá đơn của nhà cung cấp này đã được dùng ở hồ sơ khác). ' +
          'Có thể tải hoá đơn lên ngay bên dưới.</div>';

      TAI_LIEU_DANH_SACH.forEach(function (it, i) {

        body.innerHTML = '<div class="msg msg-err">Không tìm thấy dòng lương nào trong Bảng lương (có thể tất cả đã được dùng ở hồ sơ khác, ' +
          'hoặc chưa cấu hình đúng file Bảng lương — xem hằng số SS_BANG_LUONG_ID ở Code.gs).</div>';
        return;
      }
      var html2 = '<div style="max-height:340px; overflow:auto;"><table class="detail"><thead><tr>' +
        '<th style="width:26px;"></th><th>Họ và tên</th><th>Tháng</th><th style="text-align:right;">Số tiền (VND)</th>' +
        '</tr></thead><tbody>';
      TAI_LIEU_DANH_SACH.forEach(function (it, i) {
        html2 += '<tr>' +
          '<td style="text-align:center;"><input type="checkbox" class="chk-taillieu" data-idx="' + i + '"></td>' +
          '<td>' + esc(it.hoTen) + '</td>' +

          '</tr>';

  function apDungChonTaiLieu() {
    var checked = Array.prototype.slice.call(document.querySelectorAll('.chk-taillieu:checked'));
    if (!checked.length) {
      baoLoi('Vui lòng chọn ít nhất 1 dòng.');
      return;
    }
    checked.sort(function (a, b) { return Number(a.dataset.idx) - Number(b.dataset.idx); });
    var tr = document.getElementById(TAI_LIEU_ROW_ID);
    if (!tr) { dongModalTaiLieu(); return; }

    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') {
      var soHDs = [], ngays = [], tongGiaTri = 0;
      checked.forEach(function (chk) {
        var it = TAI_LIEU_DANH_SACH[Number(chk.dataset.idx)];
        if (!it) return;
        soHDs.push(it.sohd);
        ngays.push(it.ngay);
        tongGiaTri += Number(it.giaTri) || 0;
      });
      tr.querySelector('.ct-tlso').value = soHDs.join(', ');
      tr.querySelector('.ct-ngaytl').value = ngays.join(', ');
      // Gợi ý "Số tiền" = tổng Giá trị (cột O) của các hoá đơn đã chọn — vẫn có thể tự gõ số khác sau đó.
      tr.querySelector('.ct-sotien').value = fmtTien(tongGiaTri);
    } else {
      var hoTens = [], thangs = [], tongLuong = 0;
      checked.forEach(function (chk) {
        var it = TAI_LIEU_DANH_SACH[Number(chk.dataset.idx)];
        if (!it) return;
        hoTens.push(it.hoTen + ' (' + it.thang + ')');
        thangs.push(it.thang);
        tongLuong += Number(it.soTien) || 0;
      });
      tr.querySelector('.ct-tlso').value = hoTens.join(', ');
      // Cột "Ngày tài liệu" dùng lại để ghi Tháng lương cho các dòng chọn từ Bảng lương.
      tr.querySelector('.ct-ngaytl').value = thangs.filter(function (v, i) { return thangs.indexOf(v) === i; }).join(', ');
      tr.querySelector('.ct-sotien').value = fmtTien(tongLuong);
    }
    capNhatTongTien();
    dongModalTaiLieu();
  }

  function dongModalTaiLieu() {
    document.getElementById('modalTaiLieu').style.display = 'none';
    TAI_LIEU_ROW_ID = '';
    TAI_LIEU_DANH_SACH = [];
  }

  function xoaDong(id) {
    var el = document.getElementById(id);
    if (el) el.parentNode.removeChild(el);
    capNhatTongTien();
  }

  /** Lớp CSS badge đúng theo trạng thái hồ sơ — dùng chung cho mọi bảng hiển thị hồ sơ trong app. */
  function lopBadgeTrangThai_(trangThai) {
    if (trangThai === 'Đã giải ngân') return 'trangthai-daigiaingan';
    if (trangThai === 'Đã hủy') return 'trangthai-huy';
    return 'trangthai-daotaohoso'; // Nháp / Đã tạo hồ sơ
  }

  /** Chỉ được xoá hồ sơ khi còn ở Nháp hoặc Đã tạo hồ sơ — Đã giải ngân/Đã hủy là chốt cuối, không xoá. */
  function coTheXoaHoSo_(trangThai) {
    return trangThai !== 'Đã giải ngân' && trangThai !== 'Đã hủy';
  }

  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/"/g, '&quot;');
  }

  function capNhatTongTien() {
    if (HO_SO_TIEN_LE_.length) return; // giữ NGUYÊN số liệu lịch sử, không tính lại/không làm tròn
    var laUSD = document.getElementById('loaiTienHoSo') && document.getElementById('loaiTienHoSo').value === 'USD';
    var tyGia = 0;
    if (laUSD) {
      try { tyGia = layTyGia_(document.getElementById('tyGiaBan').value); } catch (e) { tyGia = 0; }
    }
    var rows = document.querySelectorAll('#tbodyChiTiet tr');
    var tong = 0, tongQuyDoi = 0;
    rows.forEach(function (r) {
      var v = layGiaTriSoMem_(r.querySelector('.ct-sotien'), 'Số tiền').n;
      tong += v;
      if (laUSD) {
        var quyDoi = quyDoiVND_(v, tyGia);
        var oQuyDoi = r.querySelector('.ct-quydoi');
        if (oQuyDoi) oQuyDoi.value = quyDoi ? fmtTien(quyDoi) : '';
        tongQuyDoi += quyDoi;
      }
    });
    document.getElementById('tongTien').textContent = fmtTien(tong);
    // "Số tiền nhận nợ lần này" luôn tự động bằng tổng "Số tiền" các dòng thụ hưởng ở mục 4.
    document.getElementById('soTienNhanNoLanNay').value = fmtTien(tong);
    if (laUSD) {
      document.getElementById('tongTienQuyDoi').textContent = fmtTien(tongQuyDoi);
      document.getElementById('soTienQuyDoiTong').value = fmtTien(tongQuyDoi);
    }
    // Cập nhật hiện/ẩn cột "Số tiền quy đổi" ở từng dòng (VD: vừa đổi Loại tiền vay sau khi đã có dòng).
    document.querySelectorAll('.ct-quydoi-cell').forEach(function (td) { td.style.display = laUSD ? '' : 'none'; });
  }

  /** ROUND(USD x Tỷ giá, 0) bằng số học nguyên (BigInt) — không làm tròn tỷ giá trước, không sai số dấu phẩy động. */
  function quyDoiVND_(usd, tyGia) {
    if (!usd || !tyGia) return 0;
    var s = (Math.abs(tyGia) < 1e21 && Math.abs(tyGia) >= 1e-6) ? String(tyGia) : tyGia.toFixed(10);
    var p = s.split('.'), le = p[1] || '';
    var tich = BigInt(usd) * BigInt(p[0] + le);
    var mau = BigInt(10) ** BigInt(le.length);
    return Number((tich * 2n + mau) / (mau * 2n));
  }

  function thuThapDuLieuForm(chiPhiTienTe) {
    var boTien = !!chiPhiTienTe; // true: chỉ lấy thông tin KHÔNG phải tiền (hồ sơ cũ có số lẻ)
    if (!boTien) capNhatTongTien(); // tính lại tổng từ các dòng ngay trước khi gửi (không phụ thuộc sự kiện gõ phím)
    var maHD = document.getElementById('selHopDong').value;
    if (!maHD) { baoLoi('Vui lòng chọn công ty và hợp đồng vay.'); return null; }
    var soTienLanNay = 0;

  /** Hiện 2 link (bản gốc Doc/Sheet + PDF) cho 1 văn bản tạo theo mẫu thật. */

    if (!ketQua) return;
    var box = document.getElementById('linksBox');
    function them(bieuTuong, hauTo, url) {
      if (!url) return;
      var a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.textContent = bieuTuong + ' ' + ten + ' (' + hauTo + ')';
      box.appendChild(a);
    }
    // Mỗi định dạng một link riêng: DOCX / PDF / XLSX (không lẫn nhau).
    them('📝', 'DOCX', ketQua.docxUrl);
    if (!ketQua.docxUrl) them('🔗', 'bản gốc', ketQua.docUrl || ketQua.sheetUrl);
    else if (ketQua.sheetUrl) them('🔗', 'Google Sheet', ketQua.sheetUrl);
    them('📄', 'PDF', ketQua.pdfUrl);
    them('📊', '.xlsx', ketQua.xlsxUrl);
  }

    return t + ((res.canhBao && res.canhBao.length) ? ' ⚠ ' + res.canhBao.join(' | ') : '');
  }

  function trinhTaoChong_(doan, s, e, boQua) {
    return TT_.anhXa.some(function (a, i) { return i !== boQua && a.doan === doan && (s === e ? (s > a.s && s < a.e) : (s < a.e && a.s < e)); });
  }

  function trinhTaoVe_() {
    if (!TT_) return;
    var hangDaVe = {}, h = '';
    TT_.doan.forEach(function (d) {
      var phan = d.id.split('#')[0], kh = d.hangId >= 0 ? phan + '|' + d.hangId : '', xoa = kh && TT_.xoa[kh];
      var cacVung = [];
      TT_.anhXa.forEach(function (a, i) { if (a.doan === d.id) cacVung.push({ s: a.s, e: a.e, loai: 'a', i: i, khoa: a.khoa }); });
      TT_.goiY.forEach(function (g, i) {
        if (g.doan === d.id && !TT_.bo[i] && !TT_.anhXa.some(function (a) { return a.doan === g.doan && a.s === g.s && a.e === g.e && a.khoa === g.khoa; }) && !trinhTaoChong_(g.doan, g.s, g.e, -1)) cacVung.push({ s: g.s, e: g.e, loai: 'g', i: i, khoa: g.khoa, ly: g.ly });
      });
      cacVung.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
      var vt = 0, html = '';
      cacVung.forEach(function (v) {
        if (v.s < vt) return;
        html += escH_(d.text.substring(vt, v.s));
        if (v.s === v.e) html += '<mark class="tt-' + v.loai + '" title="' + escH_(v.khoa) + '">⟦' + escH_(v.khoa) + '⟧</mark>';
        else html += '<mark class="tt-' + v.loai + '" title="' + escH_(v.khoa) + '">' + escH_(d.text.substring(v.s, v.e)) + '</mark>';
        vt = v.e;
      });
      html += escH_(d.text.substring(vt));
      // NB: ⟦…⟧ của vùng "chèn" chỉ để hiển thị; không nằm trong văn bản gốc → bù khi tính vị trí (xem trinhTaoViTri_)
      var chip = cacVung.map(function (v) {
        if (v.loai === 'a') return '<span class="tt-chip tt-chip-a">' + (v.s === v.e ? '(chèn)' : escH_(d.text.substring(v.s, v.e)).slice(0, 40)) + ' → <b>' + escH_(v.khoa) + '</b> <a href="javascript:void(0)" onclick="trinhTaoBo(' + v.i + ')" title="Bỏ gán">✕</a></span>';
        return '<span class="tt-chip tt-chip-g">✨ ' + escH_(d.text.substring(v.s, v.e)).slice(0, 40) + ' → <b>' + escH_(v.khoa) + '</b> <a href="javascript:void(0)" onclick="trinhTaoNhanGoiY(' + v.i + ')" title="' + escH_(v.ly || '') + '">✓</a> <a href="javascript:void(0)" onclick="trinhTaoBoGoiY(' + v.i + ')">✕</a></span>';
      }).join(' ');
      var ctrlHang = '';
      if (kh && !hangDaVe[kh]) { hangDaVe[kh] = true; ctrlHang = '<label class="hint" style="margin-left:8px;"><input type="checkbox" style="width:auto;" ' + (xoa ? 'checked' : '') + ' onchange="trinhTaoDatXoa(\'' + escAttr_(phan) + '\',' + d.hangId + ',this.checked)"> xoá cả hàng bảng này (hàng ví dụ thừa)</label>'; }
      h += '<div class="tt-dong" style="padding:5px 4px;border-bottom:1px solid #eee;' + (xoa ? 'opacity:.4;text-decoration:line-through;' : '') + '">' +
        '<div class="hint" style="font-size:11px;">' + escH_(d.viTri) + ctrlHang + '</div>' +
        '<div class="tt-text" data-id="' + escH_(d.id) + '" style="white-space:pre-wrap;user-select:text;cursor:text;">' + html + '</div>' + (chip ? '<div style="margin-top:2px;">' + chip + '</div>' : '') + '</div>';
    });

    document.getElementById('tt_tomTat').textContent = TT_.anhXa.length + ' vùng đã gán · ' + Object.keys(TT_.xoa).filter(function (k) { return TT_.xoa[k]; }).length + ' hàng sẽ xoá';

  /** Vị trí ký tự trong VĂN BẢN GỐC của đoạn (bỏ phần hiển thị ⟦…⟧ của vùng chèn). */
  function trinhTaoViTri_(el, node, offset) {
    var r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, offset);
    var frag = r.cloneContents(), tong = frag.textContent.length;
    frag.querySelectorAll('mark').forEach(function (m) { if (/^⟦/.test(m.textContent) && /⟧$/.test(m.textContent)) tong -= m.textContent.length; });
    return tong;

  /** Ghi nhận vùng đang bôi chọn trong khung đoạn văn (nếu vùng chọn nằm trong ĐÚNG MỘT đoạn). Vùng chọn cuối cùng hợp lệ được GIỮ khi bạn bấm sang ô chọn trường. */
  function trinhTaoGhiNhanChon_() {
    if (!TT_) return;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var rg = sel.getRangeAt(0);
    var a = rg.startContainer.nodeType === 3 ? rg.startContainer.parentNode : rg.startContainer;
    var b = rg.endContainer.nodeType === 3 ? rg.endContainer.parentNode : rg.endContainer;
    var ea = a && a.closest && a.closest('.tt-text'), eb = b && b.closest && b.closest('.tt-text');
    if (!ea && !eb) return; // bôi chọn ở nơi khác (vd ô chọn trường) → giữ vùng chọn cũ
    if (!ea || !eb || ea !== eb) { TT_.chon = null; document.getElementById('tt_tomTat').textContent = 'Chỉ bôi chọn trong MỘT đoạn.'; return; }
    var s = trinhTaoViTri_(ea, rg.startContainer, rg.startOffset), e = trinhTaoViTri_(ea, rg.endContainer, rg.endOffset);
    var d = TT_.doan.filter(function (x) { return x.id === ea.getAttribute('data-id'); })[0];
