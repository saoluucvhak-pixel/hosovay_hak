<script>

  // =========================================================================
  // ĐỒNG BỘ DỮ LIỆU PHÍA TRÌNH DUYỆT: RequestCoordinator + AppDataStore + DataSyncDiagnostics
  //  • MỘT nơi giữ dữ liệu nghiệp vụ (AppDataStore) — không còn nhiều mảng toàn cục mâu thuẫn nhau.
  //  • Mọi lượt gọi đọc đi qua RequestCoordinator: mỗi "khoá" chỉ nhận response của lượt gọi MỚI NHẤT (response cũ bị bỏ, không ghi đè).
  //  • Mỗi miền dữ liệu có phiên bản (revision) từ máy chủ; response có phiên bản CŨ HƠN dữ liệu đang giữ bị bỏ.
  //  • Danh sách rỗng là kết quả hợp lệ: hiển thị ngay, không đọc lại. Đọc lỗi → báo lỗi thật, giữ nguyên dữ liệu đang có.
  //  • KHÔNG có setTimeout/retry để "chữa" dữ liệu. Phát hiện thay đổi từ phiên khác bằng cách hỏi revision khi quay lại tab.
  // =========================================================================

  // =========================================================================
  // ĐĂNG NHẬP QUA CỔNG (theo mô hình HDMB_HAK) + cửa api()
  //  • hakRun_() thay cho google.script.run: cùng cách dùng, nhưng mọi lời gọi đi qua api(phien, tenHam, [tham số]).
  //  • Mã phiên lưu ở localStorage (dùng chung các tab); máy chủ tự gia hạn khi đang dùng, tối đa 7 ngày.
  //  • Đăng nhập từ trang nhúng: cửa sổ nhỏ hiện MÃ GHÉP CẶP 6 số, người dùng nhập vào đây (chặn lừa đăng nhập hộ).
  // =========================================================================
  var HAK_PHIEN_KHOA = 'hosovay_hak_phien', HAK_LOI_DANG_NHAP = '[AUTH] ', HAK_LOI_QUYEN = '[QUYEN] ';
  var HAK_NGUOI_DUNG = null, HAK_YEU_CAU_DN = '';
  function hakPhien_() { try { return localStorage.getItem(HAK_PHIEN_KHOA) || ''; } catch (e) { return window.__hakPhien || ''; } }
  function hakLuuPhien_(p) { window.__hakPhien = p || ''; try { if (p) localStorage.setItem(HAK_PHIEN_KHOA, p); else localStorage.removeItem(HAK_PHIEN_KHOA); } catch (e) { /* bị chặn */ } }
  function hakPhanSau_(msg, tienTo) { var i = msg.indexOf(tienTo); return i >= 0 ? msg.slice(i + tienTo.length) : ''; }

  function hakRun_() {
    var ok = null, fail = null, p;
    var boc = function (err, uo) {
      var msg = String((err && err.message) || err || '');
      var dn = hakPhanSau_(msg, HAK_LOI_DANG_NHAP);
      if (dn) { hakHienDangNhap_(dn); return; }
      var q = hakPhanSau_(msg, HAK_LOI_QUYEN);
      if (fail) fail(q ? new Error(q) : err, uo);
      else if (q) baoLoi(q);
      else console.error(msg);
    };
    p = new Proxy({}, { get: function (_, ten) {
      if (ten === 'withSuccessHandler') return function (f) { ok = f; return p; };
      if (ten === 'withFailureHandler') return function (f) { fail = f; return p; };
      return function () {
        var thamSo = Array.prototype.slice.call(arguments);
        return google.script.run
          .withSuccessHandler(function (kq, uo) { if (ok) ok(kq, uo); tuVoHieuSauGhi_(String(ten)); })
          .withFailureHandler(boc)
          .api(hakPhien_(), String(ten), thamSo);
      };
    } });
    return p;
  }

  function hakDangNhung_() { try { return window.parent !== window.top; } catch (e) { return true; } }

  function hakHienDangNhap_(loi) {
    hakLuuPhien_('');
    AppDataStore.xoaTatCa(); // hết phiên / đăng xuất: không giữ dữ liệu nghiệp vụ trong trình duyệt
    try { HS_KET_QUA_ = null; renderTongQuan_(); renderBangHoSo_(); renderChipLocHoSo_(); capNhatBadgeSidebar_(); } catch (e) { /* giao diện chưa dựng */ }
    var nen = document.getElementById('hakDangNhapNen'); if (!nen) return;
    document.getElementById('hakDangNhapLoi').textContent = loi || ''; document.getElementById('hakDangNhapLoi').style.display = loi ? '' : 'none';
    var vung = document.getElementById('hakDangNhapNut'); vung.textContent = '';
    document.getElementById('hakDangNhapGhepCap').style.display = 'none';
    var cong = (HAK_NGUOI_DUNG && HAK_NGUOI_DUNG.congDangNhapUrl) || '';
    if (!cong) {
      document.getElementById('hakDangNhapPhu').textContent = 'Quản trị chưa cấu hình Cổng đăng nhập. Chủ hệ thống mở Web App bằng tài khoản chủ → Cài đặt → Đăng nhập & người dùng.';
    } else if (hakDangNhung_()) {
      document.getElementById('hakDangNhapPhu').textContent = 'Dùng tài khoản Google đã được Quản trị cấp quyền.';
      var nut = document.createElement('button'); nut.type = 'button'; nut.className = 'btn btn-primary'; nut.textContent = 'Đăng nhập bằng Google';
      nut.onclick = function () { hakDangNhapCuaSoNho_(cong); }; vung.appendChild(nut);
    } else {
      document.getElementById('hakDangNhapPhu').textContent = 'Dùng tài khoản Google đã được Quản trị cấp quyền.';
      var a = document.createElement('a'); a.className = 'btn btn-primary'; a.target = '_top'; a.href = cong; a.textContent = 'Đăng nhập bằng Google'; vung.appendChild(a);
    }
    nen.classList.add('hien');
    var chip = document.getElementById('hakNguoiDungChip'); if (chip) chip.classList.remove('hien');
  }

  function hakDangNhapCuaSoNho_(cong) {
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    HAK_YEU_CAU_DN = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    var w = window.open(cong + (cong.indexOf('?') >= 0 ? '&' : '?') + 'yc=' + HAK_YEU_CAU_DN, 'hosovay_dang_nhap', 'width=520,height=680');
    document.getElementById('hakDangNhapTrangThai').textContent = w ? 'Đăng nhập ở cửa sổ mới, rồi nhập MÃ 6 SỐ hiện ở đó vào ô bên dưới.' : 'Trình duyệt chặn cửa sổ bật lên — cho phép rồi bấm lại.';
    document.getElementById('hakDangNhapGhepCap').style.display = 'block';
    document.getElementById('hakMaGhepCap').value = ''; document.getElementById('hakMaGhepCap').focus();
  }
  function hakXacNhanMaGhepCap_() {
    var ma = String(document.getElementById('hakMaGhepCap').value || '').trim();
    var tt = document.getElementById('hakDangNhapTrangThai');
    if (!/^\d{6}$/.test(ma)) { tt.textContent = 'Nhập đủ 6 chữ số.'; return; }
    google.script.run.withSuccessHandler(function (kq) {
      if (kq && kq.phien) { hakLuuPhien_(kq.phien); location.reload(); return; }
      if (kq && kq.loi) { hakHienDangNhap_(kq.loi); return; }
      tt.textContent = (kq && kq.saiMa) ? 'Sai mã — kiểm tra lại mã ở cửa sổ đăng nhập.' : 'Chưa thấy đăng nhập hoàn tất ở cửa sổ kia, hoặc mã chưa đúng.';
    }).withFailureHandler(function (err) { tt.textContent = 'Lỗi: ' + ((err && err.message) || err); }).nhanPhienDangNhap(HAK_YEU_CAU_DN, ma);
  }
  function hakDangXuat_() {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).dangXuat(hakPhien_());
    hakLuuPhien_(''); hakHienDangNhap_('Đã đăng xuất.');
  }
  function hakVeChip_() {
    var nd = HAK_NGUOI_DUNG, chip = document.getElementById('hakNguoiDungChip');
    var quanTri = !nd || nd.cheDo !== 'CONG_HAK' || nd.vaiTro === 'ADMIN';
    ['cdBtn-dongbo', 'cdBtn-nguoidung', 'cdBtn-mau', 'cdBtn-cauhinh'].forEach(function (id) { var b = document.getElementById(id); if (b) b.style.display = quanTri ? '' : 'none'; });
    if (!chip || !nd || !nd.daDangNhap || nd.cheDo !== 'CONG_HAK') { if (chip) chip.classList.remove('hien'); return; }
    document.getElementById('hakChipEmail').textContent = nd.email; document.getElementById('hakChipVaiTro').textContent = nd.vaiTroNhan;
    document.getElementById('hakChipDangXuat').style.display = nd.quaPhien ? '' : 'none';
    chip.classList.add('hien');
  }

  /** Khởi động: lấy phiên (do doGet đưa vào trang hoặc đã lưu), hỏi trạng thái đăng nhập, rồi mới nạp dữ liệu. */
  function hakKhoiDong_() {
    var el = document.getElementById('hakPhanQuyen'), tuServer = el ? (el.getAttribute('data-phien') || '') : '', loi = el ? (el.getAttribute('data-loi') || '') : '';
    if (tuServer) {
      hakLuuPhien_(tuServer);
      try { google.script.url.getLocation(function (loc) { var ts = {}, pr = (loc && loc.parameter) || {}; Object.keys(pr).forEach(function (k) { if (k !== 'sso') ts[k] = pr[k]; }); google.script.history.replace(null, ts); }); } catch (e) { /* không có */ }
    }
    google.script.run.withSuccessHandler(function (tt) {
      HAK_NGUOI_DUNG = tt || null;
      if (tt && tt.phienMoi) hakLuuPhien_(tt.phienMoi);
      if (tt && tt.daDangNhap === false) { hakHienDangNhap_(loi); return; }
      hakVeChip_();
      taiDuLieuBanDau();
    }).withFailureHandler(function () { taiDuLieuBanDau(); /* không kiểm tra được trạng thái: api() sẽ báo [AUTH] nếu cần */ }).thongTinDangNhap(hakPhien_());
  }

  var RequestCoordinator = (function () {
    var seq = {}, dem = 0, nhatKy = [];
    function ghi(m) { nhatKy.push(m); if (nhatKy.length > 100) nhatKy.shift(); }
    /** @param {string} khoa nhóm lượt gọi (chỉ lượt mới nhất của khoá được áp dụng)
     *  @param {string} tenHam hàm Apps Script @param {Array} args
     *  @param {function(*, Object)} onOk nhận (data, meta) — với phong bì {ok,data,meta,error} đã bóc sẵn
     *  @param {function(Object)} onLoi nhận {message, ma} */
    function goi(khoa, tenHam, args, onOk, onLoi) {
      var id = 'R' + (++dem), t0 = Date.now();
      seq[khoa] = (seq[khoa] || 0) + 1;
      var mine = seq[khoa];
      function ghiLog(ket, meta, ma) {
        ghi({ id: id, module: khoa, action: tenHam, ms: Date.now() - t0, ket: ket, ma: ma || '',
          cache: meta && meta.cache ? Object.keys(meta.cache).map(function (k) { return k + ':' + meta.cache[k]; }).join(' ') : '',
          phienBan: meta && meta.phienBanDoc ? JSON.stringify(meta.phienBanDoc) : '', soBanGhi: meta && meta.soBanGhi ? JSON.stringify(meta.soBanGhi) : '',
          thoiGianServerMs: meta && meta.tongMs !== undefined ? meta.tongMs : '', docSheetsMs: meta && meta.thoiGianMs ? JSON.stringify(meta.thoiGianMs) : '', luc: new Date().toLocaleTimeString() });
      }
      var run = hakRun_()
        .withSuccessHandler(function (res) {
          var cuHon = mine !== seq[khoa];
          var phongBi = res && typeof res === 'object' && !Array.isArray(res) && typeof res.ok === 'boolean' && ('meta' in res);
          if (phongBi && !res.ok) {
            ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', res.meta, res.error && res.error.ma);
            if (!cuHon && onLoi) onLoi({ message: (res.error && res.error.thongBao) || 'Lỗi máy chủ', ma: res.error && res.error.ma });
            return;
          }
          if (res === null || res === undefined) {
            ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', null, 'PHAN_HOI_TRONG');
            if (!cuHon && onLoi) onLoi({ message: 'Máy chủ không trả dữ liệu (phản hồi trống). Hãy bấm Làm mới; nếu lặp lại, báo quản trị.', ma: 'PHAN_HOI_TRONG' });
            return;
          }
          var khongDay = phongBi && res.meta && res.meta.isComplete === false;
          ghiLog(cuHon ? 'BO_QUA_CU' : (khongDay ? 'KHONG_DAY_DU' : 'OK'), phongBi ? res.meta : null, khongDay ? 'DU_LIEU_HONG' : '');
          if (cuHon) return; // response của lượt gọi cũ — KHÔNG ghi đè dữ liệu mới
          if (onOk) onOk(phongBi ? res.data : res, phongBi ? res.meta : null);
          if (khongDay) { var b = document.getElementById('msgBox'); if (b) b.innerHTML = '<div class="msg msg-err">⚠ Dữ liệu từ máy chủ cần kiểm tra: có ' + (res.meta.soCanhBao || res.meta.canhBao.length) + ' cảnh báo (giá trị hỏng đã bị bỏ trống hoặc mã/khoá bị TRÙNG trên Sheet — đã bỏ qua dòng trùng). Chi tiết: ' + esc((res.meta.canhBao || []).slice(0, 3).join('; ')) + '. Hãy sửa trên Google Sheets rồi Làm mới.</div>'; }
        })
        .withFailureHandler(function (err) {
          var cuHon = mine !== seq[khoa];
          ghiLog(cuHon ? 'BO_QUA_CU' : 'LOI', null, 'GOI_THAT_BAI');
          if (!cuHon && onLoi) onLoi({ message: (err && err.message) ? err.message : String(err), ma: 'GOI_THAT_BAI' });
        });
      run[tenHam].apply(run, args || []);
      return id;
    }
    return { goi: goi, nhatKy: function () { return nhatKy.slice(); }, dangBay: function (khoa) { return seq[khoa] || 0; } };
  })();

  /**
   * AppDataStore — NGUỒN DỮ LIỆU DUY NHẤT ở trình duyệt.
   *  • entities: bản ghi theo ID ổn định (CONGTY→MaCty, HOPDONG→MaHD, KHACHHANG→MaKH, HOSO→MaHoSo); thuộc tính congTy/hopDong/khachHang/hoSoGoc
   *    là mảng SUY RA từ entities (không phải bản sao độc lập; sửa mảng trả về không đổi store).
   *  • queries: kết quả truy vấn (danh sách lọc hồ sơ) kèm tham số + thời điểm.
   *  • versions: phiên bản dữ liệu máy chủ đã nạp của từng miền; response CŨ HƠN bị bỏ.
   *  • requestState: trạng thái nạp từng miền (idle/loading/ok/error) + lỗi cuối.
   *  • subscribers: giao diện đăng ký để được vẽ lại khi miền đổi.
   *  • Dữ liệu từ máy chủ phải qua kiểm tra schema (mảng đối tượng có khoá ID); sai → bỏ cả lượt, KHÔNG xoá store.
   *  • xoaTatCa(): gọi khi hết phiên / đổi người dùng / đổi công ty — không để dữ liệu rò sang phạm vi khác.
   */
  var AppDataStore = {
    KHOA_ID: { CONGTY: 'MaCty', HOPDONG: 'MaHD', KHACHHANG: 'MaKH', HOSO: 'MaHoSo' },
    TEN_THUOC_TINH: { CONGTY: 'congTy', HOPDONG: 'hopDong', KHACHHANG: 'khachHang', HOSO: 'hoSoGoc' },
    entities: { CONGTY: {}, HOPDONG: {}, KHACHHANG: {}, HOSO: {} },
    _thuTu: { CONGTY: [], HOPDONG: [], KHACHHANG: [], HOSO: [] },
    _memo: {},
    queries: { hoSoLoc: { thamSo: null, ketQua: [], luc: '' } },
    tongQuan: null, // số liệu tổng quan hồ sơ tính ở MÁY CHỦ (không tải cả danh sách hồ sơ xuống trình duyệt)
    versions: { CONGTY: -1, HOPDONG: -1, KHACHHANG: -1, HOSO: -1 },
    requestState: { CONGTY: { tt: 'idle', loi: '' }, HOPDONG: { tt: 'idle', loi: '' }, KHACHHANG: { tt: 'idle', loi: '' }, HOSO: { tt: 'idle', loi: '' } },
    subscribers: [],
    daNap: false, ngayServer: '', thoiDiemNap: '', lanCuoiHoiPhienBan: 0, phamVi: '',

    get phienBan() { return this.versions; },
    get congTy() { return this._lay('CONGTY'); }, set congTy(v) { this._dat('CONGTY', v); },
    get hopDong() { return this._lay('HOPDONG'); }, set hopDong(v) { this._dat('HOPDONG', v); },
    get khachHang() { return this._lay('KHACHHANG'); }, set khachHang(v) { this._dat('KHACHHANG', v); },
    get hoSoGoc() { return this._lay('HOSO'); }, set hoSoGoc(v) { this._dat('HOSO', v); },
    get hoSoLoc() { return this.queries.hoSoLoc.ketQua; }, set hoSoLoc(v) { this.queries.hoSoLoc.ketQua = Array.isArray(v) ? v : []; this.queries.hoSoLoc.luc = new Date().toLocaleTimeString(); },

    _lay: function (m) {
      if (!this._memo[m]) { var e = this.entities[m]; this._memo[m] = this._thuTu[m].map(function (id) { return e[id]; }); }
      return this._memo[m];
    },
    /** Kiểm tra schema rồi mới thay; trả mảng lỗi (rỗng = hợp lệ). */
    kiemTraSchema_: function (m, arr) {
      if (!Array.isArray(arr)) return ['không phải mảng'];
      var k = this.KHOA_ID[m], loi = [], thay = {};
      for (var i = 0; i < arr.length; i++) {
        var o = arr[i];
        if (!o || typeof o !== 'object' || Array.isArray(o)) { loi.push('phần tử ' + i + ' không phải đối tượng'); break; }
        if (o[k] === undefined || o[k] === null || o[k] === '') { loi.push('phần tử ' + i + ' thiếu khoá ' + k); break; }
        if (thay[o[k]]) { loi.push('trùng khoá ' + k + '=' + o[k]); break; }
        thay[o[k]] = 1;
      }
      return loi;
    },
    _dat: function (m, arr) {
      var loi = this.kiemTraSchema_(m, arr);
      if (loi.length) throw new Error('Dữ liệu ' + m + ' không hợp lệ: ' + loi[0]);
      var k = this.KHOA_ID[m], e = {}, t = [];
      arr.forEach(function (o) { e[o[k]] = o; t.push(String(o[k])); });
      this.entities[m] = e; this._thuTu[m] = t; this._memo[m] = null;
    },
    lay: function (m, id) { return this.entities[m][id] || null; },

    dangKy: function (fn) { this.subscribers.push(fn); },
    _thongBao: function (doi) { if (!doi.length) return; this.subscribers.forEach(function (f) { try { f(doi); } catch (e) { console.error('subscriber:', e); } }); },
    xoaTatCa: function () {
      var self = this;
      Object.keys(this.entities).forEach(function (m) { self.entities[m] = {}; self._thuTu[m] = []; self._memo[m] = null; self.versions[m] = -1; self.requestState[m] = { tt: 'idle', loi: '' }; });
      this.queries.hoSoLoc = { thamSo: null, ketQua: [], luc: '' }; this.tongQuan = null; this.daNap = false; this.revisionMayChu = null;
    },

    /** Nạp các miền (mặc định tất cả) bằng MỘT lượt gọi. onXong(cacMienDaDoi) / onLoi(err). Lỗi KHÔNG làm đổi store. */
    nap: function (dsMien, tuyChon, onXong, onLoi) {
      var self = this, yeuCau = (dsMien && dsMien.length) ? dsMien.slice().sort() : null;
      // Miền HOSO KHÔNG còn tải toàn bộ xuống trình duyệt: được làm mới bằng tổng quan + TRANG hiện tại do máy chủ phân trang (lamMoiHoSoServer_).
      var coHoSo = !yeuCau || yeuCau.indexOf('HOSO') >= 0;
      var mien = yeuCau ? yeuCau.filter(function (m) { return m !== 'HOSO'; }) : ['CONGTY', 'HOPDONG', 'KHACHHANG'];
      var xongHoSo = function (doi) {
        if (!coHoSo) { if (onXong) onXong(doi); return; }
        lamMoiHoSoServer_(tuyChon, function () { self.daNap = true; if (onXong) onXong(doi.concat(['HOSO'])); }, function (err) { if (onLoi) onLoi(err); });
      };
      if (!mien.length) { xongHoSo([]); return; }
      var dich = mien.slice();
      dich.forEach(function (m) { self.requestState[m].tt = 'loading'; });
      var khoa = 'store:' + mien.join('+');
      var loiChung = function (err) { dich.forEach(function (m) { self.requestState[m] = { tt: 'error', loi: err.message }; }); if (onLoi) onLoi(err); };
      RequestCoordinator.goi(khoa, 'layDuLieuKhoiTao', [{ mien: mien, boQuaCache: !!(tuyChon && tuyChon.boQuaCache) }], function (data, meta) {
        var doi;
        try { doi = self.ap_(data, meta); } catch (e) { loiChung({ message: e.message, ma: 'DU_LIEU_KHONG_HOP_LE' }); return; }
        dich.forEach(function (m) { self.requestState[m] = { tt: 'ok', loi: '' }; });
        self.daNap = true; self.thoiDiemNap = new Date().toLocaleTimeString();
        if (data && data.ngay) self.ngayServer = data.ngay;
        self._thongBao(doi);
        xongHoSo(doi);
      }, loiChung);
    },

    /** Áp dữ liệu theo từng miền: kiểm schema TẤT CẢ trước (hỏng 1 miền → bỏ cả lượt); bỏ miền có phiên bản CŨ HƠN. @return {string[]} miền đã đổi */
    ap_: function (data, meta) {
      var self = this, pb = (meta && meta.phienBanDoc) || {}, moi = [];
      Object.keys(this.KHOA_ID).forEach(function (m) {
        if (m === 'HOSO') return; // hồ sơ KHÔNG nạp cả danh sách xuống trình duyệt (xem lamMoiHoSoServer_)
        var k = self.TEN_THUOC_TINH[m];
        if (!data || data[k] === undefined) return;
        var loi = self.kiemTraSchema_(m, data[k]);
        if (loi.length) throw new Error('Dữ liệu ' + m + ' từ máy chủ không hợp lệ: ' + loi[0]);
        var v = (pb[m] === undefined) ? -1 : pb[m];
        if (v !== -1 && self.versions[m] !== -1 && v < self.versions[m]) return; // dữ liệu cũ hơn cái đang có
        moi.push([m, data[k], v]);
      });
      moi.forEach(function (x) { self._dat(x[0], x[1]); self.versions[x[0]] = x[2]; });
      if (meta && meta.cache) this.cacheCuoi = meta.cache;
      return moi.map(function (x) { return x[0]; });
    },

  /** Đọc từng file đã chọn (input multiple) thành base64 rồi gọi lần lượt server để lưu — tránh gửi
   *  nhiều request cùng lúc (Apps Script xử lý tuần tự ổn định hơn khi có nhiều file lớn). */
  function taiLenTuModalDinhKem_() {
    var input = document.getElementById('modalDinhKemInput');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) { baoLoi('Vui lòng chọn ít nhất 1 file.'); return; }
    document.getElementById('modalDinhKemLoading').style.display = 'block';
    taiLenLanLuot_(files, 0);
  }

  function taiLenLanLuot_(files, idx, ketQuaDoc) {
    ketQuaDoc = ketQuaDoc || { docDuoc: 0, khongDoc: 0, tongSoDong: 0 };
    if (idx >= files.length) {
      document.getElementById('modalDinhKemLoading').style.display = 'none';
      document.getElementById('modalDinhKemInput').value = '';
      document.getElementById('modalDinhKemFileList').innerHTML = '';
      napLaiDanhSachTrongModal_();
      taiDanhSachDinhKem();
      var ghiChu = (MODAL_TAILIEU_LOAI === 'HoaDonGTGT' || MODAL_TAILIEU_LOAI === 'BangLuong')
        ? (' — đọc tự động được ' + ketQuaDoc.docDuoc + '/' + files.length + ' file' +
           (ketQuaDoc.tongSoDong > files.length ? (' (tổng cộng ' + ketQuaDoc.tongSoDong + ' dòng, có file .zip chứa nhiều hoá đơn)') : '') +
           (ketQuaDoc.khongDoc ? ('. ' + ketQuaDoc.khongDoc + ' file chưa đọc được, kiểm tra ở "Bảng tổng hợp" bên dưới.') : '.'))
        : '.';
      baoThanhCong('Đã tải lên ' + files.length + ' file' + ghiChu);
      return;
    }
    var file = files[idx];
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1]; // bỏ tiền tố "data:...;base64,"
      hakRun_().withSuccessHandler(function (res) {
        if (res && res.docDuoc) ketQuaDoc.docDuoc++; else ketQuaDoc.khongDoc++;
        ketQuaDoc.tongSoDong += (res && res.soDongDoc) || 0;
        taiLenLanLuot_(files, idx + 1, ketQuaDoc);
      }).withFailureHandler(function (err) {
        document.getElementById('modalDinhKemLoading').style.display = 'none';
        baoLoi('Lỗi khi tải "' + file.name + '": ' + ((err && err.message) || err));
      }).taiLenTaiLieuHoSo(MODAL_TAILIEU_MAHOSO, MODAL_TAILIEU_LOAI, file.name, file.type, base64);
    };
    reader.onerror = function () {
      document.getElementById('modalDinhKemLoading').style.display = 'none';
      baoLoi('Không đọc được file "' + file.name + '".');
    };
    reader.readAsDataURL(file);
  }

  /**
   * Khởi tạo trang: MỘT lượt gọi layDuLieuKhoiTao (phong bì {ok,data,meta,error}) nạp công ty, hợp đồng, khách hàng, hồ sơ + ngày máy chủ.
   * Trước đây là 5 lượt gọi lồng nhau + retry; nguyên nhân gốc "về rỗng" là Date không đóng gói được qua hakRun_()
   * (đã chuẩn hoá đệ quy ở DataSync.gs/anToanChoTrinhDuyet_), nên không cần tách nhỏ hay thử lại.
   * Rỗng thật → hiển thị trạng thái "chưa có dữ liệu" ngay. Lỗi thật → báo lỗi + nút tải lại.
   */
  function taiDuLieuBanDau() {
    hienLoading(true);
    AppDataStore.nap(null, null, function () {
      var loiCu = document.getElementById('loiTaiDuLieuBanDau');
      if (loiCu) loiCu.remove();
      NGAY_HOM_NAY_SERVER = AppDataStore.ngayServer || '';
      if (window.__daDangKyStore) hienLoading(false); // lần nạp lại: subscriber đã vẽ lại các miền đổi
      else hoanTatKhoiTao_();
    }, loiKhoiTao_);
  }

  /** Chạy sau khi dữ liệu đã nạp — dựng toàn bộ giao diện từ AppDataStore. */
  function hoanTatKhoiTao_() {
    try {
      napDanhMucVaoGiaoDien_();
      datNgayLocMacDinh();
      taiDanhMucTaiLieuKem_();
      taiLoaiHoSo_();
      renderTongQuan_();
      renderBangHopDongCuaCongTy_();
      renderBangHoSo_(); renderChipLocHoSo_();
      resetFormMoi();
      chuyenViewHoSo_('list');

      if (!window.__daDangKyStore) { window.__daDangKyStore = true; AppDataStore.dangKy(veLaiTheoMien_); }
      canhBaoTienLeLichSu_();
    } catch (loi) {
      hienLoading(false);
      baoLoi('Lỗi khi dựng giao diện: ' + loi.message);
      hienLoiTaiTrang_();
    }
  }

  /** Cảnh báo (không sửa) dữ liệu lịch sử có số tiền lẻ — gọi 1 lần sau khi nạp xong, không dùng bộ đếm giờ. */

          'hãy chạy menu "Hồ Sơ Vay NH → Rà soát tiền lẻ lịch sử" để xem danh sách cần rà soát.</div>';
      }
    }, function () { /* chỉ là cảnh báo phụ */ });

  /** Hiện thông báo + nút "Tải lại trang" ngay trên Tổng quan khi không tải được dữ liệu ban đầu. */

  /**
   * Chạy khi đổi "Loại tiền vay" ở mục 3 (hoặc khi mở lại 1 hồ sơ đã lưu): hiện/ẩn ô "Tỷ giá bán",
   * đổi nhãn cột "Số tiền" trong bảng thụ hưởng, hiện/ẩn cột "Số tiền quy đổi (VND)" và tính lại tổng.

  /**
   * Lọc + tải danh sách hồ sơ vào bảng (mục 1). Gọi lại hàm này sau mỗi lần Lưu/Xoá hồ sơ
   * để bảng luôn phản ánh đúng dữ liệu mới nhất, không cần tải lại trang.
   */
  // =========================================================================
  // DANH SÁCH HỒ SƠ — PHÂN TRANG / TÌM KIẾM / LỌC / SẮP XẾP Ở MÁY CHỦ (layTrangHoSo). Trình duyệt chỉ giữ TRANG hiện tại (≤100 dòng).
  // =========================================================================
  var HS_LOC_ = { page: 1, pageSize: 50, search: '', filters: {}, sortBy: 'ngayCapNhat', sortDir: 'desc' };
  var HS_KET_QUA_ = null; // phản hồi trang gần nhất (pagination, tổng tiền theo loại tiền, revision)
  var HS_NHAN_LOC_ = { trangThai: 'Trạng thái', loaiTien: 'Loại tiền', maCty: 'Công ty', maHD: 'Hợp đồng', tuNgay: 'Từ ngày', denNgay: 'Đến ngày', tenNguoiHuong: 'Người thụ hưởng', thieuNgay: 'Thiếu ngày giải ngân' };

  /** Làm mới số liệu hồ sơ phía MÁY CHỦ sau mọi thao tác làm đổi dữ liệu hồ sơ: tổng quan + trang đang xem (không tải cả danh sách). */
  function capNhatHoSoGocVaTongQuan_() {
    lamMoiHoSoServer_({ boQuaCache: true }, null, function (err) { baoLoi(err); });
  }
  function lamMoiHoSoServer_(tuyChon, onXong, onLoi) {
    var con = 2, loi = null, ketThuc = function (err) {
      if (err && !loi) loi = err;
      if (--con > 0) return;
      if (loi) { if (onLoi) onLoi(loi); } else if (onXong) onXong();
    };
    taiTongQuanHoSo_(tuyChon, function () { ketThuc(null); }, ketThuc);
    taiTrangHoSo_(tuyChon, function () { ketThuc(null); }, ketThuc);
  }
  function taiTongQuanHoSo_(tuyChon, onXong, onLoi) {
    RequestCoordinator.goi('tongquan_hoso', 'layTongQuanHoSo', [{ boQuaCache: !!(tuyChon && tuyChon.boQuaCache) }], function (q) {
      AppDataStore.tongQuan = q || null;
      if (q && typeof q.revisionSo === 'number') AppDataStore.versions.HOSO = q.revisionSo;
      renderTongQuan_(); capNhatBadgeSidebar_();
      if (onXong) onXong();
    }, function (err) { if (onLoi) onLoi(err); });
  }
  function taiTrangHoSo_(tuyChon, onXong, onLoi) {
    var thongBao = document.getElementById('thongBaoSoHoSo'), tb = document.getElementById('tbody_dsHoSo');
    if (thongBao) thongBao.textContent = 'Đang tải...';
    if (tb) tb.style.opacity = '0.55';
    var yc = { page: HS_LOC_.page, pageSize: HS_LOC_.pageSize, search: HS_LOC_.search, filters: HS_LOC_.filters, sortBy: HS_LOC_.sortBy, sortDir: HS_LOC_.sortDir, boQuaCache: !!(tuyChon && tuyChon.boQuaCache) };
    RequestCoordinator.goi('loc_hoso', 'layTrangHoSo', [yc], function (r) {
      if (!r || r.success !== true) { if (onLoi) onLoi({ message: 'Máy chủ trả về dữ liệu trang không hợp lệ.' }); return; }
      HS_KET_QUA_ = r; AppDataStore.hoSoLoc = r.data;
      HS_LOC_.page = r.pagination.page; // máy chủ có thể kéo về trang cuối nếu dữ liệu vừa giảm
      if (typeof r.revisionSo === 'number') AppDataStore.versions.HOSO = Math.max(AppDataStore.versions.HOSO, r.revisionSo);
      if (tb) tb.style.opacity = '';
      renderBangHoSo_(); renderChipLocHoSo_();
      if (thongBao) thongBao.textContent = '(tìm thấy ' + r.pagination.totalRows + ' hồ sơ)';
      if (onXong) onXong();
    }, function (err) {
      if (tb) tb.style.opacity = '';
      var msg = (err && err.message) ? err.message : String(err);
      if (thongBao) thongBao.innerHTML = '<b style="color:#dc2626;">LỖI: ' + esc(msg) + '</b>';
      if (onLoi) onLoi(err);
    });
  }

  /** Đọc các ô nhập vào trạng thái lọc (khi bấm Áp dụng / Enter / hết thời gian chờ gõ tìm kiếm). */
  function docLocTuForm_() {
    var v = function (id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
    var f = {};
    if (v('loc_trangThai')) f.trangThai = [v('loc_trangThai')];
    if (v('loc_loaiTien')) f.loaiTien = v('loc_loaiTien');
    if (v('loc_congTy')) f.maCty = v('loc_congTy');
    if (v('loc_hopDong')) f.maHD = v('loc_hopDong');
    if (v('loc_tuNgay')) f.tuNgay = v('loc_tuNgay');
    if (v('loc_denNgay')) f.denNgay = v('loc_denNgay');
    if (v('loc_tenNguoiHuong')) f.tenNguoiHuong = v('loc_tenNguoiHuong');
    var el = document.getElementById('loc_thieuNgay'); if (el && el.checked) f.thieuNgay = true;
    HS_LOC_.filters = f; HS_LOC_.search = v('loc_timKiem');
  }
  function datFormTuLoc_() {
    var set = function (id, val) { var el = document.getElementById(id); if (el) el.value = val || ''; };
    var f = HS_LOC_.filters;
    set('loc_trangThai', f.trangThai && f.trangThai[0]); set('loc_loaiTien', f.loaiTien); set('loc_congTy', f.maCty); set('loc_hopDong', f.maHD);
    set('loc_tuNgay', f.tuNgay); set('loc_denNgay', f.denNgay); set('loc_tenNguoiHuong', f.tenNguoiHuong); set('loc_timKiem', HS_LOC_.search);
    var el = document.getElementById('loc_thieuNgay'); if (el) el.checked = !!f.thieuNgay;
  }
  /** Áp dụng bộ lọc mới → QUAY VỀ TRANG 1 (nút Lọc / Áp dụng / Enter). */
  function apDungLocHoSo_() { docLocTuForm_(); HS_LOC_.page = 1; taiTrangHoSo_(); }
  /** Làm mới trang đang xem với đúng bộ lọc/sắp xếp/trang hiện tại (gọi sau khi lưu, đổi trạng thái, xoá, quay lại từ chi tiết). */
  function locDanhSachHoSoClick() { taiTrangHoSo_(); }
  function xoaLocHoSo_() { HS_LOC_.filters = {}; HS_LOC_.search = ''; HS_LOC_.page = 1; datFormTuLoc_(); taiTrangHoSo_(); }
  function xoaMotLocHoSo_(khoa) {
    if (khoa === 'search') HS_LOC_.search = ''; else delete HS_LOC_.filters[khoa];
    HS_LOC_.page = 1; datFormTuLoc_(); taiTrangHoSo_();
  }
  function xoaLocNgayVaTai_() { delete HS_LOC_.filters.tuNgay; delete HS_LOC_.filters.denNgay; HS_LOC_.page = 1; datFormTuLoc_(); taiTrangHoSo_(); }
  /** Gõ tìm kiếm: chờ 400ms sau lần gõ cuối rồi mới gọi máy chủ (không gọi mỗi phím). */
  var HS_HEN_GIO_ = null;
  function timKiemHoSoNhap_() { clearTimeout(HS_HEN_GIO_); HS_HEN_GIO_ = setTimeout(apDungLocHoSo_, 400); }
  function moRongLocHoSo_() { var el = document.getElementById('hs_locNangCao'); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }

  function soBoLocHoSo_() { return Object.keys(HS_LOC_.filters).length + (HS_LOC_.search ? 1 : 0); }
  function renderChipLocHoSo_() {
    var el = document.getElementById('hs_chipLoc'); if (!el) return;
    var n = soBoLocHoSo_(), chip = [];
    if (HS_LOC_.search) chip.push('<span class="chip-loc">Từ khoá: ' + esc(HS_LOC_.search) + ' <a href="javascript:void(0)" title="Bỏ điều kiện này" onclick="xoaMotLocHoSo_(\'search\')">✕</a></span>');
    Object.keys(HS_LOC_.filters).forEach(function (k) {
      var gt = HS_LOC_.filters[k]; if (k === 'thieuNgay') gt = 'có'; else if (Array.isArray(gt)) gt = gt.join(', ');
      if (k === 'maCty' || k === 'maHD') { var lst = k === 'maCty' ? AppDataStore.congTy : AppDataStore.hopDong, kh = k === 'maCty' ? 'MaCty' : 'MaHD', t = k === 'maCty' ? 'TenCty' : 'SoHopDong', f = lst.filter(function (x) { return x[kh] === gt; })[0]; if (f) gt = f[t]; }
      chip.push('<span class="chip-loc">' + esc(HS_NHAN_LOC_[k] || k) + ': ' + esc(gt) + ' <a href="javascript:void(0)" title="Bỏ điều kiện này" onclick="xoaMotLocHoSo_(\'' + k + '\')">✕</a></span>');
    });
    el.innerHTML = n ? chip.join(' ') + ' <button type="button" class="btn btn-secondary" style="padding:2px 8px;font-size:11px;margin:0 0 0 6px;" onclick="xoaLocHoSo_()">Xoá lọc</button>' : '';
    var nut = document.getElementById('hs_nutLocNangCao'); if (nut) nut.textContent = '⚙ Bộ lọc nâng cao' + (n ? ' (' + n + ')' : '');
  }

  // Sắp xếp + phân trang ở MÁY CHỦ
  function sapXepHoSo_(cot) {
    HS_LOC_.sortDir = (HS_LOC_.sortBy === cot && HS_LOC_.sortDir === 'asc') ? 'desc' : 'asc';
    HS_LOC_.sortBy = cot; HS_LOC_.page = 1; taiTrangHoSo_();
  }
  function doiTrangHoSo_(d) { nhayTrangHoSo_(HS_LOC_.page + d); }
  function nhayTrangHoSo_(p) {
    var tong = HS_KET_QUA_ ? HS_KET_QUA_.pagination.totalPages : 1, moi = Math.min(Math.max(1, parseInt(p, 10) || 1), Math.max(1, tong));
    if (moi === HS_LOC_.page && HS_KET_QUA_) return;
    HS_LOC_.page = moi; taiTrangHoSo_();
  }
  function doiCoTrangHoSo_(n) { HS_LOC_.pageSize = [20, 50, 100].indexOf(Number(n)) >= 0 ? Number(n) : 50; HS_LOC_.page = 1; taiTrangHoSo_(); }

  function renderBangHoSo_() {
    var tbody = document.getElementById('tbody_dsHoSo');
    tbody.innerHTML = '';
    var pt = document.getElementById('hs_phanTrang');
    document.querySelectorAll('#tbl_dsHoSo th[data-cot]').forEach(function (th) {
      var dang = th.getAttribute('data-cot') === HS_LOC_.sortBy;

  /** Revision hiện biết của hồ sơ: hồ sơ đang mở thì REVISION_HIEN_TAI; không thì lấy từ kho dữ liệu (cột Revision, hồ sơ cũ = 0). */
  function revisionCuaHoSo_(maHoSo) {
    if (MA_HO_SO_DANG_SUA === maHoSo && REVISION_HIEN_TAI !== null) return REVISION_HIEN_TAI;
    var h = AppDataStore.lay('HOSO', maHoSo);
    if (h) return Number(h.Revision) || 0;
    var l = AppDataStore.hoSoLoc.filter(function (x) { return x.maHoSo === maHoSo; })[0];
    return l && l.revision !== undefined ? Number(l.revision) || 0 : undefined;
  }

  function xoaHoSoTuBang(maHoSo) {
    xoaHoSoGoi_(maHoSo, false);
  }

  /** Xoá MỀM: hồ sơ chỉ bị ẩn, dữ liệu + file Drive được giữ. Nếu đã có tài liệu phát hành, máy chủ trả CO_TAI_LIEU → hỏi lại rồi gọi với xacNhanCoTaiLieu. */
  function xoaHoSoGoi_(maHoSo, daXacNhanTaiLieu) {
    var thucHien = function () {
      hienLoading(true);
      var tuyChon = { xacNhanCoTaiLieu: !!daXacNhanTaiLieu };
      tuyChon.expectedRevision = revisionCuaHoSo_(maHoSo); // BẮT BUỘC: revision hồ sơ đang mở, hoặc revision trong danh sách
      hakRun_().withSuccessHandler(function () {
        hienLoading(false);
        baoThanhCong('Đã ẩn hồ sơ ' + maHoSo + ' (xoá mềm — dữ liệu và tài liệu đã tạo vẫn được giữ để truy vết).');
        if (MA_HO_SO_DANG_SUA === maHoSo) resetFormMoi();
        locDanhSachHoSoClick();
        capNhatHoSoGocVaTongQuan_();
      }).withFailureHandler(function (err) {
        hienLoading(false);
        var m = String((err && err.message) || err), kq = m.match(/CO_TAI_LIEU\|(\d+)\|([\s\S]*)/);
        if (kq && !daXacNhanTaiLieu) { hoiXacNhan(kq[2], function () { xoaHoSoGoi_(maHoSo, true); }); return; }
        baoLoi(err);
      }).xoaHoSo(maHoSo, tuyChon);
    };
    if (daXacNhanTaiLieu) thucHien(); else hoiXacNhan('Xoá hồ sơ ' + maHoSo + '? Hồ sơ sẽ bị ẩn khỏi danh sách (xoá mềm, quản trị có thể khôi phục).', thucHien);
  }

      } else {

          ['Mã CIF', c.MaCIF], ['Địa chỉ trụ sở', c.DiaChiTruSo],
          ['Điện thoại', c.DienThoai], ['Fax', c.Fax],

          ['Giấy ủy quyền', (c.GiayUyQuyenSo || '') + (c.GiayUyQuyenNgay ? (' ngày ' + toInputDate(c.GiayUyQuyenNgay)) : '')],
          ['Tài khoản VND', c.TaiKhoanVND], ['Tài khoản USD', c.TaiKhoanUSD],

        ];

  function onKhachHangInput(inputEl) {

    if (!kh) return;

  // ---------- Dropdown chọn nhanh / gõ tên để lọc "Tên người hưởng" (từ Danh mục khách hàng) ----------
  var KH_DROPDOWN_INPUT = null;

  function moDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function locDanhSachKH(inputEl) {
    KH_DROPDOWN_INPUT = inputEl;
    renderDanhSachKH_(inputEl.value.trim());
  }

  function renderDanhSachKH_(tuKhoa) {
    var dd = document.getElementById('ddKhachHang');
    if (!KH_DROPDOWN_INPUT) return;
    var tk = tuKhoa.trim().toUpperCase();
    var ds = AppDataStore.khachHang.filter(function (k) {
      if (!tk) return true;
      return String(k.TenKhachHang || '').toUpperCase().indexOf(tk) >= 0;
    });

    if (!ds.length) {
      dd.innerHTML = '<div class="kh-empty">Không có khách hàng khớp — vẫn có thể tự gõ tên mới.</div>';
    } else {
      dd.innerHTML = '';
      ds.forEach(function (k) {
        var item = document.createElement('div');
        item.className = 'kh-item';
        item.textContent = k.TenKhachHang + (k.MaSoThue ? ' — MST ' + k.MaSoThue : '');
        item.onmousedown = function (e) {
          e.preventDefault(); // giữ focus, tránh blur trước khi xử lý chọn
          chonKHTuDropdown_(k);
        };
        dd.appendChild(item);
      });
    }

    var rect = KH_DROPDOWN_INPUT.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 2) + 'px';
    dd.style.width = Math.max(rect.width, 220) + 'px';
    dd.style.display = 'block';
  }

  function chonKHTuDropdown_(k) {
    if (!KH_DROPDOWN_INPUT) return;
    KH_DROPDOWN_INPUT.value = k.TenKhachHang;
    var tr = KH_DROPDOWN_INPUT.closest('tr');
    if (tr) {
      tr.querySelector('.ct-stk').value = k.SoTaiKhoan || '';
      tr.querySelector('.ct-nh').value = k.TaiNganHang || '';
    }
    dongDanhSachKH();
  }

  function dongDanhSachKH() {
    document.getElementById('ddKhachHang').style.display = 'none';
    KH_DROPDOWN_INPUT = null;
  }

  function apDungMauNoiDung(selEl) {
    var loai = selEl.value;

    noidungInput.value = tienTo + phanHD + phanNgay;

  function renderBangHopDongCuaCongTy_() {
    var tbody = document.getElementById('tbody_dsHopDong');
    var demEl = document.getElementById('hd_dem');
    if (!tbody) return;
    var tim = document.getElementById('hd_timKiem');
    function chuan(v) { return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase(); }
    var tk = chuan(tim && tim.value).trim();
    var ds = AppDataStore.hopDong.filter(function (h) { return !tk || chuan([h.SoHopDong, h.TenNganHang, h.ChiNhanh].join(' ')).indexOf(tk) >= 0; });
    if (demEl) demEl.textContent = '(' + ds.length + (tk ? '/' + AppDataStore.hopDong.length : '') + ' hợp đồng)';
    tbody.innerHTML = '';
    if (!AppDataStore.hopDong.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888; font-style:italic;">Chưa có hợp đồng nào. Bấm "➕ Thêm hợp đồng vay" để bắt đầu.</td></tr>';
      return;
    }
    if (!ds.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Không có hợp đồng khớp tìm kiếm.</td></tr>'; return; }
    ds.forEach(function (h) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><b>' + esc(h.SoHopDong) + '</b></td>' +
        '<td>' + esc(h.TenNganHang) + (h.ChiNhanh ? (' – ' + esc(h.ChiNhanh)) : '') + '</td>' +
        '<td style="text-align:right;">' + fmtTien((Number(h.HanMucVay) || 0)) + '</td>' +
        '<td>' + esc(ngayDanhMuc_(h.NgayHopDong)) + '</td>' +
        '<td><button type="button" class="btn btn-secondary" style="margin:0; padding:5px 10px; font-size:12px;" ' +
          'onclick="moHopDongChiTiet(\'' + h.MaHD + '\')">Xem chi tiết →</button></td>';
      tbody.appendChild(tr);
    });
  }

  // ---------- Hồ sơ lịch sử có số tiền lẻ: xem nguyên trạng, sửa thông tin khác KHÔNG ghi lại số tiền ----------
  var HO_SO_TIEN_LE_ = [];   // danh sách "vị trí = giá trị" lẻ của hồ sơ đang mở (rỗng = bình thường)

  function timTienLeClient_(hoSo, chiTiet) {
    var kq = [];
    function xet(viTri, v, vnd) {
      if (v === '' || v === null || v === undefined) return;
      var n = Number(v);
      if (isFinite(n) && (String((hoSo || {}).LoaiTien).toUpperCase() === 'USD' && !vnd ? !/^\d+(\.\d{1,2})?$/.test(String(n)) : Math.floor(n) !== n)) kq.push(viTri + ' = ' + fmtTien(n));
    }
    xet('Dư nợ hiện tại', hoSo.DuNoHienTai);
    xet('Số tiền nhận nợ lần này', hoSo.SoTienNhanNoLanNay);
    (chiTiet || []).forEach(function (ct, i) {
      xet('Dòng thụ hưởng ' + (i + 1) + ' – Số tiền', ct.SoTien);
      xet('Dòng thụ hưởng ' + (i + 1) + ' – Số tiền quy đổi', ct.SoTienQuyDoi, true);
    });
    return kq;
  }

  function datCheDoTienLe_(ds) {

    document.getElementById('bannerTienLe').style.display = coLe ? 'block' : 'none';
    document.getElementById('bannerTienLeChiTiet').textContent = coLe ? ('Số liệu lẻ: ' + HO_SO_TIEN_LE_.join('; ')) : '';
    var cacO = [document.getElementById('duNoHienTai')].concat(Array.prototype.slice.call(document.querySelectorAll('.ct-sotien')));
    cacO.forEach(function (o) { if (o) { o.readOnly = coLe; o.style.background = coLe ? '#F3F4F6' : ''; } });
  }

  function moKhoaSuaTien() {

  /** Hiện lại các link văn bản đã tạo trước đó (nếu có) khi mở xem/sửa 1 hồ sơ đã "Đã tạo hồ sơ"/"Đã giải ngân". */
  function hienLaiLinkDaTao_(hoSo) {
    var box = document.getElementById('linksBox');
    box.innerHTML = '';
    var danhSach = [
      ['Văn bản đề nghị giải ngân', hoSo.Link_VanBanDeNghi, hoSo.Link_VanBanDeNghi_DOCX, hoSo.Link_VanBanDeNghi_PDF, ''],
      [hoSo.LoaiChungTuThanhToan || 'Chứng từ chuyển tiền (UNC/Bảng kê)', hoSo.Link_ChungTuThanhToan, hoSo.Link_ChungTuThanhToan_DOCX, hoSo.Link_ChungTuThanhToan_PDF, hoSo.Link_ChungTuThanhToan_XLSX],
      ['Hợp đồng mua bán ngoại tệ giao ngay', hoSo.Link_HDMBNgoaiTe, hoSo.Link_HDMBNgoaiTe_DOCX, hoSo.Link_HDMBNgoaiTe_PDF, '']
    ];
    var coVanBan = danhSach.some(function (d) { return d[1] || d[2] || d[3] || d[4]; });
    if (!coVanBan) return;
    var tieuDe = document.createElement('div');
    tieuDe.className = 'hint';
    tieuDe.style.marginBottom = '4px';
    tieuDe.textContent = '📁 Văn bản đã tạo trước đó (bản mới nhất; các bản cũ xem ở tab "Mẫu Word" → Lịch sử phát hành):';
    box.appendChild(tieuDe);
    danhSach.forEach(function (d) {
      if (!d[1] && !d[2] && !d[3] && !d[4]) return;
      // d[1] = bản gốc (Google Doc/Sheet hoặc file DOCX), d[2] = DOCX, d[3] = PDF thật, d[4] = XLSX
      hienLinkCap_(d[0], { docUrl: d[1], docxUrl: d[2], pdfUrl: d[3], xlsxUrl: d[4] });
    });

  /**
   * Tự động tính "Ngày đến hạn" = "Ngày giải ngân" + "Thời hạn cho vay (số ngày)".
   * Ô "Ngày đến hạn" ở giao diện để readonly, không cho gõ tay.
   */
  function tinhNgayDenHan() {
    var ngayGN = document.getElementById('ngayGiaiNgan').value; // yyyy-mm-dd
    var soNgay = Number(document.getElementById('thoiHanChoVayNgay').value) || 0;
    var out = document.getElementById('ngayDenHan');
    if (!ngayGN || !soNgay) { out.value = ''; return; }
    var d = new Date(ngayGN + 'T00:00:00');
    d.setDate(d.getDate() + soNgay);
    out.value = toInputDate(d);
  }

  /** Hiển thị "Trạng thái hồ sơ" ở mục 1 (Nháp nếu đang tạo mới). */
  function capNhatTrangThaiHienThi_() {
    document.getElementById('trangThaiHoSoHienThi').value = TRANG_THAI_HIEN_TAI || 'Nháp';
  }

  /**
   * Khoá toàn bộ form (mục 1-3 + nút Lưu/Tạo văn bản) khi hồ sơ đã ở trạng thái "Đã giải ngân"
   * (chỉ cho xem, không cho sửa). Đồng thời hiện/ẩn các nút "Đã hoàn thành giải ngân" / "Xoá hồ sơ".
   */
  /**
   * Khoá form theo đúng quy trình trạng thái: Nháp (sửa tự do) -> Đã tạo hồ sơ (xem/sửa được, nhưng
   * sửa thật thì nên "Chuyển về Nháp" trước) -> Đã giải ngân (CHỈ xem/in, không sửa/xoá — chỉ Huỷ được
   * nếu giải ngân không thành công) -> Đã hủy (chỉ xem, chốt cuối, không còn thao tác nào khác).
   */
  function apDungKhoaFormTheoTrangThai() {
    var trangThai = TRANG_THAI_HIEN_TAI || 'Nháp';
    var khoaHan = (trangThai === 'Đã giải ngân' || trangThai === 'Đã hủy'); // chốt cuối — không sửa được nữa
    var khoaNoiDung = khoaHan || trangThai === 'Đã tạo hồ sơ'; // "Đã tạo hồ sơ": nội dung KHOÁ (muốn sửa → Chuyển về Nháp); vẫn phát hành lại chứng từ được
    var vungKhoa = document.querySelectorAll(
      '#hosoTab-congty input, #hosoTab-congty select,' +
      '#hosoTab-giaynhanno input, #hosoTab-giaynhanno select,' +
      '#tbodyChiTiet input, #tbodyChiTiet select, #tbodyChiTiet button'
    );
    vungKhoa.forEach(function (el) {
      if (el.hasAttribute('readonly') && (el.id === 'ngayDenHan' || el.id === 'soTienNhanNoLanNay')) return;
      el.disabled = khoaNoiDung;
    });

    document.querySelectorAll('#hosoTab-thuhuong .toolbar button,' +
      '#hosoTab-thuchien button.btn-primary, #hosoTab-thuchien button.btn-secondary,' +
      '#hosoTab-thuchien button.btn-success:not(#btnDaGiaiNgan)'
    ).forEach(function (btn) { btn.disabled = (btn.closest('#hosoTab-thuhuong') ? khoaNoiDung : khoaHan); });

    var coHoSo = !!MA_HO_SO_DANG_SUA;
    // Nút "Đã hoàn thành giải ngân": hiện khi hồ sơ đã lưu và chưa ở 2 trạng thái chốt cuối.
    document.getElementById('btnDaGiaiNgan').style.display = (coHoSo && trangThai === 'Đã tạo hồ sơ') ? 'inline-block' : 'none';
    var bdc = document.getElementById('btnDieuChinhGN'); if (bdc) bdc.style.display = (trangThai === 'Đã giải ngân') ? 'inline-block' : 'none';
    // Nút "Chuyển về Nháp để sửa": chỉ hiện khi đang "Đã tạo hồ sơ" (đã tạo văn bản nhưng muốn sửa lại).
    document.getElementById('btnVeNhap').style.display = (trangThai === 'Đã tạo hồ sơ') ? 'inline-block' : 'none';
    // Nút "Huỷ giải ngân": CHỈ hiện khi đang "Đã giải ngân" — đây là cách DUY NHẤT xử lý khi không thành công.
    document.getElementById('btnHuyGiaiNgan').style.display = (trangThai === 'Đã giải ngân') ? 'inline-block' : 'none';
    // Nút "Mở thư mục Drive của hồ sơ này": hiện ngay khi hồ sơ đã có Mã hồ sơ (đã lưu ít nhất 1 lần).
    document.getElementById('btnMoThuMucHoSoNay').style.display = coHoSo ? 'inline-block' : 'none';

    var banner = document.getElementById('bannerKhoa');
    if (banner) {
      banner.style.display = khoaNoiDung ? 'flex' : 'none';
      banner.innerHTML = (trangThai === 'Đã hủy')
        ? '🚫 Hồ sơ này đã <b>"Đã hủy"</b> — chỉ xem, không thể sửa/lưu lại.'
        : (trangThai === 'Đã tạo hồ sơ'
          ? '🔒 Hồ sơ <b>"Đã tạo hồ sơ"</b>: bộ chứng từ bắt buộc đã hoàn tất, nội dung bị khoá. Muốn sửa dữ liệu → "Chuyển về Nháp để sửa" (chứng từ cũ sẽ hết hiệu lực khi dữ liệu đổi). Khi ngân hàng đã chuyển tiền → "Xác nhận giải ngân thực tế".'
          : '🔒 Hồ sơ này đã ở trạng thái <b>"Đã giải ngân"</b> — chỉ xem, không thể sửa/lưu lại. Nếu ngân hàng chưa thực hiện/báo thất bại → "Hủy giải ngân"; nếu tiền đã chuyển mà phải xử lý → "Ghi nhận hoàn trả/điều chỉnh".');
    }
    capNhatHeaderChiTietHoSo_();
  }

  /** Chuyển hồ sơ "Đã tạo hồ sơ" về "Nháp" để sửa lại — hỏi xác nhận vì văn bản đã tạo trước đó
   *  không tự mất, nhưng có thể không còn khớp với dữ liệu sau khi sửa (cần tạo lại văn bản). */
  function chuyenVeNhapClick() {
    if (!MA_HO_SO_DANG_SUA) return;
    hoiXacNhan('Chuyển hồ sơ về "Nháp" để sửa? Các văn bản đã tạo trước đó KHÔNG bị xoá, nhưng có thể không còn khớp dữ liệu sau khi bạn sửa — nên tạo lại văn bản sau khi sửa xong.', function () {
      hienLoading(true);
      hakRun_().withSuccessHandler(function (res) {
        hienLoading(false);
        TRANG_THAI_HIEN_TAI = res.trangThai;
        if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
        capNhatTrangThaiHienThi_();
        apDungKhoaFormTheoTrangThai();
        baoThanhCong('Đã chuyển hồ sơ về "Nháp" — có thể sửa lại bình thường.');
        capNhatHoSoGocVaTongQuan_();
      }).withFailureHandler(function (err) { hienLoading(false); baoLoi(err); }).chuyenHoSoVeNhap(MA_HO_SO_DANG_SUA, 'Chuyển về Nháp để chỉnh sửa', REVISION_HIEN_TAI === null ? undefined : REVISION_HIEN_TAI);
    });
  }

  // ---------- GIẢI NGÂN THỰC TẾ: xác nhận / hủy / hoàn trả-điều chỉnh (mỗi thao tác cần thông tin + bằng chứng, backend kiểm tra) ----------
  function truongGN_(id) { return String(document.getElementById(id).value || '').trim(); }
  function dongModalGN_(id) { document.getElementById(id).style.display = 'none'; }

  function danhDauHoanThanhGiaiNgan() {
    if (!MA_HO_SO_DANG_SUA) { baoLoi('Vui lòng lưu hồ sơ trước.'); return; }
    if (FORM_HO_SO_BAN_) { baoLoi('Form có thay đổi chưa lưu — hãy lưu (hoặc bỏ thay đổi) trước khi xác nhận giải ngân.'); return; }
    if (TRANG_THAI_HIEN_TAI !== 'Đã tạo hồ sơ') { baoLoi('Chỉ xác nhận giải ngân khi hồ sơ ở trạng thái "Đã tạo hồ sơ" (bộ chứng từ bắt buộc đã hoàn tất).'); return; }
    var hs = AppDataStore.lay('HOSO', MA_HO_SO_DANG_SUA) || {};
    document.getElementById('gn_ngayThucTe').value = '';
    document.getElementById('gn_soThamChieu').value = '';
    document.getElementById('gn_soTien').value = hs.SoTienNhanNoLanNay !== undefined ? fmtTien(hs.SoTienNhanNoLanNay) : '';
    document.getElementById('gn_taiLieu').value = ''; document.getElementById('gn_ghiChu').value = '';
    document.getElementById('gn_loaiTien').textContent = String(hs.LoaiTien || 'VND');
    document.getElementById('gn_loi').textContent = '';
    document.getElementById('modalGiaiNgan').style.display = 'flex';
  }
  function guiXacNhanGiaiNgan() {
    var loi = document.getElementById('gn_loi');
    var soTien = truongGN_('gn_soTien');
    if (!truongGN_('gn_ngayThucTe') || !truongGN_('gn_soThamChieu') || !soTien || !truongGN_('gn_taiLieu')) { loi.textContent = 'Nhập đủ: ngày thực tế, số tham chiếu giao dịch ngân hàng, số tiền thực giải ngân, tài liệu xác nhận.'; return; }
    hienLoading(true);
    hakRun_().withSuccessHandler(function (res) {
      hienLoading(false); dongModalGN_('modalGiaiNgan');
      TRANG_THAI_HIEN_TAI = res.trangThai; if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
      capNhatTrangThaiHienThi_(); apDungKhoaFormTheoTrangThai(); taiXacNhanGN_();
      baoThanhCong('Đã ghi nhận xác nhận giải ngân thực tế (' + res.maXacNhan + ') — hồ sơ chuyển "Đã giải ngân".');
    }).withFailureHandler(function (err) { hienLoading(false); loi.textContent = (err && err.message) || String(err); })
      .xacNhanGiaiNganThucTe(MA_HO_SO_DANG_SUA, { ngayThucTe: truongGN_('gn_ngayThucTe'), soThamChieuNH: truongGN_('gn_soThamChieu'), soTienThucTe: soTien, taiLieuXacNhan: truongGN_('gn_taiLieu'), ghiChu: truongGN_('gn_ghiChu') }, REVISION_HIEN_TAI === null ? undefined : REVISION_HIEN_TAI);
  }

  /** Hủy: chỉ khi ngân hàng chưa thực hiện / báo thất bại. Tiền đã chuyển → dùng "Ghi nhận hoàn trả/điều chỉnh". */
  function huyGiaiNganClick() {
    if (!MA_HO_SO_DANG_SUA) return;
    document.getElementById('huy_loai').value = ''; document.getElementById('huy_lyDo').value = ''; document.getElementById('huy_bangChung').value = ''; document.getElementById('huy_loi').textContent = '';
    document.getElementById('modalHuyGN').style.display = 'flex';
  }
  function guiHuyGiaiNgan() {
    var loi = document.getElementById('huy_loi'), loai = truongGN_('huy_loai');
    if (!loai) { loi.textContent = 'Chọn tình huống: ngân hàng chưa thực hiện, hoặc ngân hàng báo thất bại. (Nếu tiền ĐÃ chuyển thì đóng cửa sổ này và dùng "Ghi nhận hoàn trả/điều chỉnh".)'; return; }
    if (!truongGN_('huy_lyDo')) { loi.textContent = 'Cần nhập lý do hủy giải ngân.'; return; }
    hienLoading(true);
    hakRun_().withSuccessHandler(function (res) {
      hienLoading(false); dongModalGN_('modalHuyGN');
      TRANG_THAI_HIEN_TAI = res.trangThai; if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
      capNhatTrangThaiHienThi_(); apDungKhoaFormTheoTrangThai(); taiXacNhanGN_();
      baoThanhCong('Đã hủy giải ngân hồ sơ ' + MA_HO_SO_DANG_SUA + ' (dữ liệu, chứng từ và xác nhận được giữ để đối chiếu).');
    }).withFailureHandler(function (err) { hienLoading(false); loi.textContent = (err && err.message) || String(err); })
      .huyGiaiNgan(MA_HO_SO_DANG_SUA, { loaiHuy: loai, lyDo: truongGN_('huy_lyDo'), bangChung: truongGN_('huy_bangChung') }, REVISION_HIEN_TAI === null ? undefined : REVISION_HIEN_TAI);
  }

  function dieuChinhGiaiNganClick() {
    ['dc_loai', 'dc_soTien', 'dc_soThamChieu', 'dc_ngay', 'dc_taiLieu', 'dc_lyDo'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('dc_loi').textContent = ''; document.getElementById('modalDieuChinhGN').style.display = 'flex';
  }
  function guiDieuChinhGiaiNgan() {
    var loi = document.getElementById('dc_loi');
    hienLoading(true);
    hakRun_().withSuccessHandler(function (res) {
      hienLoading(false); dongModalGN_('modalDieuChinhGN');
      if (res.revision !== undefined) REVISION_HIEN_TAI = res.revision;
      taiXacNhanGN_(); baoThanhCong('Đã ghi nhận ' + res.maXacNhan + '. Số tiền thực giải ngân ròng: ' + fmtTien(res.ronThucTe) + '.');
    }).withFailureHandler(function (err) { hienLoading(false); loi.textContent = (err && err.message) || String(err); })
      .ghiNhanDieuChinhGiaiNgan(MA_HO_SO_DANG_SUA, { loai: truongGN_('dc_loai'), huong: truongGN_('dc_loai') === 'DIEU_CHINH' ? truongGN_('dc_huong') : 'GIAM', soTien: truongGN_('dc_soTien'), soThamChieuNH: truongGN_('dc_soThamChieu'), ngayThucTe: truongGN_('dc_ngay'), taiLieuXacNhan: truongGN_('dc_taiLieu'), lyDo: truongGN_('dc_lyDo') }, REVISION_HIEN_TAI === null ? undefined : REVISION_HIEN_TAI);
  }
  /** Bảng xác nhận giải ngân thực tế của hồ sơ đang mở. */
  function taiXacNhanGN_() {
    var el = document.getElementById('gn_danhSach'); if (!el) return;
    if (!MA_HO_SO_DANG_SUA) { el.innerHTML = ''; return; }
    hakRun_().withSuccessHandler(function (r) {
      if (!r || !r.dong) { el.innerHTML = ''; return; }
      el.innerHTML = r.dong.length ? '<table class="detail"><thead><tr><th>Mã</th><th>Loại</th><th>Ngày thực tế</th><th>Số tham chiếu NH</th><th style="text-align:right;">Số tiền</th><th>Người</th><th>Trạng thái</th></tr></thead><tbody>' + r.dong.map(function (x) {
        return '<tr' + (x.trangThai === 'Hiệu lực' ? '' : ' style="opacity:.6"') + '><td>' + escH_(x.maXacNhan) + '</td><td>' + escH_(x.loai) + '</td><td>' + escH_(x.ngayThucTe) + '</td><td>' + escH_(x.soThamChieuNH) + '</td><td style="text-align:right;">' + fmtTien(x.soTien) + ' ' + escH_(x.loaiTien) + '</td><td>' + escH_(x.nguoi) + '</td><td>' + escH_(x.trangThai) + '</td></tr>';
      }).join('') + '</tbody></table><div class="hint">Giải ngân thực tế ròng: <b>' + fmtTien(r.ronThucTe) + '</b></div>' : '<div class="hint">Chưa có xác nhận giải ngân thực tế.</div>';
    }).withFailureHandler(function () { el.innerHTML = ''; }).layXacNhanGiaiNgan(MA_HO_SO_DANG_SUA);
  }

  // ---------- Điều hướng bảng mẹ/bảng con: Danh sách hồ sơ (mẹ) <-> Chi tiết 1 hồ sơ (con, có tab ngang) ----------

  /** Chuyển giữa "hoso-view-list" (bảng mẹ) và "hoso-view-detail" (bảng con, tab ngang). */
  function chuyenViewHoSo_(view) {
    document.getElementById('hoso-view-list').style.display = (view === 'list') ? 'block' : 'none';
    document.getElementById('hoso-view-detail').style.display = (view === 'detail') ? 'block' : 'none';
  }

  /** Bấm breadcrumb "Hồ sơ giải ngân" hoặc nút "← Danh sách hồ sơ" — quay về bảng mẹ. */
  function quayLaiDanhSachHoSo() {
    xacNhanBoThayDoi_(function () {
      chuyenViewHoSo_('list');
      locDanhSachHoSoClick();
      capNhatHoSoGocVaTongQuan_();
    });
  }

  // ---------- Cảnh báo thay đổi chưa lưu (form hồ sơ) ----------
  var FORM_HO_SO_BAN_ = false;
  function datFormBan_(v) { FORM_HO_SO_BAN_ = !!v; }
  /** Nếu form hồ sơ đang có thay đổi chưa lưu → hỏi trước khi rời; không thì chạy luôn. */
  function xacNhanBoThayDoi_(tiep) {
    var dangMo = document.getElementById('hoso-view-detail') && document.getElementById('hoso-view-detail').style.display !== 'none';
    if (FORM_HO_SO_BAN_ && dangMo) {
      hoiXacNhan('Hồ sơ đang soạn có thay đổi CHƯA LƯU. Rời khỏi màn hình này sẽ mất các thay đổi đó. Tiếp tục?', function () { datFormBan_(false); tiep(); });
    } else tiep();
  }
  window.addEventListener('beforeunload', function (e) { if (FORM_HO_SO_BAN_) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('input', function (e) { if (e.target && e.target.closest && e.target.closest('#hoso-view-detail')) FORM_HO_SO_BAN_ = true; });
  document.addEventListener('change', function (e) { if (e.target && e.target.closest && e.target.closest('#hoso-view-detail')) FORM_HO_SO_BAN_ = true; });

  /** Cập nhật breadcrumb + tiêu đề + badge trạng thái ở đầu màn chi tiết hồ sơ, dựa trên dữ liệu form hiện tại. */
  function capNhatHeaderChiTietHoSo_() {
    var elCrumb = document.getElementById('hoso_breadcrumbCurrent');
    var elTieuDe = document.getElementById('hoso_tieuDeChiTiet');
    var elMoTa = document.getElementById('hoso_moTaChiTiet');
    var elBadge = document.getElementById('hoso_badgeTrangThai');
    if (!elCrumb) return;

    var maHoSo = MA_HO_SO_DANG_SUA || '';
    var tenCty = '';
    var selCty = document.getElementById('selCongTy');
    if (selCty && selCty.selectedIndex >= 0) tenCty = selCty.options[selCty.selectedIndex].text;
    var laUSD = document.getElementById('loaiTienHoSo') && document.getElementById('loaiTienHoSo').value === 'USD';

    if (maHoSo) {
      elCrumb.textContent = maHoSo;
      elTieuDe.textContent = 'Hồ sơ ' + maHoSo;
      elMoTa.textContent = (tenCty ? tenCty + ' · ' : '') + (laUSD ? 'Vay USD' : 'Vay VND');
    } else {
      elCrumb.textContent = 'Hồ sơ mới';
      elTieuDe.textContent = 'Tạo hồ sơ giải ngân mới';
      elMoTa.textContent = 'Chọn công ty & hợp đồng, điền thông tin rồi lưu để tạo mã hồ sơ.';
    }

    var trangThai = TRANG_THAI_HIEN_TAI || 'Chưa lưu';
    elBadge.textContent = trangThai;
    var lopBadge = 'trangthai-nhap';
    if (trangThai === 'Đã giải ngân') lopBadge = 'trangthai-daigiaingan';
    else if (trangThai === 'Đã hủy') lopBadge = 'trangthai-huy';
    elBadge.className = 'trangthai-badge ' + lopBadge;
  }

  // ---------- Wizard theo từng bước: bước sau chỉ hiện ra sau khi bấm "Tiếp theo →" ở bước trước ----------
  var HOSO_BUOC_MO_TOI = 1; // 1 = chỉ thấy bước 1; đang tạo mới thì bắt đầu từ đây, đang sửa hồ sơ có sẵn thì mở hết (5)
  var THU_TU_BUOC_HOSO = ['congty', 'giaynhanno', 'taitailieu', 'thuhuong', 'thuchien'];

  /** Mở khoá tới bước soBuoc (1-5) — hiện các nút tab tương ứng, không tự ẩn lại các bước đã mở. */
  function moKhoaBuoc_(soBuoc) {
    HOSO_BUOC_MO_TOI = Math.max(HOSO_BUOC_MO_TOI, soBuoc);
    THU_TU_BUOC_HOSO.forEach(function (ten, idx) {
      var btn = document.getElementById('hosoTabBtn-' + ten);
      if (btn) btn.style.display = (idx + 1 <= HOSO_BUOC_MO_TOI) ? '' : 'none';
    });
  }

  /** Đưa wizard về đúng bước 1 (dùng khi bắt đầu tạo hồ sơ mới). */
  function datLaiBuocHoSo_() {
    HOSO_BUOC_MO_TOI = 1;
    THU_TU_BUOC_HOSO.forEach(function (ten, idx) {
      var btn = document.getElementById('hosoTabBtn-' + ten);
      if (btn) btn.style.display = (idx === 0) ? '' : 'none';

  // ---------- QUY TẮC TIỀN TỆ: VND nguyên; USD tối đa hai chữ số thập phân ----------
  // Dấu chấm là dấu phân cách hàng nghìn (25.000). Nhập 25.000,50 / 25000.50 / 0,5 => báo lỗi, KHÔNG tự
  // làm tròn hay cắt phần lẻ. Riêng Tỷ giá bán được phép có phần thập phân (dấu phẩy: 26.145,5).
  function nhomNghin_(chuoiSo) { return String(chuoiSo).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

  /** Hiển thị số tiền: số nguyên => 25.000. (Số lẻ từ dữ liệu lịch sử hiển thị đúng giá trị thật để dễ phát hiện.) */
  function fmtTien(n) {
    n = Number(n) || 0;
    if (Math.floor(n) === n) return (n < 0 ? '-' : '') + nhomNghin_(Math.abs(n));
    var p = String(n).split('.');
    return nhomNghin_(p[0].replace('-', '')) + ',' + p[1];
  }

  function congTienClient_(a, b) {
    function tach(v) { var n = Number(v) || 0, s = String(n); if (s.indexOf('e') >= 0) s = n.toFixed(10); var p = s.split('.'); return {so: BigInt(p[0] + (p[1] || '')), scale: (p[1] || '').length}; }
    var x = tach(a), y = tach(b), scale = Math.max(x.scale, y.scale);
    return Number(x.so * (BigInt(10) ** BigInt(scale - x.scale)) + y.so * (BigInt(10) ** BigInt(scale - y.scale))) / Math.pow(10, scale);
  }

  function fmtTyGia(n) {
    n = Number(n) || 0;
    var p = String(n).split('.');
    return nhomNghin_(p[0]) + (p[1] ? ',' + p[1] : '');
  }

  /** USD tối đa hai số thập phân; VND giữ số nguyên. */
  function tienUSDTrongO_(el) {
    if (el && el.id === 'gn_soTien') return document.getElementById('gn_loaiTien').textContent === 'USD';
    return !!(el && (el.id === 'duNoHienTai' || el.id === 'soTienNhanNoLanNay' || el.classList.contains('ct-sotien')) && document.getElementById('loaiTienHoSo').value === 'USD');
  }
  function layGiaTriSo_(v, ten, usd) {
    if (v === null || v === undefined || String(v).trim() === '') return 0;
    var s = String(v).replace(/[\s\u00a0]/g, '');
    if (typeof v === 'number') s = String(v);
    else if (usd && /^\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (usd && /^\d+(,\d{1,2})?$/.test(s)) s = s.replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!(usd ? /^\d+(\.\d{1,2})?$/ : /^\d+$/).test(s)) throw new Error((ten || 'Số tiền') + (usd ? ': USD nhận tối đa 2 chữ số thập phân (VD: 25.000,50 hoặc 25000.50).' : ': VND chỉ nhận số nguyên, dấu chấm phân cách hàng nghìn.'));
    var n = Number(s);
    if (!Number.isFinite(n) || n < 0 || (usd ? Math.round(n * 100) : n) > Number.MAX_SAFE_INTEGER) throw new Error((ten || 'Số tiền') + ': số tiền quá lớn.');
    return n;
  }

  /** Đọc Tỷ giá bán: cho phép phần thập phân kiểu VN (26.145,5). */
  function layTyGia_(v) {
    if (v === null || v === undefined) return 0;
    var s = String(v).replace(/[\s\u00A0]/g, '');
    if (s === '') return 0;
    if (/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s)) return Number(s.replace(/\./g, '').replace(',', '.'));
    if (/^\d+(,\d+)?$/.test(s)) return Number(s.replace(',', '.'));
    throw new Error('Tỷ giá bán: "' + v + '" không hợp lệ (VD: 26.145 hoặc 26.145,5).');
  }

  /** Đọc không ném lỗi, dùng khi tính tổng lúc đang gõ; ô sai được đánh dấu đỏ + tooltip lỗi. */
  function layGiaTriSoMem_(el, ten) {
    try {
      var n = layGiaTriSo_(el.value, ten, tienUSDTrongO_(el));
      el.classList.remove('tien-loi'); el.title = '';
      return { n: n, loi: '' };
    } catch (e) {
      el.classList.add('tien-loi'); el.title = e.message;
      return { n: 0, loi: e.message };
    }
  }

  /** Gõ tiền: tự định dạng hàng nghìn khi chỉ có chữ số; ký tự khác (dấu phẩy, chữ...) => đánh dấu lỗi. */
  function nhapTienInput(el) {
    var v = el.value;
    if (tienUSDTrongO_(el)) {
      // Giữ nguyên dấu đang gõ; chỉ định dạng sau khi rời ô, tránh biến 12.50 thành 1.250.
      try { if (!/[.,]$/.test(v)) layGiaTriSo_(v, 'Số tiền USD', true); el.classList.remove('tien-loi'); el.title = ''; }
      catch (e) { el.classList.add('tien-loi'); el.title = e.message; }
      return;
    }
    if (/^[\d.]*$/.test(v)) {
      var digits = v.replace(/\./g, '');
      var moi = digits ? nhomNghin_(digits.replace(/^0+(?=\d)/, '')) : '';
      if (moi !== v) el.value = moi;
      el.classList.remove('tien-loi'); el.title = '';
    } else {
      el.classList.add('tien-loi');
      el.title = 'Tiền chỉ nhận số nguyên, không nhập phần thập phân.';
    }
  }

  function formatSoNguyenInput(el) {
    var r = layGiaTriSoMem_(el, 'Số tiền');
    if (r.loi) { baoLoi(r.loi); return; }
    el.value = fmtTien(r.n);
  }

  function formatTyGiaInput(el) {
    try {
      var n = layTyGia_(el.value);

      el.value = n ? fmtTyGia_(n) : '';

  }
  function fmtTyGia_(n) { return fmtTyGia(n); }

  // ---------- Chọn chứng từ đính kèm theo Khoản mục giải ngân: hoá đơn (Sổ chi tiết mua hàng)
  // hoặc bảng lương (Bảng lương) — cùng dùng chung 1 modal, đổi nội dung theo loại. ----------
  var TAI_LIEU_ROW_ID = '';
  var TAI_LIEU_DANH_SACH = [];
  var TAI_LIEU_LOAI_HIEN_TAI = 'hoadon'; // 'hoadon' | 'luong'

  var TAI_LIEU_TEN_HIEN_TAI = ''; // Tên người hưởng đang tìm hoá đơn theo (để tải lại sau khi tải file mới)

  function moChonTaiLieu(rowId) {
    var tr = document.getElementById(rowId);
    var ten = tr.querySelector('.ct-ten').value.trim();
    var khoanMuc = tr.querySelector('.ct-khoanmuc').value;
    TAI_LIEU_ROW_ID = rowId;
    TAI_LIEU_LOAI_HIEN_TAI = (khoanMuc === KHOAN_MUC_CAN_LUONG) ? 'luong' : 'hoadon';
    TAI_LIEU_TEN_HIEN_TAI = ten;

    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon' && !ten) {
      baoLoi('Vui lòng nhập "Tên người hưởng" ở dòng này trước khi chọn hoá đơn.');
      return;
    }
    document.getElementById('modalTaiLieuTitle').textContent =
      (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') ? ('Chọn số hoá đơn — ' + ten) : 'Chọn dòng lương từ Bảng lương';
    document.getElementById('modalTaiLieuGhiChuTaiLen').textContent =
      (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon')
        ? 'Chưa thấy hoá đơn cần tìm? Tải lên ngay tại đây (tên nhà cung cấp đọc được cần khớp gần đúng với "' + ten + '") — không cần lưu hồ sơ trước.'
        : 'Chưa thấy dòng lương cần tìm? Tải file Bảng lương (.xlsx) lên ngay tại đây — không cần lưu hồ sơ trước.';
    document.getElementById('modalTaiLieu').style.display = 'flex';
    lamMoiDanhSachTaiLieuTrongModal_();
  }

  /** Gọi lại đúng nguồn dữ liệu (hoá đơn hoặc bảng lương) để làm mới danh sách trong modal — dùng cả
   *  khi mở modal lần đầu VÀ sau khi tải file mới lên ngay trong modal (mục "Chưa thấy... Tải lên"). */
  function lamMoiDanhSachTaiLieuTrongModal_() {
    document.getElementById('modalTaiLieuBody').innerHTML =
      '<div class="loading" style="display:block;">Đang tải dữ liệu...</div>';
    var xuLyKetQua = function (list) {
      TAI_LIEU_DANH_SACH = list || [];
      renderDanhSachTaiLieu_();
    };
    var xuLyLoi = function (err) {
      var msg = (err && err.message) ? err.message : String(err);
      document.getElementById('modalTaiLieuBody').innerHTML = '<div class="msg msg-err">Lỗi: ' + esc(msg) + '</div>';
    };
    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') {
      hakRun_().withSuccessHandler(xuLyKetQua).withFailureHandler(xuLyLoi)
        .layDanhSachTaiLieuTheoNhaCungCap(TAI_LIEU_TEN_HIEN_TAI, MA_HO_SO_DANG_SUA || '');
    } else {
      hakRun_().withSuccessHandler(xuLyKetQua).withFailureHandler(xuLyLoi)
        .layDanhSachBangLuongDeChon(MA_HO_SO_DANG_SUA || '');
    }
  }

  /** Tải nhanh 1 hoặc nhiều file hoá đơn/bảng lương NGAY TRONG modal chọn chứng từ — giải quyết đúng
   *  vấn đề "muốn chọn hoá đơn cho hồ sơ nhưng hồ sơ chưa lưu nên chưa có nơi để tải hoá đơn lên":
   *  không cần Mã hồ sơ, file được đọc/OCR ngay và hiện luôn trong danh sách để chọn tiếp. */
  function taiLenNhanhTuPicker_() {
    var input = document.getElementById('modalTaiLieuInputNhanh');
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var loaiTaiLieu = (TAI_LIEU_LOAI_HIEN_TAI === 'luong') ? 'BangLuong' : 'HoaDonGTGT';
    document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'block';
    taiLenNhanhLanLuot_(files, 0, loaiTaiLieu);
  }

  function taiLenNhanhLanLuot_(files, idx, loaiTaiLieu) {
    if (idx >= files.length) {
      document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
      document.getElementById('modalTaiLieuInputNhanh').value = '';
      lamMoiDanhSachTaiLieuTrongModal_();
      baoThanhCong('Đã tải lên ' + files.length + ' file — danh sách bên trên đã cập nhật, chọn tiếp bình thường.');
      return;
    }
    var file = files[idx];
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1];
      hakRun_().withSuccessHandler(function () {
        taiLenNhanhLanLuot_(files, idx + 1, loaiTaiLieu);
      }).withFailureHandler(function (err) {
        document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
        baoLoi('Lỗi khi tải "' + file.name + '": ' + ((err && err.message) || err));
      }).taiLenTaiLieuHoSo(MA_HO_SO_DANG_SUA || '', loaiTaiLieu, file.name, file.type, base64);
    };
    reader.onerror = function () {
      document.getElementById('modalTaiLieuLoadingNhanh').style.display = 'none';
      baoLoi('Không đọc được file "' + file.name + '".');
    };
    reader.readAsDataURL(file);
  }

  function renderDanhSachTaiLieu_() {
    var body = document.getElementById('modalTaiLieuBody');
    if (TAI_LIEU_LOAI_HIEN_TAI === 'hoadon') {
      if (!TAI_LIEU_DANH_SACH.length) {
        body.innerHTML = '<div class="msg msg-err">Không tìm thấy hoá đơn nào của nhà cung cấp này ' +
          '(có thể do tên chưa khớp với tên nhà cung cấp trên hoá đơn đã tải, Sổ chi tiết mua hàng chưa cấu hình, hoặc tất cả hoá đơn của nhà cung cấp này đã được dùng ở hồ sơ khác). ' +
          'Có thể tải hoá đơn lên ngay bên dưới.</div>';
        return;
      }
      var html = '<div style="max-height:340px; overflow:auto;"><table class="detail"><thead><tr>' +
        '<th style="width:26px;"></th><th>Số hoá đơn</th><th>Ngày</th><th>Diễn giải</th><th style="text-align:right;">Giá trị (VND)</th>' +
        '</tr></thead><tbody>';
      TAI_LIEU_DANH_SACH.forEach(function (it, i) {
        html += '<tr>' +
          '<td style="text-align:center;"><input type="checkbox" class="chk-taillieu" data-idx="' + i + '"></td>' +
          '<td>' + esc(it.sohd) + '</td>' +
          '<td>' + esc(it.ngay) + '</td>' +
          '<td>' + esc(it.dienGiai) + '</td>' +

          '</tr>';
